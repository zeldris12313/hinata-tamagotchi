name: Hinata iPhone Push Notify

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Hinata Push Check
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
        run: node scripts/hinata_push_bot.mjs
