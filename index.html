<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="icon" type="image/png" href="./icon.png?v=15">
  <link rel="apple-touch-icon" href="./icon.png?v=15">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Q版動漫電子雞｜日向翔陽生活養成記</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    body {
      font-family: 'Noto Sans TC', 'Inter', sans-serif;
      background: radial-gradient(circle at top, #fff1e6 0%, #ffd8be 55%, #ffc49b 100%);
      min-height: 100vh;
      margin: 0;
      color: #2d1e12;
      overflow-x: hidden;
    }
    .tama-shell {
      background: linear-gradient(165deg, #ff8533 0%, #ff6314 52%, #e64900 100%);
      box-shadow: 0 24px 50px rgba(217, 72, 15, 0.35), inset 0 6px 14px rgba(255, 255, 255, 0.5), inset 0 -10px 20px rgba(124, 35, 0, 0.35);
      border: 5px solid #fff7f0;
    }
    .hd-canvas { touch-action: none; }
    .ui-card { border: 2.5px solid #2d1e12; box-shadow: 0 4px 0 rgba(45, 30, 18, 0.85); }
    .dock-chip, .ctrl-pill { border: 2px solid #2d1e12; box-shadow: 0 3px 0 rgba(45, 30, 18, 0.85); touch-action: none; transition: transform 0.1s ease, opacity 0.15s ease; }
    .dock-chip:active, .ctrl-pill:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(45, 30, 18, 0.85); }
    .inscreen-dir {
      border: 2px solid rgba(45, 30, 18, 0.85);
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.25);
      transition: transform 0.1s ease, opacity 0.15s ease;
    }
    .inscreen-dir:active:not(:disabled) { transform: scale(0.9); }
    .inscreen-dir:disabled { opacity: 0.22; pointer-events: none; }
    #drag-ghost { position: fixed; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%) scale(1.25); font-size: 30px; }
  </style>
</head>
<body class="flex flex-col items-center justify-center p-3 sm:p-5">

  <div class="tama-shell w-full max-w-md rounded-[3rem] p-4 sm:p-5 relative">

    <!-- Top Bezel -->
    <div class="flex items-center justify-between mb-2 px-1.5 text-white">
      <div class="flex items-center gap-2">
        <span class="w-8 h-8 rounded-full bg-white/25 flex items-center justify-center text-base border-2 border-white/50">🏐</span>
        <div>
          <div class="flex items-center gap-1.5 flex-wrap"><h1 id="header-title" class="text-base sm:text-lg font-black tracking-wide leading-tight">日向翔陽</h1><span id="header-datetime" class="text-[10px] font-bold bg-white/25 px-2 py-0.5 rounded-full border border-white/40 whitespace-nowrap"></span></div>
          <p id="header-sub" class="text-[11px] text-orange-100">烏野 #10 · 現實時間同步</p>
        </div>
      </div>
      <div class="flex items-center gap-1.5">
        <button id="btn-sound" type="button" title="開關互動音效" class="w-8 h-8 rounded-full bg-white/25 hover:bg-white/35 border-2 border-white/50 flex items-center justify-center text-sm transition">🔊</button>
        <button id="btn-holiday" type="button" class="whitespace-nowrap px-2 py-1 rounded-full bg-white text-emerald-700 font-bold text-[10px] border-2 border-[#2d1e12] shadow-sm hover:bg-emerald-50 transition">🏖️ 設明日假期</button>
        <button id="btn-schedule" type="button" class="whitespace-nowrap px-2 py-1 rounded-full bg-white text-orange-600 font-bold text-[10px] border-2 border-[#2d1e12] shadow-sm hover:bg-orange-50 transition">📅 生活作息</button>
      </div>
    </div>

    <!-- Screen Frame -->
    <div class="bg-[#2d1e12] p-2.5 rounded-[1.75rem] shadow-inner">
      <!-- Top Mini HUD (現實時間已鎖定，不可手動調整) -->
      <div class="bg-[#fef3c7] border-b-2 border-[#2d1e12] rounded-t-2xl px-2.5 py-1.5 space-y-1 text-[11px] font-bold text-[#2d1e12]">
        <div class="flex items-center justify-between">
          <span id="time-display" class="bg-white/90 border border-[#2d1e12] px-1.5 py-0.5 rounded">🔒 現實時間</span>
          <span id="room-title-badge" class="bg-orange-500 text-white px-2 py-0.5 rounded text-[10px]">🏠 1F 客廳</span>
          <span>💖Lv.<span id="bond-level">1</span> · 🪙<span id="coins-count">50</span></span>
        </div>
        <div class="flex items-center justify-between text-[10px] bg-white/80 rounded-lg px-2 py-0.5 border border-amber-300">
          <span id="daily-cap-exp">📈 今日EXP 0/100</span>
          <span id="daily-cap-coins">🪙 今日金幣 0/80</span>
          <span id="daily-lock-badge" class="hidden text-rose-600 font-black">🔒 今日已鎖定上限</span>
        </div>
      </div>

      <!-- 600x600 HD Anime Room Canvas -->
      <div class="relative w-full aspect-square bg-sky-100 overflow-hidden">
        <canvas id="game-canvas" width="600" height="600" class="hd-canvas w-full h-full block cursor-pointer"></canvas>

        <!-- Speech Bubble -->
        <div id="speech-bubble" class="pointer-events-none absolute top-9 left-1/2 -translate-x-1/2 w-[84%] bg-white/95 border-2 border-[#2d1e12] rounded-2xl px-3 py-1.5 text-center text-xs font-bold text-[#2d1e12] shadow-md leading-snug z-10">
          「哥哥你返嚟啦！今日一齊練排球！」
        </div>

        <!-- In-Screen 4-Way Navigation Arrows -->
        <button id="dir-up" type="button" class="inscreen-dir absolute top-1.5 left-1/2 -translate-x-1/2 bg-white/85 hover:bg-orange-100 text-[#2d1e12] rounded-full px-3 py-0.5 text-xs font-black z-20 flex items-center gap-1" title="向上">
          <span>▲</span><span id="lbl-up" class="text-[9px] hidden sm:inline"></span>
        </button>
        <button id="dir-down" type="button" class="inscreen-dir absolute bottom-1.5 left-1/2 -translate-x-1/2 bg-white/85 hover:bg-orange-100 text-[#2d1e12] rounded-full px-3 py-0.5 text-xs font-black z-20 flex items-center gap-1" title="向下">
          <span>▼</span><span id="lbl-down" class="text-[9px] hidden sm:inline"></span>
        </button>
        <button id="dir-left" type="button" class="inscreen-dir absolute left-1.5 top-1/2 -translate-y-1/2 bg-white/85 hover:bg-orange-100 text-[#2d1e12] rounded-full w-8 h-8 text-xs font-black z-20 flex items-center justify-center" title="向左">◀</button>
        <button id="dir-right" type="button" class="inscreen-dir absolute right-1.5 top-1/2 -translate-y-1/2 bg-white/85 hover:bg-orange-100 text-[#2d1e12] rounded-full w-8 h-8 text-xs font-black z-20 flex items-center justify-center" title="向右">▶</button>

        <!-- Interactive Overlay (RPS / Chat / Jump Training) -->
        <div id="choice-overlay" class="hidden absolute bottom-11 left-1/2 -translate-x-1/2 w-[88%] bg-white/95 border-2 border-[#2d1e12] rounded-2xl p-2 shadow-xl z-30 flex flex-wrap items-center justify-center gap-1.5"></div>

        <!-- Rally Mini-game Overlay -->
        <div id="mg-hud" class="hidden pointer-events-none absolute bottom-10 left-1/2 -translate-x-1/2 bg-[#2d1e12]/90 text-white text-xs font-bold px-3.5 py-1 rounded-full shadow z-20">
          🏐 雙人對打：<span id="mg-score">0</span> 回合 ｜ <span id="mg-turn">輪到你接波！</span>
        </div>
      </div>

      <!-- Stat Bars -->
      <div class="bg-[#fff7ed] border-t-2 border-[#2d1e12] rounded-b-2xl px-3 py-2 grid grid-cols-3 gap-2 text-[11px] font-bold">
        <div>
          <div class="flex justify-between mb-0.5"><span>🍙 飽食</span><span id="val-hunger">80%</span></div>
          <div class="border border-[#2d1e12] bg-white h-2.5 rounded-full overflow-hidden"><div id="bar-hunger" class="h-full bg-amber-500 transition-all duration-300" style="width:80%"></div></div>
        </div>
        <div>
          <div class="flex justify-between mb-0.5"><span>😊 心情</span><span id="val-mood">85%</span></div>
          <div class="border border-[#2d1e12] bg-white h-2.5 rounded-full overflow-hidden"><div id="bar-mood" class="h-full bg-rose-500 transition-all duration-300" style="width:85%"></div></div>
        </div>
        <div>
          <div class="flex justify-between mb-0.5"><span>⚡ 精力</span><span id="val-energy">90%</span></div>
          <div class="border border-[#2d1e12] bg-white h-2.5 rounded-full overflow-hidden"><div id="bar-energy" class="h-full bg-emerald-500 transition-all duration-300" style="width:90%"></div></div>
        </div>
      </div>
    </div>

    <!-- Quick Controls -->
    <div class="mt-2.5 grid grid-cols-3 gap-1.5">
      <button id="btn-zoom" type="button" class="ctrl-pill bg-white hover:bg-orange-50 rounded-xl py-1.5 px-2 text-xs font-black flex items-center justify-center gap-1">
        <span id="zoom-icon">🔍</span><span id="zoom-label">放大特寫</span>
      </button>
      <button id="btn-outfit" type="button" class="ctrl-pill bg-white hover:bg-orange-50 rounded-xl py-1.5 px-2 text-xs font-black flex items-center justify-center gap-1">
        <span>👕</span><span id="outfit-name">烏野隊服</span>
      </button>
      <button id="btn-find-pet" type="button" class="ctrl-pill bg-amber-100 hover:bg-amber-200 rounded-xl py-1.5 px-2 text-xs font-black flex items-center justify-center gap-1">
        <span>🧭</span><span>搵日向</span>
      </button>
    </div>

    <!-- Bottom Interactive Dock -->
    <div class="mt-2.5 bg-[#fff7ed] ui-card rounded-2xl p-2">
      <div class="flex items-center justify-between gap-1.5 mb-1.5">
        <div class="flex gap-1">
          <button id="tab-food" type="button" class="px-2.5 py-0.5 rounded-lg text-[11px] font-black border-2 border-[#2d1e12] bg-orange-500 text-white">🍱 餵食</button>
          <button id="tab-act" type="button" class="px-2.5 py-0.5 rounded-lg text-[11px] font-black border-2 border-[#2d1e12] bg-white text-[#2d1e12]">✨ 互動 (8)</button>
        </div>
        <span class="text-[10px] font-bold text-orange-800">摸頭會笑開懷 😊 · 數值即時消耗</span>
      </div>
      <div id="dock-tray" class="grid grid-cols-4 gap-1.5"></div>
    </div>

    <!-- Footer -->
    <div class="mt-2.5 flex items-center justify-between text-[11px] text-orange-100 px-2">
      <span id="save-status">💾 已自動儲存</span>
      
    </div>

  </div>

  <div id="drag-ghost" class="hidden">🍙</div>

  <!-- Modal: 每日生活作息表 -->
  <div id="schedule-modal" class="hidden fixed inset-0 bg-black/55 backdrop-blur-xs z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl w-full max-w-sm p-5 shadow-2xl border-2 border-[#2d1e12] max-h-[82vh] flex flex-col">
      <div class="flex justify-between items-center mb-3 shrink-0">
        <h3 class="text-lg font-black text-orange-600">📅 翔陽每日生活作息表</h3>
        <button id="close-schedule" type="button" class="text-gray-400 hover:text-gray-700 font-bold text-lg px-2">✕</button>
      </div>
      <div id="schedule-list" class="space-y-2 overflow-y-auto pr-1 text-xs"></div>
    </div>
  </div>

  <!-- Modal: 角色切換 & 新增自訂角色 -->
  <div id="char-modal" class="hidden fixed inset-0 bg-black/55 backdrop-blur-xs z-50 flex items-center justify-center p-4">
    <div class="bg-[#fff7ed] ui-card rounded-3xl w-full max-w-md p-5 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-lg font-black text-[#2d1e12]">角色切換與新增</h2>
        <button id="btn-close-modal" type="button" class="w-8 h-8 rounded-full bg-orange-200 hover:bg-orange-300 flex items-center justify-center font-bold">✕</button>
      </div>
      <div id="char-list" class="space-y-2 mb-4"></div>
      <div class="border-t-2 border-orange-200 pt-3">
        <h3 class="text-sm font-black text-[#2d1e12] mb-2">＋ 新增自訂動漫角色</h3>
        <form id="add-char-form" class="space-y-2 text-xs">
          <div class="grid grid-cols-2 gap-2">
            <div><label class="block font-bold mb-1">角色名稱 *</label><input id="new-name" type="text" required placeholder="例如：孤爪研磨" class="w-full px-2.5 py-2 rounded-xl border-2 border-[#2d1e12] bg-white" /></div>
            <div><label class="block font-bold mb-1">稱號 / 背號</label><input id="new-sub" type="text" placeholder="例如：音駒 #5" class="w-full px-2.5 py-2 rounded-xl border-2 border-[#2d1e12] bg-white" /></div>
          </div>
          <div class="grid grid-cols-3 gap-2">
            <div><label class="block font-bold mb-1">髮色</label><input id="new-hair" type="color" value="#eab308" class="w-full h-8 rounded-lg border-2 border-[#2d1e12] cursor-pointer" /></div>
            <div><label class="block font-bold mb-1">瞳色</label><input id="new-eye" type="color" value="#ca8a04" class="w-full h-8 rounded-lg border-2 border-[#2d1e12] cursor-pointer" /></div>
            <div><label class="block font-bold mb-1">衫色</label><input id="new-shirt" type="color" value="#dc2626" class="w-full h-8 rounded-lg border-2 border-[#2d1e12] cursor-pointer" /></div>
          </div>
          <div><label class="block font-bold mb-1">見面台詞</label><input id="new-quote" type="text" placeholder="例如：哥哥，打機定練波好？" class="w-full px-2.5 py-2 rounded-xl border-2 border-[#2d1e12] bg-white" /></div>
          <button type="submit" class="w-full py-2.5 rounded-xl bg-orange-500 hover:bg-orange-600 text-white font-black text-sm border-2 border-[#2d1e12]">建立並切換角色</button>
        </form>
      </div>
    </div>
  </div>

  <div id="toast" class="hidden fixed bottom-5 left-1/2 -translate-x-1/2 bg-[#2d1e12] text-white text-xs font-bold px-4 py-2 rounded-full shadow-lg z-50"></div>

  <script>
    // =========================================================================
    // 1. 全套去背立繪（含摸頭專用笑面立繪）＋ 10間手繪動畫房間
    // =========================================================================
    const ASSET_URLS = {
      chibiJersey: "./assets/chibiJersey.png?v=15",
      chibiSchool: "./assets/chibiSchool.png?v=15",
      chibiPajama: "./assets/chibiPajama.png?v=15",
      portraitJersey: "./assets/portraitJersey.png?v=15",
      portraitJerseyHappy: "./assets/portraitJerseyHappy.png?v=15",
      portraitSchool: "./assets/portraitSchool.png?v=15",
      portraitSchoolHappy: "./assets/portraitSchoolHappy.png?v=15",
      portraitPajama: "./assets/portraitPajama.png?v=15",
      portraitPajamaHappy: "./assets/portraitPajamaHappy.png?v=15",
      portraitSleepy: "./assets/portraitSleepy.jpg?v=15",
      bg_living: "./assets/bg_living.jpg?v=15",
      bg_room_hinata: "./assets/bg_room_hinata.jpg?v=15",
      bg_kitchen: "./assets/bg_kitchen.jpg?v=15",
      bg_bath: "./assets/bg_bath.jpg?v=15",
      bg_room_aniki: "./assets/bg_room_aniki.jpg?v=15",
      bg_hallway: "./assets/bg_hallway.jpg?v=15",
      bg_backyard: "./assets/bg_backyard.jpg?v=15",
      bg_street: "./assets/bg_street.jpg?v=15",
      bg_school_class: "./assets/bg_school_class.jpg?v=15",
      bg_school_court: "./assets/bg_school_court.jpg?v=15",
      bg_konbini_morning: "./assets/bg_konbini_morning.jpg?v=15",
      bg_konbini_afternoon: "./assets/bg_konbini_afternoon.jpg?v=15",
      bg_konbini_night: "./assets/bg_konbini_night.jpg?v=15",
      chibiBrother: "./assets/chibiBrother.png?v=15",
      bg_main_street: "./assets/bg_main_street.jpg?v=15",
      bg_pharmacy: "./assets/bg_pharmacy.jpg?v=15",
      bg_canteen: "./assets/bg_canteen.jpg?v=15",
      bg_mall: "./assets/bg_mall.jpg?v=15",
      bg_park: "./assets/bg_park.jpg?v=15",
      bg_restaurant: "./assets/bg_restaurant.jpg?v=15"
    };
    const sprites = {};

    let assetLoadFailed = false;
    function loadAssets() {
      Object.keys(ASSET_URLS).forEach(k => {
        const im = new Image();
        im.onload = () => { sprites[k] = im; };
        im.onerror = () => { assetLoadFailed = true; };
        im.src = ASSET_URLS[k];
      });
    }

    // =========================================================================
    // 2. 每日上限 + 10 房間 + 精準家具座標
    // =========================================================================
    const DAILY_EXP_CAP = 100;
    const DAILY_COINS_CAP = 80;

    const MAP_ROOMS = {
      canteen:      { id: 'canteen',      name: '醫院 Canteen',    short: 'Canteen',  icon: '🍱', gx: 3, gy: -2, up: null, down: 'pharmacy', left: null, right: null },
      pharmacy:     { id: 'pharmacy',     name: '醫院藥房',        short: '藥房',     icon: '💊', gx: 3, gy: -1, up: 'canteen', down: 'main_street', left: null, right: null },
      park:         { id: 'park',         name: '海濱公園',        short: '公園',     icon: '🌳', gx: 2, gy: 0,  up: null, down: null, left: null, right: 'main_street' },
      main_street:  { id: 'main_street',  name: '繁華大街',        short: '大街',     icon: '🏙️', gx: 3, gy: 0,  up: 'pharmacy', down: 'street', left: 'park', right: 'mall' },
      mall:         { id: 'mall',         name: '大型商場',        short: '商場',     icon: '🛍️', gx: 4, gy: 0,  up: null, down: null, left: 'main_street', right: 'restaurant' },
      restaurant:   { id: 'restaurant',   name: '家庭餐廳',        short: '餐廳',     icon: '🍽️', gx: 5, gy: 0,  up: null, down: null, left: 'mall', right: null },
      room_hinata:  { id: 'room_hinata',  name: '2F 日向房',       short: '日向房',   icon: '🛏️', gx: 1, gy: 1,  up: null, down: 'living', left: null, right: 'room_aniki' },
      room_aniki:   { id: 'room_aniki',   name: '2F 哥哥房間',     short: '哥哥房',   icon: '🎮', gx: 2, gy: 1,  up: null, down: 'hallway', left: 'room_hinata', right: null },
      bath:         { id: 'bath',         name: '1F 廁所浴室',     short: '浴室',     icon: '🛁', gx: 0, gy: 2,  up: null, down: null, left: null, right: 'living' },
      living:       { id: 'living',       name: '1F 客廳',         short: '客廳',     icon: '🏠', gx: 1, gy: 2,  up: 'room_hinata', down: 'kitchen', left: 'bath', right: 'hallway' },
      hallway:      { id: 'hallway',      name: '1F 走廊玄關',     short: '走廊',     icon: '🚪', gx: 2, gy: 2,  up: 'room_aniki', down: 'backyard', left: 'living', right: 'street' },
      street:       { id: 'street',       name: '室外街道',        short: '街道',     icon: '🛣️', gx: 3, gy: 2,  up: 'main_street', down: 'school_class', left: 'hallway', right: 'konbini' },
      konbini:      { id: 'konbini',      name: '日式便利店',      short: '便利店',   icon: '🏪', gx: 4, gy: 2,  up: null, down: null, left: 'street', right: null },
      kitchen:      { id: 'kitchen',      name: '1F 廚房',         short: '廚房',     icon: '🍳', gx: 1, gy: 3,  up: 'living', down: null, left: null, right: 'backyard' },
      backyard:     { id: 'backyard',     name: '屋後院子',        short: '後院',     icon: '🏡', gx: 2, gy: 3,  up: 'hallway', down: null, left: 'kitchen', right: null },
      school_class: { id: 'school_class', name: '學校課室',        short: '課室',     icon: '🏫', gx: 3, gy: 3,  up: 'street', down: null, left: null, right: 'school_court' },
      school_court: { id: 'school_court', name: '室內學校排球場',  short: '室內球場', icon: '🏐', gx: 4, gy: 3,  up: null, down: null, left: 'school_class', right: null }
    };

    const ROOM_FURNITURE = {
      living: [
        { id: 'tea', label: '坐墊茶几', hx: 290, hy: 400, hr: 85, px: 280, py: 440, act: 'tea', line: '「同哥哥坐喺紅坐墊飲杯熱茶，暖笠笠好舒服！🍵」' },
        { id: 'tv',  label: '客廳電視梳化', hx: 485, hy: 330, hr: 90, px: 430, py: 420, act: 'tv', line: '「開電視！播緊烏野對戰精華呀哥哥快睇！📺」' },
        { id: 'stretch_lv', label: '客廳伸懶腰', hx: 160, hy: 420, hr: 85, px: 165, py: 440, act: 'stretch', line: '「喺客廳伸個大懶腰，成個人輕鬆晒～🙆‍♂️✨」' }
      ],

    function applyTimeStatsDelta(pet, elapsedMs) {
      const mins = Math.max(0, Math.min(480, elapsedMs / 60000));
      if (mins > 0.2) {
        pet.hunger = Math.max(25, pet.hunger - mins * 0.08);
        pet.mood = Math.max(30, pet.mood - mins * 0.04);
        pet.energy = pet.currentActivity === 'sleep' ? Math.min(100, pet.energy + mins * 0.4) : Math.max(20, pet.energy - mins * 0.05);
      }
      pet.lastUpdated = Date.now();

    function getCurrentHourInfo() {
      const now = new Date();
      const day = now.getDay();
      const today = getTodayStr();
      const isHolidayOverride = (state.holidayDate === today);
      const isWeekend = (day === 0 || day === 6) || isHolidayOverride;
      const hour = now.getHours();
      const min = now.getMinutes();
      const totalMin = hour * 60 + min;
      const hh = String(hour).padStart(2, '0'), mm = String(min).padStart(2, '0');
      const dayLabel = isHolidayOverride ? '二人假期' : (isWeekend ? '週末' : '平日');

      let period = 'day';
      if (hour >= 0 && hour < 6) period = 'night';
      else if (hour >= 6 && hour < 10) period = 'morning';
      else if (hour >= 16 && hour < 19) period = 'dusk';
      else if (hour >= 19 || hour < 6) period = 'evening';

      return { isWeekend, isHolidayOverride, hour, min, totalMin, period, label: `${dayLabel} ${hh}:${mm}`, isLateNight: period === 'night' };
    }

    function startCharacterWalkTransition(pet, destRoom, destAct, px, py) {
      if (pet.currentRoom === destRoom) { pet.currentActivity = destAct; targetX = px; targetY = py; saveState(); return; }
      transitionState = { phase: 'out', targetRoom: destRoom, targetActivity: destAct, tx: px, ty: py, alpha: 1 };
      if (viewRoomId === pet.currentRoom) speakAndShow(getActiveChar().dialogues.leaving[0]);
    }

    const FREE_ROAM_ROOMS = ['living', 'kitchen', 'hallway', 'backyard', 'room_hinata', 'room_aniki', 'bath', 'street', 'konbini'];
    const BROTHER_HOME_ROAM = ['living', 'kitchen', 'hallway', 'room_aniki', 'backyard'];
    let lastFreeRoamAt = 0;
    let lastBrotherRoamAt = 0;
    let lastDuoEventAt = 0;
    let lastPetAutoActAt = 0;
    let lastBroAutoActAt = 0;

    function startDuoOuting(type, durationMin, actName, toastMsg, speechMsg, fromMall = false) {
      const pet = ensurePetState(state.activeCharId);
      const bro = state.brother;
      let retAt = Date.now() + durationMin * 60 * 1000;
      if (type === 'mall') {
        const closeAt = new Date(); closeAt.setHours(21, 0, 0, 0);
        if (retAt > closeAt.getTime()) retAt = closeAt.getTime();
      }
      state.gamingReturnAt = null;
      state.outing = { type, returnAt: retAt, fromMall };
      if (type === 'restaurant') {
        const info = getCurrentHourInfo();
        if (!info.isWeekend) state.skipDinnerDate = getTodayStr();
      }
      const furn = (ROOM_FURNITURE[type] && ROOM_FURNITURE[type][0]) || { px: 280, py: 445, act: actName };
      pet.currentRoom = type; pet.currentActivity = actName || furn.act;
      petX = Math.max(120, furn.px - 45); petY = furn.py; targetX = petX; targetY = petY;
      bro.currentRoom = type; bro.currentActivity = actName || furn.act;
      bro.px = Math.min(480, furn.px + 55); bro.py = furn.py; bro.tx = bro.px; bro.ty = bro.py;
      viewRoomId = type;
      playSFX('levelup');
      if (speechMsg) speakAndShow(speechMsg);
      if (toastMsg) showToast(toastMsg);
      renderDock(); updateHUD(); saveState();
    }

    function endDuoOuting(customMsg) {
      const pet = ensurePetState(state.activeCharId);
      state.outing = { type: null, returnAt: null, fromMall: false };
      pet.scheduleSlotKey = null;
      state.brother.scheduleSlotKey = null;
      syncScheduleActivity(pet, true);
      viewRoomId = pet.currentRoom;
      if (customMsg) speakAndShow(customMsg);
      renderDock(); updateHUD(); saveState();
    }

    function syncScheduleActivity(pet, animateTransition = false) {
      const info = getCurrentHourInfo();
      const sched = getScheduledState(info);
      const bSched = getBrotherScheduledState(info);
      const bro = state.brother;

      // 1. Check bedtime cutoff for any active outing or gaming
      if (sched.act === 'sleep') {
        if (state.outing && state.outing.type) {
          state.outing = { type: null, returnAt: null, fromMall: false };
          showToast('夠鐘瞓覺，兩兄弟返到屋企啦！🌙');
        }
        if (state.gamingReturnAt) state.gamingReturnAt = null;
      }

      // 2. Check active outing timer
      if (state.outing && state.outing.type) {
        if (state.outing.returnAt && Date.now() >= state.outing.returnAt) {
          const oldType = state.outing.type;
          endDuoOuting(oldType === 'konbini' ? '「喺便利店買完嘢返屋企啦！🏪🏠」' : (oldType === 'mall' ? '「商場夠鐘啦，一齊返屋企休息！🛍️🏠」' : (oldType === 'park' ? '「喺公園吹完海風返屋企啦！🌳🏠」' : '「食飽飽返屋企啦！好滿足！🍽️🏠」')));
          return;
        }
        // Keep both in outing room
        return;
      }

      // 3. Gaming timer active -> keep both in room_aniki unless schedule changed
      if (state.gamingReturnAt && Date.now() >= state.gamingReturnAt) {
        state.gamingReturnAt = null;
        pet.scheduleSlotKey = null; bro.scheduleSlotKey = null;
        renderDock();
      }

      // 4. Sync Hinata
      if (pet.scheduleSlotKey === sched.key) {
        if (sched.freeRoam && !state.gamingReturnAt && !transitionState && !rally.active && Date.now() - lastFreeRoamAt > 45000) {
          lastFreeRoamAt = Date.now();
          const candidates = FREE_ROAM_ROOMS.filter(r => r !== pet.currentRoom);
          const nextRoom = candidates[Math.floor(Math.random() * candidates.length)];
          const furns = ROOM_FURNITURE[nextRoom] || [];
          const pick = furns.length ? furns[Math.floor(Math.random() * furns.length)] : { px: 280, py: 435, act: 'idle' };
          const nextAct = pick.act === 'sleep' ? 'idle' : pick.act;
          if (animateTransition) {
            startCharacterWalkTransition(pet, nextRoom, nextAct, pick.px - 35, pick.py);
          } else {
            pet.currentRoom = nextRoom; pet.currentActivity = nextAct;
            petX = pick.px - 35; petY = pick.py; targetX = petX; targetY = petY;
          }
          if (bSched.followHinata) {
            bro.currentRoom = nextRoom; bro.currentActivity = nextAct;
            bro.tx = Math.min(500, pick.px + 55); bro.ty = pick.py;
            if (!animateTransition) { bro.px = bro.tx; bro.py = bro.ty; }
          }
          updateHUD(); saveState();
        }
      } else {
        if (state.gamingReturnAt) {
          state.gamingReturnAt = null;
          renderDock();
          showToast('夠鐘下一個行程，已自動中斷打機！⏰');
        }
        pet.scheduleSlotKey = sched.key;
        pet.outfitIdx = sched.outfit;
        if (animateTransition && pet.currentRoom !== sched.room) {
          startCharacterWalkTransition(pet, sched.room, sched.act, sched.px, sched.py);
        } else {
          pet.currentRoom = sched.room; pet.currentActivity = sched.act;
          petX = sched.px; petY = sched.py; targetX = sched.px; targetY = sched.py;
          const pool = getActiveChar().dialogues[sched.act] || getActiveChar().dialogues.tea;
          if (viewRoomId === pet.currentRoom) speakAndShow(pickLine(pool));
        }
      }

      // 5. Sync Brother
      if (bro.scheduleSlotKey !== bSched.key) {
        bro.scheduleSlotKey = bSched.key;
        if (bSched.followHinata) {
          bro.currentRoom = pet.currentRoom; bro.currentActivity = pet.currentActivity;
          bro.tx = Math.min(500, targetX + 75); bro.ty = targetY;
          if (!animateTransition) { bro.px = bro.tx; bro.py = bro.ty; }
        } else {
          bro.currentRoom = bSched.room; bro.currentActivity = bSched.act;
          bro.tx = bSched.px; bro.ty = bSched.py;
          if (!animateTransition) { bro.px = bSched.px; bro.py = bSched.py; }
        }
      } else if (bSched.followHinata && !state.gamingReturnAt && !transitionState) {
        if (bro.currentRoom !== pet.currentRoom) {
          bro.currentRoom = pet.currentRoom; bro.currentActivity = pet.currentActivity;
          bro.tx = Math.min(500, targetX + 75); bro.ty = targetY;
        }
      } else if (bSched.homeRoam && Date.now() - lastBrotherRoamAt > 35000) {
        // 20:15-21:00: Brother roams home, occasionally enters Hinata's room to tutor; Hinata occasionally asks homework
        lastBrotherRoamAt = Date.now();
        const r = Math.random();
        if (r < 0.35) {
          bro.currentRoom = 'room_hinata'; bro.currentActivity = 'tutoring';
          bro.tx = 255; bro.ty = 430;
          if (viewRoomId === 'room_hinata') speakAndShow('「哥哥入房睇下我啲功課：呢條英文文法應該咁寫～📖✨」');
        } else if (r < 0.60 && !transitionState) {
          const bRoom = BROTHER_HOME_ROAM[Math.floor(Math.random() * BROTHER_HOME_ROAM.length)];
          bro.currentRoom = bRoom; bro.currentActivity = 'idle';
          bro.tx = 320; bro.ty = 435;
          startCharacterWalkTransition(pet, bRoom, 'asking_hw', 225, 435);
          if (viewRoomId === bRoom) speakAndShow('「哥哥！呢條數學題我唔識計呀，可唔可以教我？🙋‍♂️📝」');
        } else {
          const bRoom = BROTHER_HOME_ROAM[Math.floor(Math.random() * BROTHER_HOME_ROAM.length)];
          bro.currentRoom = bRoom; bro.currentActivity = 'idle';
          bro.tx = 320; bro.ty = 435;
          if (pet.currentRoom !== 'room_hinata') startCharacterWalkTransition(pet, 'room_hinata', 'homework', 165, 430);
        }
      }

      // 6. Occasional Evening TV / Weekend Free-Roam Duo Events (every ~75s chance)
      if (!state.gamingReturnAt && !transitionState && !rally.active && Date.now() - lastDuoEventAt > 75000) {
        const isEvTV = !info.isWeekend && sched.key === 'wd_living';
        const isWkFree = info.isWeekend && sched.freeRoam;
        if (isEvTV || isWkFree) {
          lastDuoEventAt = Date.now();
          const roll = Math.random();
          if (roll < 0.14 && isEvTV) {
            startDuoOuting('konbini', 10, 'konbini', '哥哥帶翔陽去便利店買宵夜（10分鐘）🏪', '「哥哥：翔陽，落去便利店買個熱肉包同牛奶？留10分鐘就返嚟！🏪🥟」');
          } else if (roll >= 0.14 && roll < 0.27) {
            startDuoOuting('park', 30, 'park_breeze', '翔陽約哥哥去公園吹海風（30分鐘）🌳', '「翔陽：哥哥我哋落公園散步吹下海風吖！留半個鐘就返～🌳🌊」');
          } else if (roll >= 0.27 && roll < 0.40) {
            pet.currentRoom = 'backyard'; pet.currentActivity = 'backyard';
            targetX = 250; targetY = 435;
            bro.currentRoom = 'backyard'; bro.currentActivity = 'backyard';
            bro.tx = 370; bro.ty = 435;
            if (viewRoomId === 'living' || viewRoomId === 'backyard') {
              viewRoomId = 'backyard';
              speakAndShow('「翔陽：哥哥同我去後院托兩球排球練下先！🏐✨」');
            }
          }
        }
      }

      // 7. Autonomous In-Room Interactions (every ~18s, excluding eating/cooking/bath/sleep)
      const nowMs = Date.now();
      const petFixed = ['sleep', 'waking', 'breakfast', 'lunch', 'dinner', 'cook', 'bath', 'brush'];
      if (!transitionState && !rally.active && !petFixed.includes(pet.currentActivity) && !['bath', 'canteen'].includes(pet.currentRoom) && nowMs - lastPetAutoActAt > 18000) {
        lastPetAutoActAt = nowMs;
        const furns = (ROOM_FURNITURE[pet.currentRoom] || []).filter(f => f.act !== 'sleep');
        if (furns.length > 1) {
          const pick = furns[Math.floor(Math.random() * furns.length)];
          pet.currentActivity = pick.act;
          targetX = pick.px - (bro.currentRoom === pet.currentRoom ? 35 : 0);
          targetY = pick.py;
          if (viewRoomId === pet.currentRoom) speakAndShow(pick.line);
        }
      }

      const broFixed = ['sleep', 'brush', 'cook_bfast', 'prep_bfast', 'cook_lunch', 'cook_dinner', 'breakfast', 'lunch', 'dinner', 'canteen_lunch', 'bath'];
      if (!broFixed.includes(bro.currentActivity) && !['bath', 'canteen', 'school_class', 'school_court'].includes(bro.currentRoom) && nowMs - lastBroAutoActAt > 18000) {
        lastBroAutoActAt = nowMs;
        const bFurns = (ROOM_FURNITURE[bro.currentRoom] || []).filter(f => f.act !== 'sleep');
        if (bFurns.length > 0) {
          const pick = bFurns[Math.floor(Math.random() * bFurns.length)];
          bro.currentActivity = pick.act;
          bro.tx = Math.min(500, pick.px + (bro.currentRoom === pet.currentRoom ? 45 : 0));
          bro.ty = pick.py;
        }
      }

      // 8. Execute Daily SMS Promises at their scheduled times
      const promises = (state.msgLog && state.msgLog.date === getTodayStr() && state.msgLog.promises) ? state.msgLog.promises : {};
      if (!state.outing.type && !state.gamingReturnAt && !transitionState) {
        if (!info.isWeekend && info.totalMin >= 1095 && info.totalMin < 1125 && promises.dinner === 'restaurant') {
          promises.dinner = 'done';
          startDuoOuting('restaurant', 60, 'restaurant', '照今朝訊息約定，一齊去餐廳食晚餐！🍽️', '「哥哥！我記得我哋今日約咗去餐廳食大餐㗎！好期待呀～🍽️❤️」');
        } else if (info.totalMin >= 1160 && info.totalMin < 1215 && promises.play_mode === 'study') {
          promises.play_mode = 'done';
          pet.currentRoom = 'room_hinata'; pet.currentActivity = 'homework'; targetX = 165; targetY = 430;
          bro.currentRoom = 'room_hinata'; bro.currentActivity = 'tutoring'; bro.tx = 255; bro.ty = 430;
          if (viewRoomId === 'room_aniki' || viewRoomId === 'room_hinata') {
            viewRoomId = 'room_hinata';
            speakAndShow('「哥哥！照今朝訊息講好咗一齊溫英文小測呀！📖❤️❤️」');
          }
        } else if (info.totalMin >= 1260 && info.totalMin < 1350) {
          if (promises.practice === true) {
            promises.practice = 'done';
            pet.currentRoom = 'backyard'; pet.currentActivity = 'backyard'; targetX = 245; targetY = 435;
            bro.currentRoom = 'backyard'; bro.currentActivity = 'backyard'; bro.tx = 370; bro.ty = 435;
            viewRoomId = 'backyard';
            speakAndShow('「哥哥！照約定一齊嚟後院加練排球啦！🏐🔥」');
          } else if (promises.konbini === true) {
            promises.konbini = 'done';
            startDuoOuting('konbini', 10, 'konbini', '照今朝訊息約定，一齊去便利店買宵夜（10分鐘）🏪', '「哥哥！我哋照約定落便利店買熱辣辣肉包啦！🏪🥟」');

    let audioCtx = null;
    function playTone(freq, dur = 0.07, wave = 'triangle', vol = 0.05) {
      if (!state.soundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = wave; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }
    function playSFX(kind) {
      if (kind === 'pat') playTone(660 + Math.random() * 140, 0.05, 'triangle', 0.06);
      else if (kind === 'eat') { playTone(440, 0.06); setTimeout(() => playTone(587, 0.08), 90); }
      else if (kind === 'bounce') { playTone(520, 0.05); setTimeout(() => playTone(780, 0.06), 45); }
      else if (kind === 'wake') { playTone(330, 0.08, 'sine'); setTimeout(() => playTone(440, 0.1, 'sine'), 90); }
      else if (kind === 'miss') playTone(220, 0.16, 'sawtooth', 0.06);
      else if (kind === 'levelup') [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => playTone(f, 0.1), i * 85));
    }

      ctx.fillStyle = 'rgba(0,0,0,0.20)';
      ctx.beginPath(); ctx.ellipse(bx, by + 72, 42, 11, 0, 0, Math.PI * 2); ctx.fill();
      ctx.translate(bx, by + bounce);
      ctx.scale(breathSx, breathSy);
      ctx.drawImage(img, -drawW / 2, -drawH / 2 - 14, drawW, drawH);
      ctx.restore();
      drawBrotherBadge(bx, by + bounce, isWalking ? 'street' : act);
    }

    function drawBrotherBadge(cx, cy, act) {
      const text = BROTHER_ACTIVITY_LABELS[act] || '✨ 哥哥喺度';
      ctx.save();
      ctx.font = 'bold 12px "Noto Sans TC", sans-serif';
      const tw = ctx.measureText(text).width + 20;
      const bx = Math.max(10, Math.min(600 - tw - 10, cx - tw / 2));
      const by = Math.max(48, cy - 128);
      roundRect(bx, by, tw, 26, 13, 'rgba(30, 41, 59, 0.90)', '#fbbf24', 2);
      ctx.fillStyle = '#fef3c7';
      ctx.textAlign = 'center';
      ctx.fillText(text, bx + tw / 2, by + 17);
      ctx.restore();
    }

    function drawArticulatedChibi(char, outfit, pet, frame) {
      const act = tempOverrideMode || pet.currentActivity;
      const room = pet.currentRoom;

      if (room === 'bath' && act === 'bath') {
        const cx = 395, cy = 332 + Math.sin(frame * 0.09) * 3;
        drawFullChibiSprite(cx, cy, 0, 'happy', outfit, frame, 0.82, 1, 1);
        roundRect(368, cy - 82, 54, 16, 8, '#ffffff', '#64748b', 2);
        drawOverheadBadge(cx, cy - 10, act, frame);
        return;
      }

      if (room === 'room_hinata' && (act === 'sleep' || act === 'waking')) {
        const sleepBreath = act === 'sleep' ? Math.sin(frame * 0.05) * 3.0 : 0;
        drawFullChibiSprite(472, 344 + sleepBreath * 0.5, act === 'sleep' ? -0.04 : 0.04, act, outfit, frame, 0.82, 1, 1);
        return;
      }

      const cx = petX, cy = petY;
      const isWalking = transitionState !== null || (Math.hypot(targetX - petX, targetY - petY) > 5);
      const isJumping = (act === 'school_court' || act === 'backyard' || act === 'jump') && !isWalking && !rally.active;
      const jumpY = isJumping ? -Math.abs(Math.sin(frame * 0.16)) * 55 : (act === 'happy' || isPetting ? -Math.abs(Math.sin(frame * 0.18)) * 16 : ((isWalking || act === 'park_jog' || act === 'court_run') ? -Math.abs(Math.sin(frame * 0.24)) * 11 : 0));
      const breathSy = 1 + Math.sin(frame * 0.07) * 0.024;
      const breathSx = 1 - Math.sin(frame * 0.07) * 0.014;
      const tilt = isWalking ? Math.sin(frame * 0.24) * 0.08 : (isPetting ? Math.sin(frame * 0.15) * 0.07 : Math.sin(frame * 0.04) * 0.02);

      ctx.save();
      if (transitionState) ctx.globalAlpha = transitionState.alpha;
      ctx.fillStyle = 'rgba(0,0,0,0.22)';
      ctx.beginPath(); ctx.ellipse(cx, cy + 72, 46, 12, 0, 0, Math.PI * 2); ctx.fill();
      drawFullChibiSprite(cx, cy + jumpY, tilt, act, outfit, frame, 1, breathSx, breathSy);
      if (act === 'tea' && !isWalking) { ctx.font = '24px sans-serif'; ctx.fillText('🍵', cx + 42, cy + 28); }
      if (act === 'brush' && !isWalking) { ctx.font = '24px sans-serif'; ctx.fillText('🪥', cx + 38, cy + 10); }
      if ((act === 'lunch' || act === 'dinner') && !isWalking) { ctx.font = '24px sans-serif'; ctx.fillText('🍱', cx + 40, cy + 25); }
      if (act === 'gaming' && !isWalking) { ctx.font = '24px sans-serif'; ctx.fillText('🎮', cx + 42, cy + 25); }
      ctx.restore();
      drawOverheadBadge(cx, cy + jumpY, isWalking ? 'idle' : act, frame);
    }

    // 放大特寫：使用當前房間動畫背景＋去背立繪，摸摸時直接切換成開心笑面立繪（唔再疊假紅暈）！
    function drawLiveZoomedPortrait(pet, outfit, timeInfo, frame) {
      drawAnimeRoomBackground(viewRoomId, timeInfo);
      ctx.fillStyle = 'rgba(255, 250, 240, 0.20)';
      ctx.fillRect(0, 0, 600, 600);

      const act = tempOverrideMode || pet.currentActivity;
      const isSleepingMode = (act === 'sleep' || act === 'waking');
      const isBathingMode = (pet.currentRoom === 'bath' && act === 'bath');
      let img;
      if (isSleepingMode) {
        img = sprites.portraitSleepy;
      } else if (isBathingMode) {
        img = (isPetting || act === 'happy') ? sprites.portraitBathHappy : sprites.portraitBath;
      } else if (isPetting || act === 'happy') {
        img = sprites[outfit.happyKey] || sprites[outfit.portraitKey];
      } else {
        img = sprites[outfit.portraitKey] || sprites.portraitJersey;
      }
      if (!img) return;

      const sway = isPetting ? Math.sin(frame * 0.16) * 0.022 : Math.sin(frame * 0.04) * 0.008;
      const breathScale = 1.0 + Math.sin(frame * 0.06) * 0.012 + (isPetting ? 0.02 : 0);
      ctx.save();
      ctx.translate(300, 315); ctx.rotate(sway); ctx.scale(breathScale, breathScale);
      ctx.drawImage(img, -300, -300, 600, 600);
      ctx.restore();

      if (act === 'sleep') {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.35)'; ctx.fillRect(0, 0, 600, 600);
        ctx.font = 'bold 42px sans-serif'; ctx.fillStyle = '#e0e7ff'; ctx.textAlign = 'center'; ctx.fillText('Zzz… 💭🏐', 470, 140);
      }
    }

    // =========================================================================
    // 5. 雙人接波對打 + 主迴圈
    // =========================================================================
    let frameCount = 0;
    function endRally(msg, pet) {
      rally.active = false;
      document.getElementById('mg-hud').classList.add('hidden');
      const capped = grantCappedRewards(pet, Math.min(20, rally.score * 3 + 3), Math.min(24, rally.score * 4 + 2));
      pet.mood = Math.min(100, pet.mood + 10);
      playSFX('miss');
      speakAndShow(`${msg} 總共對打咗 ${rally.score} 回合！${capped ? '（今日上限已滿 🔒）' : ''}`);
      updateHUD(); saveState();
    }

    function updateRally(pet) {
      if (!rally.active) return;
      rally.bx += rally.bvx; rally.by += rally.bvy; rally.bvy += 0.24;
      if (rally.bx < 40 || rally.bx > 560) rally.bvx *= -1;
      if (rally.by < 55) { rally.by = 55; rally.bvy = Math.abs(rally.bvy); }

      if (rally.turn === 'hinata') {
        targetX = Math.max(80, Math.min(520, rally.bx)); targetY = 435;
        petX += (targetX - petX) * 0.14;
        if (rally.bvy > 0 && Math.hypot(rally.bx - petX, rally.by - (petY - 20)) < 58) {
          if (Math.random() < 0.15) { endRally('「嗚哇！翔陽飛撲都差少少接到個波！💦」', pet); return; }
          rally.score++;
          document.getElementById('mg-score').textContent = rally.score;
          document.getElementById('mg-turn').textContent = '輪到你接波！(點擊排球)';
          rally.turn = 'user'; rally.bvy = -10.5; rally.bvx = (Math.random() - 0.5) * 6;
          playSFX('bounce'); particles.push({ x: petX, y: petY - 80, text: '接得好! 🏐', color: '#facc15', life: 24 });
        } else if (rally.by > 530) {
          endRally('「哎呀！翔陽趕唔切接到個波！😅」', pet);
        }
      } else if (rally.by > 535) {
        endRally('「哥哥跌波啦！下次反應再快少少！😆」', pet);
      }
    }

    function updateAI() {
      const char = getActiveChar(), pet = ensurePetState(char.id);
      const now = Date.now(), idleSec = (now - lastInteractAt) / 1000;
      syncScheduleActivity(pet, true);

      if (transitionState) {
        if (transitionState.phase === 'out') {
          petX += (540 - petX) * 0.08;
          transitionState.alpha = Math.max(0, transitionState.alpha - 0.04);
          if (transitionState.alpha <= 0.05) {
            pet.currentRoom = transitionState.targetRoom; pet.currentActivity = transitionState.targetActivity;
            petX = 70; targetX = transitionState.tx; targetY = transitionState.ty;
            transitionState.phase = 'in'; updateHUD();
          }
        } else if (transitionState.phase === 'in') {
          petX += (targetX - petX) * 0.08; petY += (targetY - petY) * 0.08;
          transitionState.alpha = Math.min(1, transitionState.alpha + 0.05);
          if (transitionState.alpha >= 0.98) {
            transitionState = null;
            const pool = char.dialogues[pet.currentActivity] || char.dialogues.tea;
            if (viewRoomId === pet.currentRoom) speakAndShow(pickLine(pool));
            saveState();
          }
        }
        return;
      }

      if (pet.currentActivity === 'waking' && idleSec > 10) {
        pet.currentActivity = 'sleep';
        if (viewRoomId === pet.currentRoom) speakAndShow(char.dialogues.backToSleep[0]);
        updateHUD();
      }

      if (!rally.active && pet.currentRoom !== 'bath' && pet.currentActivity !== 'sleep' && pet.currentActivity !== 'waking') {
        const dx = targetX - petX, dy = targetY - petY;
        if (Math.hypot(dx, dy) > 4) { petX += dx * 0.045; petY += dy * 0.045; }
      }
      if (state.brother) {
        const bro = state.brother;
        const bdx = bro.tx - bro.px, bdy = bro.ty - bro.py;
        if (Math.hypot(bdx, bdy) > 3) { bro.px += bdx * 0.05; bro.py += bdy * 0.05; }
      }
      if (frameCount % 240 === 0) dreamIdx++;
    }

    function gameLoop() {
      frameCount++; updateAI();
      const char = getActiveChar(), pet = ensurePetState(char.id);
      const outfit = OUTFITS[pet.outfitIdx || 0] || OUTFITS[0];
      const timeInfo = getCurrentHourInfo();
      ctx.clearRect(0, 0, 600, 600);

      if (isZoomed) {
        drawLiveZoomedPortrait(pet, outfit, timeInfo, frameCount);
      } else {
        drawAnimeRoomBackground(viewRoomId, timeInfo);
        drawBrotherChibi(frameCount);
        if (pet.currentRoom === viewRoomId) drawArticulatedChibi(char, outfit, pet, frameCount);
        drawAnimeRoomForeground(viewRoomId, frameCount, pet);

        if (rally.active) {
          updateRally(pet);
          if (rally.turn === 'user') {
            ctx.strokeStyle = 'rgba(250, 204, 21, 0.85)'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.arc(rally.bx, rally.by, 42, 0, Math.PI * 2); ctx.stroke();
          }
          ctx.font = '52px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('🏐', rally.bx, rally.by + 16);
        } else if (pet.currentRoom === viewRoomId && (pet.currentRoom === 'school_court' || pet.currentRoom === 'backyard')) {
          const by = 270 - Math.abs(Math.sin(frameCount * 0.14)) * 75;
          ctx.font = '44px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('🏐', petX + 65, by);
        }
      }

      if (flyingFood) {
        flyingFood.x += (flyingFood.targetX - flyingFood.x) * 0.18;
        flyingFood.y += (flyingFood.targetY - flyingFood.y) * 0.18;
        ctx.font = '44px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(flyingFood.emoji, flyingFood.x, flyingFood.y);
        if (Math.hypot(flyingFood.targetX - flyingFood.x, flyingFood.targetY - flyingFood.y) < 12) { completeFeed(flyingFood.food); flyingFood = null; }
      }

      if (isPetting) {
        ctx.save(); ctx.translate(handPos.x, handPos.y + Math.sin(frameCount * 0.3) * 8);
        ctx.font = '54px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('🫳', 0, 12); ctx.restore();
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i]; pt.y -= 1.6; pt.life--;
        ctx.fillStyle = pt.color; ctx.font = 'bold 26px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(pt.text, pt.x, pt.y);
        if (pt.life <= 0) particles.splice(i, 1);
      }
      requestAnimationFrame(gameLoop);
    }

    function grantCappedRewards(pet, expAmt, coinAmt) {
      let cappedNow = false;
      if (expAmt > 0) {
        const allowExp = Math.min(expAmt, Math.max(0, DAILY_EXP_CAP - pet.dailyExpGained));
        if (allowExp > 0) {
          pet.dailyExpGained += allowExp; pet.bondExp += allowExp;
          while (pet.bondExp >= 100) { pet.bondExp -= 100; pet.bondLevel += 1; playSFX('levelup'); showToast(`好感度升到 Lv.${pet.bondLevel}！💖`); }
        } else cappedNow = true;
      }
      if (coinAmt > 0) {
        const allowCoins = Math.min(coinAmt, Math.max(0, DAILY_COINS_CAP - pet.dailyCoinsGained));
        if (allowCoins > 0) { pet.dailyCoinsGained += allowCoins; pet.coins += allowCoins; }
        else cappedNow = true;
      }
      return cappedNow;
    }

    // =========================================================================
    // 6. 互動處理（8種豐富互動＋摸頭切笑面立繪）
    // =========================================================================
    function getCanvasCoords(clientX, clientY) {
      const r = canvas.getBoundingClientRect();
      return { x: ((clientX - r.left) / r.width) * 600, y: ((clientY - r.top) / r.height) * 600 };
    }
    function pickLine(a) { return a[Math.floor(Math.random() * a.length)]; }
    function showToast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.remove('hidden'); setTimeout(() => t.classList.add('hidden'), 2400); }

    function isTouchingHinata(cx, cy) {
      if (isZoomed) return Math.hypot(cx - 300, cy - 300) <= 230;
      return Math.hypot(cx - petX, cy - (petY - 12)) <= 85;
    }

    function showSleepLockedMsg() {
      playSFX('miss');
      speakAndShow('「翔陽熟睡中…要手動撳房間傢俬（例如床鋪／書枱）先會叫醒佢互動 😴」');
      showToast('熟睡中 🔒 請先撳房間傢俬叫醒');
    }

    function wakeUpCharacter() {
      const char = getActiveChar(), pet = ensurePetState(char.id);
      pet.currentActivity = 'waking'; lastInteractAt = Date.now();
      playSFX('wake'); speakAndShow(pickLine(char.dialogues.waking)); updateHUD();
    }

    function triggerPetHead(cx, cy) {
      const char = getActiveChar(), pet = ensurePetState(char.id);
      if (!isZoomed && pet.currentRoom !== viewRoomId) return;
      if (!isTouchingHinata(cx, cy)) { isPetting = false; return; }
      lastInteractAt = Date.now();
      if (pet.currentActivity === 'sleep') { showSleepLockedMsg(); return; }
      isPetting = true; handPos = { x: cx, y: cy }; petTickAcc++;
      if (petTickAcc % 8 === 1) {
        playSFX('pat'); pet.mood = Math.min(100, pet.mood + 3);
        const isCapped = grantCappedRewards(pet, 3, 2);
        particles.push({ x: cx + (Math.random() * 34 - 17), y: cy - 20, text: '💖', color: '#f43f5e', life: 36 });
        if (petTickAcc % 24 === 1) speakAndShow(isCapped && Math.random() < 0.35 ? char.dialogues.capped[0] : pickLine(char.dialogues.pet));
        updateHUD(); saveState();
      }
    }

    canvas.addEventListener('pointerdown', (e) => {
      lastInteractAt = Date.now();
      const { x, y } = getCanvasCoords(e.clientX, e.clientY);
      const char = getActiveChar(), pet = ensurePetState(char.id);

      if (rally.active) {
        if (rally.turn === 'user' && Math.hypot(x - rally.bx, y - rally.by) <= 78) {
          rally.turn = 'hinata'; rally.bvy = -10.8; rally.bvx = (Math.random() - 0.5) * 7;
          document.getElementById('mg-turn').textContent = '翔陽撲去接波中…';
          playSFX('bounce');
          particles.push({ x: rally.bx, y: rally.by - 20, text: '好波! ✨', color: '#38bdf8', life: 22 });
        }
        return;
      }

      if (!isZoomed && pet.currentRoom !== viewRoomId) {
        if (state.brother && state.brother.currentRoom === viewRoomId && Math.hypot(x - state.brother.px, y - state.brother.py) <= 95) {
          playSFX('pat');
          speakAndShow(pickLine(BROTHER_MISS_THOUGHTS));
          particles.push({ x: state.brother.px, y: state.brother.py - 80, text: '💛 哥哥', color: '#f59e0b', life: 36 });
          return;
        }
        showToast(`日向喺【${MAP_ROOMS[pet.currentRoom].short}】！`); return;
      }
      if (!isZoomed) {
        const furn = (ROOM_FURNITURE[viewRoomId] || []).find(f => Math.hypot(x - f.hx, y - f.hy) <= f.hr);
        if (furn && pet.currentActivity === 'sleep') {
          targetX = furn.px; targetY = furn.py; pet.currentActivity = furn.act;
          playSFX('wake'); speakAndShow(furn.line);
          particles.push({ x: furn.hx, y: furn.hy - 20, text: '叫醒! ✨', color: '#f59e0b', life: 30 });
          updateHUD(); saveState(); return;
        }
      }
      if (isTouchingHinata(x, y)) { triggerPetHead(x, y); return; }
      if (!isZoomed) {
        const furn = (ROOM_FURNITURE[viewRoomId] || []).find(f => Math.hypot(x - f.hx, y - f.hy) <= f.hr);
        if (furn) {
          targetX = furn.px; targetY = furn.py; pet.currentActivity = furn.act;
          playSFX('pat'); speakAndShow(furn.line);
          particles.push({ x: furn.hx, y: furn.hy - 20, text: '✨', color: '#f59e0b', life: 30 });
          updateHUD(); saveState();
        }
      }
    });
    canvas.addEventListener('pointermove', (e) => {
      if ((e.buttons === 0 && e.pointerType === 'mouse') || rally.active) return;
      const { x, y } = getCanvasCoords(e.clientX, e.clientY); triggerPetHead(x, y);
    });
    window.addEventListener('pointerup', () => { isPetting = false; petTickAcc = 0; });

    function completeFeed(food) {
      const pet = ensurePetState(state.activeCharId);
      if (pet.coins < food.cost) { showToast('金幣唔夠！玩「🏐 雙人對打」或「✊ 包剪揼」賺金幣'); return; }
      pet.coins -= food.cost;
      pet.hunger = Math.min(100, pet.hunger + (food.hunger || 0));
      pet.mood = Math.min(100, pet.mood + (food.mood || 0));
      pet.energy = Math.min(100, pet.energy + (food.energy || 0));
      grantCappedRewards(pet, food.bond || 6, 0);
      tempOverrideMode = 'happy'; setTimeout(() => { tempOverrideMode = null; }, 1600);
      playSFX('eat'); speakAndShow(food.line);
      particles.push({ x: 300, y: 240, text: '好味! ✨', color: '#f59e0b', life: 36 });
      updateHUD(); saveState();
    }

    function startVolleyballRally() {
      const pet = ensurePetState(state.activeCharId);
      if (!isZoomed && pet.currentRoom !== viewRoomId) { viewRoomId = pet.currentRoom; updateHUD(); }
      if (pet.currentActivity === 'sleep') { showSleepLockedMsg(); return; }
      if (rally.active) return;
      document.getElementById('choice-overlay').classList.add('hidden');
      rally = { active: true, score: 0, turn: 'user', bx: 300, by: 200, bvx: 2.5, bvy: -7.5 };
      document.getElementById('mg-score').textContent = '0';
      document.getElementById('mg-turn').textContent = '輪到你接波！(點擊排球)';
      document.getElementById('mg-hud').classList.remove('hidden');
      speakAndShow('「喺黃圈跌落地之前按一下個波接住！一齊打多幾個回合！🏐」');
    }

    function startBackyardPractice() {

      if (isRoomBusyLocked(pet)) { showBusyLockedMsg(pet); return; }
      state.gamingReturnAt = null;
      pet.currentRoom = 'backyard'; pet.currentActivity = 'backyard';

      pet.energy = Math.max(5, pet.energy - 4);
      pet.mood = Math.min(100, pet.mood + 10);
      grantCappedRewards(pet, 6, 4);
      playSFX('levelup');

        } else if (id === 'clean') {

    document.getElementById('dock-tray').addEventListener('pointerdown', (e) => {

          playSFX('levelup');
          speakAndShow('「同哥哥由街道行過去便利店買肉包同運動飲品！🏪🥟」');

          renderDock(); updateHUD(); saveState();
        } else if (id === 'stop_gaming') {
          state.gamingReturnAt = null;

        } else if (id === 'chat') { if (pet.currentActivity === 'sleep') { showSleepLockedMsg(); return; } if (isRoomBusyLocked(pet)) { showBusyLockedMsg(pet); return; } openInteractiveChat(); }
        else if (id === 'furn') {
          if (!isZoomed && pet.currentRoom !== viewRoomId) { viewRoomId = pet.currentRoom; updateHUD(); } // furn wakes sleep

        } else if (id === 'gaming') {

          playSFX('levelup'); speakAndShow('「去哥哥房間電腦位打機 15 分鐘！之後會返去原本行程～🎮🔥」');
          particles.push({ x: 190, y: 360, text: '🎮 15分鐘', color: '#8b5cf6', life: 36 });
          renderDock(); updateHUD(); saveState();
        } else if (id === 'study') {

          if (isRoomBusyLocked(pet)) { showBusyLockedMsg(pet); return; }
          pet.mood = Math.min(100, pet.mood + 6); pet.energy = Math.max(5, pet.energy - 4);
          grantCappedRewards(pet, 4, 8);
          playSFX('eat'); speakAndShow('「執乾淨間屋企好企理呀！仲搵到少少零用錢！🧹🪙」');
          particles.push({ x: 300, y: 240, text: '🪙+8', color: '#f59e0b', life: 36 });
          updateHUD(); saveState();

      const btn = e.target.closest('[data-food-idx]'); if (!btn) return;

      if (pet.currentActivity === 'sleep') { showSleepLockedMsg(); return; }

    });

    window.addEventListener('pointermove', (e) => {
      if (!dragState.active) return;
      if (Math.hypot(e.clientX - dragStart.x, e.clientY - dragStart.y) > 8) {
        const g = document.getElementById('drag-ghost'); g.classList.remove('hidden'); g.style.left = e.clientX + 'px'; g.style.top = e.clientY + 'px';
      }
    });
    window.addEventListener('pointerup', (e) => {
      if (!dragState.active) return;
      document.getElementById('drag-ghost').classList.add('hidden');
      const dist = Math.hypot(e.clientX - dragStart.x, e.clientY - dragStart.y);
      const food = dragState.food; dragState = { active: false, food: null };
      if (dist <= 8) flyingFood = { emoji: food.emoji, x: 300, y: 560, targetX: isZoomed ? 300 : petX, targetY: isZoomed ? 360 : petY - 30, food };
      else {
        const r = canvas.getBoundingClientRect();
        if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) completeFeed(food);
      }
    });

    function updateHUD() {
      const char = getActiveChar(), pet = ensurePetState(char.id), timeInfo = getCurrentHourInfo();
      const sched = getScheduledState(timeInfo);
      const outfit = OUTFITS[pet.outfitIdx || 0] || OUTFITS[0];
      const viewRoom = MAP_ROOMS[viewRoomId] || MAP_ROOMS.living;
      const petRoom = MAP_ROOMS[pet.currentRoom] || MAP_ROOMS.living;

      document.getElementById('header-title').textContent = char.name;
      document.getElementById('btn-sound').textContent = state.soundEnabled ? '🔊' : '🔇';
      document.getElementById('time-display').textContent = `🔒 ${timeInfo.label} (${sched.label})`;
      const hBtn = document.getElementById('btn-holiday');
      if (hBtn) {
        const isTomHol = (state.holidayDate === getTomorrowStr());

        hBtn.className = `px-2 py-1 rounded-full font-bold text-[11px] border-2 border-[#2d1e12] shadow-sm transition ${isTomHol ? 'bg-emerald-500 text-white' : 'bg-white text-emerald-700 hover:bg-emerald-50'}`;
      }
      document.getElementById('room-title-badge').textContent = `${viewRoom.icon} ${viewRoom.name}`;
      document.getElementById('outfit-name').textContent = outfit.name;
      document.getElementById('zoom-icon').textContent = isZoomed ? '🔎' : '🔍';
      document.getElementById('zoom-label').textContent = isZoomed ? '縮細全景' : '放大特寫';

      document.getElementById('daily-cap-exp').textContent = `📈 今日EXP ${pet.dailyExpGained}/${DAILY_EXP_CAP}`;
      document.getElementById('daily-cap-coins').textContent = `🪙 今日金幣 ${pet.dailyCoinsGained}/${DAILY_COINS_CAP}`;
      document.getElementById('daily-lock-badge').classList.toggle('hidden', !(pet.dailyExpGained >= DAILY_EXP_CAP && pet.dailyCoinsGained >= DAILY_COINS_CAP));

      ['up', 'down', 'left', 'right'].forEach(d => {
        const btn = document.getElementById('dir-' + d);
        btn.disabled = !viewRoom[d] || isZoomed;
        btn.title = viewRoom[d] ? `前往 ${MAP_ROOMS[viewRoom[d]].name}` : '';
        const lbl = document.getElementById('lbl-' + d);
        if (lbl) lbl.textContent = viewRoom[d] ? MAP_ROOMS[viewRoom[d]].short : '';
      });

      const bubble = document.getElementById('speech-bubble');
      const broHere = state.brother && state.brother.currentRoom === viewRoomId;
      if (isZoomed || pet.currentRoom === viewRoomId || broHere) {
        bubble.classList.remove('hidden');
      } else {
        bubble.classList.add('hidden');
      }

      document.getElementById('bond-level').textContent = pet.bondLevel;
      document.getElementById('coins-count').textContent = pet.coins;
      const h = Math.round(pet.hunger), m = Math.round(pet.mood), en = Math.round(pet.energy);
      document.getElementById('val-hunger').textContent = `${h}%`; document.getElementById('bar-hunger').style.width = `${h}%`;
      document.getElementById('val-mood').textContent = `${m}%`; document.getElementById('bar-mood').style.width = `${m}%`;
      document.getElementById('val-energy').textContent = `${en}%`; document.getElementById('bar-energy').style.width = `${en}%`;
    }

    ['up', 'down', 'left', 'right'].forEach(dir => {
      document.getElementById('dir-' + dir).addEventListener('click', () => {
        const nextId = MAP_ROOMS[viewRoomId][dir]; if (!nextId) return;

    document.getElementById('btn-zoom').addEventListener('click', () => { isZoomed = !isZoomed; playSFX('pat'); updateHUD(); });
    document.getElementById('btn-outfit').addEventListener('click', () => {
      const pet = ensurePetState(state.activeCharId);

      if (o.id === 'school') speakAndShow('「換咗黑學蘭＋無拉鏈衛衣校服！連放大圖都會跟住轉！✨」');

      updateHUD(); saveState();

    document.getElementById('btn-schedule').addEventListener('click', openScheduleModal);

      }
      updateHUD(); saveState();
    });
    document.getElementById('close-schedule').addEventListener('click', () => document.getElementById('schedule-modal').classList.add('hidden'));
    if (false) document.getElementById('btn-schedule').addEventListener('x', () => {
      document.getElementById('char-list').innerHTML = Object.values(getAllCharacters()).map(c => {
        const pet = ensurePetState(c.id), active = c.id === state.activeCharId;
        return `<div class="flex items-center justify-between p-2.5 rounded-2xl border-2 border-[#2d1e12] ${active ? 'bg-orange-100' : 'bg-white'}">
          <div class="flex items-center gap-2.5"><div class="w-9 h-9 rounded-full border-2 border-[#2d1e12] flex items-center justify-center text-white font-black text-xs" style="background:${c.hairColor}">${c.name[0]}</div>
          <div><div class="text-sm font-black">${c.name}</div><div class="text-[10px] text-slate-600">${c.subtitle} · Lv.${pet.bondLevel}</div></div></div>
          <button type="button" data-pick-char="${c.id}" class="px-3 py-1 rounded-xl text-xs font-bold border-2 border-[#2d1e12] ${active ? 'bg-slate-200' : 'bg-orange-500 text-white'}">${active ? '養成中' : '切換'}</button></div>`;

    document.getElementById('add-char-form').addEventListener('submit', (e) => {

      state.customCharacters[id] = {

        foods: DEFAULT_CHARACTERS.hinata.foods,
        dialogues: { sleep: ['「Zzz…」'], brush: [quote], breakfast: [quote], tea: [quote], tv: [quote], fridge: [quote], cook: [quote], hallway: [quote], gaming: [quote], homework: [quote], bath: [quote], backyard: [quote], street: [quote], school_class: [quote], lunch: [quote], school_court: [quote], pet: ['「哥哥摸頭好舒服呀！」'], waking: ['「唔…哥哥發生咩事？」'], backToSleep: ['「哥哥晚安…Zzz」'], leaving: ['「夠鐘做下一個行程喇～」'], capped: ['「今日上限已滿！」'] }
      };
      state.activeCharId = id; ensurePetState(id); speakAndShow(quote); renderDock(); updateHUD(); saveState();
      document.getElementById('add-char-form').reset(); document.getElementById('char-modal').classList.add('hidden');
    });
    if (false) document.getElementById('btn-schedule').addEventListener('x2', () => {
      const char = getActiveChar();
      state.pets[char.id] = { hunger: 80, mood: 85, energy: 90, bondExp: 15, bondLevel: 1, coins: 50, outfitIdx: 0, currentRoom: 'room_hinata', currentActivity: 'sleep', scheduleSlotKey: '', dailyDate: getTodayStr(), dailyExpGained: 0, dailyCoinsGained: 0, lastUpdated: Date.now() };
      syncScheduleActivity(state.pets[char.id], false);
      viewRoomId = state.pets[char.id].currentRoom;
      updateHUD(); saveState(); showToast(`已重置 ${char.name} 嘅進度`);
    });

    // 每 3 秒即時結算一次精力／飽食／心情變化
    setInterval(() => {
      const pet = ensurePetState(state.activeCharId);
      applyTimeStatsDelta(pet, 3000);
      updateHUD(); saveState();
    }, 3000);

    window.addEventListener('error', (ev) => {
      try { showToast('JS Error: ' + (ev.message || ev.error)); } catch (_) {}
    });
    function updateHeaderDateTime() {
      const el = document.getElementById('header-datetime');
      if (!el) return;
      const now = new Date();
      const days = ['日', '一', '二', '三', '四', '五', '六'];
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const hh = String(now.getHours()).padStart(2, '0');
      const mi = String(now.getMinutes()).padStart(2, '0');
      el.textContent = `${mm}/${dd} (${days[now.getDay()]}) ${hh}:${mi}`;
    }
    updateHeaderDateTime();
    setInterval(updateHeaderDateTime, 10000);
    loadAssets();
    loadState();
    viewRoomId = ensurePetState(state.activeCharId).currentRoom;
    renderDock();
    updateHUD();
    gameLoop();
  </script>

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    const firebaseConfig = {
      apiKey: "AIzaSyCqASayonPmiJSoku8s0oTrS12hv-0_P10",
      authDomain: "hinata-tamagotchi.firebaseapp.com",
      projectId: "hinata-tamagotchi",
      storageBucket: "hinata-tamagotchi.firebasestorage.app",
      messagingSenderId: "197709491427",
      appId: "1:197709491427:web:9af960329df8d5c327e9d6",
      measurementId: "G-FHFZJV1M8T"
    };
    try {
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const saveRef = doc(db, "hinata_saves", "main");
      let saveTimer = null;
      let applyingRemote = false;
      window.__cloudSave = () => {
        if (applyingRemote) return;
        clearTimeout(saveTimer);
        saveTimer = setTimeout(async () => {
          try {
            const raw = localStorage.getItem('chibi_tama_nohara_v6');
            if (!raw) return;
            await setDoc(saveRef, { payload: raw, updatedAt: Date.now() }, { merge: true });
            const el = document.getElementById('save-status');
            if (el) el.textContent = '☁️ 雲端已同步';
          } catch (e) {}
        }, 1200);
      };
      onSnapshot(saveRef, (snap) => {
        if (!snap.exists()) return;
        const data = snap.data();
        if (!data || !data.payload) return;
        const cur = localStorage.getItem('chibi_tama_nohara_v6');
        if (cur !== data.payload) {
          applyingRemote = true;
          localStorage.setItem('chibi_tama_nohara_v6', data.payload);
          if (typeof loadState === 'function') loadState();
          if (typeof renderDock === 'function') renderDock();
          if (typeof updateHUD === 'function') updateHUD();
          const el = document.getElementById('save-status');
          if (el) el.textContent = '☁️ 已載入雲端進度';
          setTimeout(() => { applyingRemote = false; }, 300);
        }
      });
    } catch (e) {}
  </script>
