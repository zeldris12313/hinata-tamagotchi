<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Q版動漫電子雞｜日向翔陽生活養成記</title>
  <link rel="icon" type="image/png" href="./icon.png?v=1" />
  <link rel="apple-touch-icon" href="./icon.png?v=1" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    body {
      font-family: 'Noto Sans TC', 'Inter', sans-serif;
      background: radial-gradient(circle at top, #fff1e6 0%, #ffd8be 55%, #ffc49b 100%);
      min-height: 100vh;
      margin: 0;
      color: #2d1e12;
      overflow-x: hidden;
    }
    .tama-shell {
      background: linear-gradient(165deg, #ff8533 0%, #ff6314 52%, #e64900 100%);
      box-shadow: 0 24px 50px rgba(217, 72, 15, 0.35), inset 0 6px 14px rgba(255, 255, 255, 0.5), inset 0 -10px 20px rgba(124, 35, 0, 0.35);
      border: 5px solid #fff7f0;
    }
    .hd-canvas { touch-action: none; }
    .ui-card { border: 2.5px solid #2d1e12; box-shadow: 0 4px 0 rgba(45, 30, 18, 0.85); }
    .dock-chip, .ctrl-pill { border: 2px solid #2d1e12; box-shadow: 0 3px 0 rgba(45, 30, 18, 0.85); touch-action: none; transition: transform 0.1s ease, opacity 0.15s ease; }
    .dock-chip:active, .ctrl-pill:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(45, 30, 18, 0.85); }
    .inscreen-dir {
      border: 2px solid rgba(45, 30, 18, 0.85);
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.25);
      transition: transform 0.1s ease, opacity 0.15s ease;
    }
    .inscreen-dir:active:not(:disabled) { transform: scale(0.9); }
    .inscreen-dir:disabled { opacity: 0.22; pointer-events: none; }
    #drag-ghost { position: fixed; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%) scale(1.25); font-size: 30px; }
  </style>
</head>
<body class="flex flex-col items-center justify-center p-3 sm:p-5">

  <div class="tama-shell w-full max-w-md rounded-[3rem] p-4 sm:p-5 relative">

    <!-- Top Bezel -->
    <div class="flex items-center justify-between mb-2 px-1.5 text-white">
      <div class="flex items-center gap-2">
        <span class="w-8 h-8 rounded-full bg-white/25 flex items-center justify-center text-base border-2 border-white/50">🏐</span>
        <div>
          <div class="flex items-center gap-1.5 flex-wrap"><h1 id="header-title" class="text-base sm:text-lg font-black tracking-wide leading-tight">日向翔陽</h1><span id="header-datetime" class="text-[10px] font-bold bg-white/25 px-2 py-0.5 rounded-full border border-white/40 whitespace-nowrap"></span></div>
          <p id="header-sub" class="text-[11px] text-orange-100">烏野 #10 · 現實時間同步</p>
        </div>
      </div>
      <div class="flex items-center gap-1.5">
        <button id="btn-sound" type="button" title="開關互動音效" class="w-8 h-8 rounded-full bg-white/25 hover:bg-white/35 border-2 border-white/50 flex items-center justify-center text-sm transition">🔊</button>
        <button id="btn-schedule" type="button" class="px-2.5 py-1 rounded-full bg-white text-orange-600 font-bold text-xs border-2 border-[#2d1e12] shadow-sm hover:bg-orange-50 transition">📅 生活作息</button>
      </div>
    </div>

    <!-- Screen Frame -->
    <div class="bg-[#2d1e12] p-2.5 rounded-[1.75rem] shadow-inner">
      <!-- Top Mini HUD (現實時間已鎖定，不可手動調整) -->
      <div class="bg-[#fef3c7] border-b-2 border-[#2d1e12] rounded-t-2xl px-2.5 py-1.5 space-y-1 text-[11px] font-bold text-[#2d1e12]">
        <div class="flex items-center justify-between">
          <span id="time-display" class="bg-white/90 border border-[#2d1e12] px-1.5 py-0.5 rounded">🔒 現實時間</span>
          <span id="room-title-badge" class="bg-orange-500 text-white px-2 py-0.5 rounded text-[10px]">🏠 1F 客廳</span>
          <span>💖Lv.<span id="bond-level">1</span> · 🪙<span id="coins-count">50</span></span>
        </div>
        <div class="flex items-center justify-between text-[10px] bg-white/80 rounded-lg px-2 py-0.5 border border-amber-300">
          <span id="daily-cap-exp">📈 今日EXP 0/100</span>
          <span id="daily-cap-coins">🪙 今日金幣 0/80</span>
          <span id="daily-lock-badge" class="hidden text-rose-600 font-black">🔒 今日已鎖定上限</span>
        </div>
      </div>

      <!-- 600x600 HD Anime Room Canvas -->
      <div class="relative w-full aspect-square bg-sky-100 overflow-hidden">
        <canvas id="game-canvas" width="600" height="600" class="hd-canvas w-full h-full block cursor-pointer"></canvas>

        <!-- Speech Bubble -->
        <div id="speech-bubble" class="pointer-events-none absolute top-9 left-1/2 -translate-x-1/2 w-[84%] bg-white/95 border-2 border-[#2d1e12] rounded-2xl px-3 py-1.5 text-center text-xs font-bold text-[#2d1e12] shadow-md leading-snug z-10">
          「哥哥你返嚟啦！今日一齊練排球！」
        </div>

        <!-- In-Screen 4-Way Navigation Arrows -->
        <button id="dir-up" type="button" class="inscreen-dir absolute top-1.5 left-1/2 -translate-x-1/2 bg-white/85 hover:bg-orange-100 text-[#2d1e12] rounded-full px-3 py-0.5 text-xs font-black z-20 flex items-center gap-1" title="向上">
          <span>▲</span><span id="lbl-up" class="text-[9px] hidden sm:inline"></span>
        </button>
        <button id="dir-down" type="button" class="inscreen-dir absolute bottom-1.5 left-1/2 -translate-x-1/2 bg-white/85 hover:bg-orange-100 text-[#2d1e12] rounded-full px-3 py-0.5 text-xs font-black z-20 flex items-center gap-1" title="向下">
          <span>▼</span><span id="lbl-down" class="text-[9px] hidden sm:inline"></span>
        </button>
        <button id="dir-left" type="button" class="inscreen-dir absolute left-1.5 top-1/2 -translate-y-1/2 bg-white/85 hover:bg-orange-100 text-[#2d1e12] rounded-full w-8 h-8 text-xs font-black z-20 flex items-center justify-center" title="向左">◀</button>
        <button id="dir-right" type="button" class="inscreen-dir absolute right-1.5 top-1/2 -translate-y-1/2 bg-white/85 hover:bg-orange-100 text-[#2d1e12] rounded-full w-8 h-8 text-xs font-black z-20 flex items-center justify-center" title="向右">▶</button>

        <!-- Interactive Overlay (RPS / Chat / Jump Training) -->
        <div id="choice-overlay" class="hidden absolute bottom-11 left-1/2 -translate-x-1/2 w-[88%] bg-white/95 border-2 border-[#2d1e12] rounded-2xl p-2 shadow-xl z-30 flex flex-wrap items-center justify-center gap-1.5"></div>

        <!-- Directional Tracker Arrow -->
        <button id="tracker-arrow" type="button" class="hidden absolute bottom-10 right-3 bg-orange-500/95 hover:bg-orange-600 text-white border-2 border-[#2d1e12] rounded-2xl px-3 py-1.5 text-xs font-black shadow-lg flex items-center gap-1.5 animate-bounce z-20">
          <span id="tracker-dir" class="text-base">⬅️</span>
          <span id="tracker-text">日向喺客廳</span>
        </button>

        <!-- Rally Mini-game Overlay -->
        <div id="mg-hud" class="hidden pointer-events-none absolute bottom-10 left-1/2 -translate-x-1/2 bg-[#2d1e12]/90 text-white text-xs font-bold px-3.5 py-1 rounded-full shadow z-20">
          🏐 雙人對打：<span id="mg-score">0</span> 回合 ｜ <span id="mg-turn">輪到你接波！</span>
        </div>
      </div>

      <!-- Stat Bars -->
      <div class="bg-[#fff7ed] border-t-2 border-[#2d1e12] rounded-b-2xl px-3 py-2 grid grid-cols-3 gap-2 text-[11px] font-bold">
        <div>
          <div class="flex justify-between mb-0.5"><span>🍙 飽食</span><span id="val-hunger">80%</span></div>
          <div class="border border-[#2d1e12] bg-white h-2.5 rounded-full overflow-hidden"><div id="bar-hunger" class="h-full bg-amber-500 transition-all duration-300" style="width:80%"></div></div>
        </div>
        <div>
          <div class="flex justify-between mb-0.5"><span>😊 心情</span><span id="val-mood">85%</span></div>
          <div class="border border-[#2d1e12] bg-white h-2.5 rounded-full overflow-hidden"><div id="bar-mood" class="h-full bg-rose-500 transition-all duration-300" style="width:85%"></div></div>
        </div>
        <div>
          <div class="flex justify-between mb-0.5"><span>⚡ 精力</span><span id="val-energy">90%</span></div>
          <div class="border border-[#2d1e12] bg-white h-2.5 rounded-full overflow-hidden"><div id="bar-energy" class="h-full bg-emerald-500 transition-all duration-300" style="width:90%"></div></div>
        </div>
      </div>
    </div>

    <!-- Quick Controls -->
    <div class="mt-2.5 grid grid-cols-3 gap-1.5">
      <button id="btn-zoom" type="button" class="ctrl-pill bg-white hover:bg-orange-50 rounded-xl py-1.5 px-2 text-xs font-black flex items-center justify-center gap-1">
        <span id="zoom-icon">🔍</span><span id="zoom-label">放大特寫</span>
      </button>
      <button id="btn-outfit" type="button" class="ctrl-pill bg-white hover:bg-orange-50 rounded-xl py-1.5 px-2 text-xs font-black flex items-center justify-center gap-1">
        <span>👕</span><span id="outfit-name">烏野隊服</span>
      </button>
      <button id="btn-find-pet" type="button" class="ctrl-pill bg-amber-100 hover:bg-amber-200 rounded-xl py-1.5 px-2 text-xs font-black flex items-center justify-center gap-1">
        <span>🧭</span><span>搵日向</span>
      </button>
    </div>

    <!-- Bottom Interactive Dock -->
    <div class="mt-2.5 bg-[#fff7ed] ui-card rounded-2xl p-2">
      <div class="flex items-center justify-between gap-1.5 mb-1.5">
        <div class="flex gap-1">
          <button id="tab-food" type="button" class="px-2.5 py-0.5 rounded-lg text-[11px] font-black border-2 border-[#2d1e12] bg-orange-500 text-white">🍱 餵食</button>
          <button id="tab-act" type="button" class="px-2.5 py-0.5 rounded-lg text-[11px] font-black border-2 border-[#2d1e12] bg-white text-[#2d1e12]">✨ 互動 (8)</button>
        </div>
        <span class="text-[10px] font-bold text-orange-800">摸頭會笑開懷 😊 · 數值即時消耗</span>
      </div>
      <div id="dock-tray" class="grid grid-cols-4 gap-1.5"></div>
    </div>

    <!-- Footer -->
    <div class="mt-2.5 flex items-center justify-between text-[11px] text-orange-100 px-2">
      <span id="save-status">💾 已自動儲存</span>
      
    </div>

  </div>

  <div id="drag-ghost" class="hidden">🍙</div>

  <!-- Modal: 每日生活作息表 -->
  <div id="schedule-modal" class="hidden fixed inset-0 bg-black/55 backdrop-blur-xs z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl w-full max-w-sm p-5 shadow-2xl border-2 border-[#2d1e12] max-h-[82vh] flex flex-col">
      <div class="flex justify-between items-center mb-3 shrink-0">
        <h3 class="text-lg font-black text-orange-600">📅 翔陽每日生活作息表</h3>
        <button id="close-schedule" type="button" class="text-gray-400 hover:text-gray-700 font-bold text-lg px-2">✕</button>
      </div>
      <div id="schedule-list" class="space-y-2 overflow-y-auto pr-1 text-xs"></div>
    </div>
  </div>

  <!-- Modal: 角色切換 & 新增自訂角色 -->
  <div id="char-modal" class="hidden fixed inset-0 bg-black/55 backdrop-blur-xs z-50 flex items-center justify-center p-4">
    <div class="bg-[#fff7ed] ui-card rounded-3xl w-full max-w-md p-5 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-lg font-black text-[#2d1e12]">角色切換與新增</h2>
        <button id="btn-close-modal" type="button" class="w-8 h-8 rounded-full bg-orange-200 hover:bg-orange-300 flex items-center justify-center font-bold">✕</button>
      </div>
      <div id="char-list" class="space-y-2 mb-4"></div>
      <div class="border-t-2 border-orange-200 pt-3">
        <h3 class="text-sm font-black text-[#2d1e12] mb-2">＋ 新增自訂動漫角色</h3>
        <form id="add-char-form" class="space-y-2 text-xs">
          <div class="grid grid-cols-2 gap-2">
            <div><label class="block font-bold mb-1">角色名稱 *</label><input id="new-name" type="text" required placeholder="例如：孤爪研磨" class="w-full px-2.5 py-2 rounded-xl border-2 border-[#2d1e12] bg-white" /></div>
            <div><label class="block font-bold mb-1">稱號 / 背號</label><input id="new-sub" type="text" placeholder="例如：音駒 #5" class="w-full px-2.5 py-2 rounded-xl border-2 border-[#2d1e12] bg-white" /></div>
          </div>
          <div class="grid grid-cols-3 gap-2">
            <div><label class="block font-bold mb-1">髮色</label><input id="new-hair" type="color" value="#eab308" class="w-full h-8 rounded-lg border-2 border-[#2d1e12] cursor-pointer" /></div>
            <div><label class="block font-bold mb-1">瞳色</label><input id="new-eye" type="color" value="#ca8a04" class="w-full h-8 rounded-lg border-2 border-[#2d1e12] cursor-pointer" /></div>
            <div><label class="block font-bold mb-1">衫色</label><input id="new-shirt" type="color" value="#dc2626" class="w-full h-8 rounded-lg border-2 border-[#2d1e12] cursor-pointer" /></div>
          </div>
          <div><label class="block font-bold mb-1">見面台詞</label><input id="new-quote" type="text" placeholder="例如：哥哥，打機定練波好？" class="w-full px-2.5 py-2 rounded-xl border-2 border-[#2d1e12] bg-white" /></div>
          <button type="submit" class="w-full py-2.5 rounded-xl bg-orange-500 hover:bg-orange-600 text-white font-black text-sm border-2 border-[#2d1e12]">建立並切換角色</button>
        </form>
      </div>
    </div>
  </div>

  <div id="toast" class="hidden fixed bottom-5 left-1/2 -translate-x-1/2 bg-[#2d1e12] text-white text-xs font-bold px-4 py-2 rounded-full shadow-lg z-50"></div>

  <script>
    // =========================================================================
    // 1. 全套去背立繪（含摸頭專用笑面立繪）＋ 10間手繪動畫房間
    // =========================================================================
    const ASSET_URLS = {
      chibiJersey: "./assets/chibiJersey.png?v=13",
      chibiSchool: "./assets/chibiSchool.png?v=13",
      chibiPajama: "./assets/chibiPajama.png?v=13",
      portraitJersey: "./assets/portraitJersey.png?v=13",
      portraitJerseyHappy: "./assets/portraitJerseyHappy.png?v=13",
      portraitSchool: "./assets/portraitSchool.png?v=13",
      portraitSchoolHappy: "./assets/portraitSchoolHappy.png?v=13",
      portraitPajama: "./assets/portraitPajama.png?v=13",
      portraitPajamaHappy: "./assets/portraitPajamaHappy.png?v=13",
      portraitSleepy: "./assets/portraitSleepy.jpg?v=13",
      bg_living: "./assets/bg_living.jpg?v=13",
      bg_room_hinata: "./assets/bg_room_hinata.jpg?v=13",
      bg_kitchen: "./assets/bg_kitchen.jpg?v=13",
      bg_bath: "./assets/bg_bath.jpg?v=13",
      bg_room_aniki: "./assets/bg_room_aniki.jpg?v=13",
      bg_hallway: "./assets/bg_hallway.jpg?v=13",
      bg_backyard: "./assets/bg_backyard.jpg?v=13",
      bg_street: "./assets/bg_street.jpg?v=13",
      bg_school_class: "./assets/bg_school_class.jpg?v=13",
      bg_school_court: "./assets/bg_school_court.jpg?v=13",
      bg_konbini_morning: "./assets/bg_konbini_morning.jpg?v=13",
      bg_konbini_afternoon: "./assets/bg_konbini_afternoon.jpg?v=13",
      bg_konbini_night: "./assets/bg_konbini_night.jpg?v=13"
    };
    const sprites = {};

    let assetLoadFailed = false;
    function loadAssets() {
      Object.keys(ASSET_URLS).forEach(k => {
        const im = new Image();
        im.onload = () => { sprites[k] = im; };
        im.onerror = () => { assetLoadFailed = true; };
        im.src = ASSET_URLS[k];
      });
    }

    // =========================================================================
    // 2. 每日上限 + 10 房間 + 精準家具座標
    // =========================================================================
    const DAILY_EXP_CAP = 100;
    const DAILY_COINS_CAP = 80;

    const MAP_ROOMS = {
      room_hinata:  { id: 'room_hinata',  name: '2F 日向房',      short: '日向房',   icon: '🛏️', gx: 1, gy: 0, up: null, down: 'living', left: null, right: 'room_aniki' },
      room_aniki:   { id: 'room_aniki',   name: '2F 哥哥房間',    short: '哥哥房',   icon: '🎮', gx: 2, gy: 0, up: null, down: 'hallway', left: 'room_hinata', right: null },
      bath:         { id: 'bath',         name: '1F 廁所浴室',    short: '浴室',     icon: '🛁', gx: 0, gy: 1, up: null, down: null, left: null, right: 'living' },
      living:       { id: 'living',       name: '1F 客廳',        short: '客廳',     icon: '🏠', gx: 1, gy: 1, up: 'room_hinata', down: 'kitchen', left: 'bath', right: 'hallway' },
      hallway:      { id: 'hallway',      name: '1F 走廊玄關',    short: '走廊',     icon: '🚪', gx: 2, gy: 1, up: 'room_aniki', down: 'backyard', left: 'living', right: 'street' },
      street:       { id: 'street',       name: '室外街道',       short: '街道',     icon: '🛣️', gx: 3, gy: 1, up: null, down: 'school_class', left: 'hallway', right: 'konbini' },
      konbini:      { id: 'konbini',      name: '日式便利店',     short: '便利店',   icon: '🏪', gx: 4, gy: 1, up: null, down: null, left: 'street', right: null },
      kitchen:      { id: 'kitchen',      name: '1F 廚房',        short: '廚房',     icon: '🍳', gx: 1, gy: 2, up: 'living', down: null, left: null, right: 'backyard' },
      backyard:     { id: 'backyard',     name: '屋後院子',       short: '後院',     icon: '🏡', gx: 2, gy: 2, up: 'hallway', down: null, left: 'kitchen', right: null },
      school_class: { id: 'school_class', name: '學校課室',       short: '課室',     icon: '🏫', gx: 3, gy: 2, up: 'street', down: null, left: null, right: 'school_court' },
      school_court: { id: 'school_court', name: '室內學校排球場', short: '室內球場', icon: '🏐', gx: 4, gy: 2, up: null, down: null, left: 'school_class', right: null }
    };

    const ROOM_FURNITURE = {
      living: [
        { id: 'tea', label: '坐墊茶几', hx: 290, hy: 400, hr: 85, px: 280, py: 440, act: 'tea', line: '「同哥哥坐喺紅坐墊飲杯熱茶，暖笠笠好舒服！🍵」' },
        { id: 'tv',  label: '客廳電視梳化', hx: 485, hy: 330, hr: 90, px: 430, py: 420, act: 'tv', line: '「開電視！播緊烏野對戰精華呀哥哥快睇！📺」' }
      ],
      kitchen: [
        { id: 'fridge', label: '雪櫃', hx: 70, hy: 350, hr: 80, px: 145, py: 435, act: 'fridge', line: '「打開雪櫃睇下～有凍麥茶同雞蛋！🧊」' },
        { id: 'stove',  label: '煮食爐', hx: 215, hy: 325, hr: 80, px: 255, py: 435, act: 'cook', line: '「滋滋滋～幫哥哥煎隻靚太陽蛋做早餐！🍳」' },
        { id: 'table',  label: '飯枱', hx: 480, hy: 410, hr: 95, px: 455, py: 440, act: 'breakfast', line: '「坐喺飯枱食熱辣辣早餐，充滿力量！🍚」' }
      ],
      room_hinata: [
        { id: 'desk', label: '書枱', hx: 115, hy: 350, hr: 90, px: 165, py: 430, act: 'homework', line: '「開着盞枱燈溫下英文單字先…哥哥記得教我！📖」' },
        { id: 'bed',  label: '床鋪', hx: 465, hy: 375, hr: 110, px: 472, py: 355, act: 'sleep', line: '「鑽入被竇暖笠笠…哥哥晚安…Zzz 🛏️」' }
      ],
      room_aniki: [
        { id: 'console', label: '哥哥電腦位', hx: 120, hy: 300, hr: 95, px: 190, py: 435, act: 'gaming', line: '「打開哥哥部遊戲機打兩局排球Game！🎮」' },
        { id: 'aniki_bed', label: '哥哥張床', hx: 465, hy: 375, hr: 110, px: 390, py: 435, act: 'happy', line: '「哥哥張床特別軟熟～嘿嘿 😊」' }
      ],
      bath: [
        { id: 'sink', label: '洗手盆刷牙', hx: 145, hy: 340, hr: 85, px: 200, py: 435, act: 'brush', line: '「刷刷刷～朝早起身刷牙洗臉醒神晒！🪥」' },
        { id: 'tub',  label: '熱水浴缸', hx: 415, hy: 360, hr: 115, px: 405, py: 332, act: 'bath', line: '「浸落熱水浴缸好爽呀！成身暖笠笠！🫧」' }

      const mins = Math.max(0, Math.min(480, elapsedMs / 60000));
      if (mins <= 0.005) return;
      if (pet.currentActivity === 'sleep') {
        pet.energy = Math.min(100, pet.energy + mins * 4.5);
        pet.hunger = Math.max(10, pet.hunger - mins * 0.6);
      } else if (pet.currentActivity === 'bath') {
        pet.energy = Math.min(100, pet.energy + mins * 2.5);
        pet.mood = Math.min(100, pet.mood + mins * 2.5);
        pet.hunger = Math.max(5, pet.hunger - mins * 1.0);
      } else {
        pet.hunger = Math.max(5, pet.hunger - mins * 2.5);
        pet.energy = Math.max(5, pet.energy - mins * 1.8);
        pet.mood = Math.max(10, pet.mood - mins * 1.5);
      }
      pet.hunger = Math.round(pet.hunger * 10) / 10;
      pet.mood = Math.round(pet.mood * 10) / 10;
      pet.energy = Math.round(pet.energy * 10) / 10;
      pet.lastUpdated = Date.now();

      const hour = now.getHours();
      const min = now.getMinutes();
      const totalMin = hour * 60 + min;
      const hh = String(hour).padStart(2, '0'), mm = String(min).padStart(2, '0');
      const dayLabel = isWeekend ? '週末' : '平日';

      let period = 'day';
      if ((!isWeekend && hour < 8) || (isWeekend && (totalMin >= 90 && totalMin < 600))) period = 'night';
      else if (hour >= 16 && hour < 19) period = 'dusk';
      else if (hour >= 19 || hour < 6) period = 'evening';

      return { isWeekend, hour, min, totalMin, period, label: `${dayLabel} ${hh}:${mm}`, isLateNight: period === 'night' };
    }

    let audioCtx = null;
    function playTone(freq, dur = 0.07, wave = 'triangle', vol = 0.05) {
      if (!state.soundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = wave; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

      else if (kind === 'bounce') { playTone(520, 0.05); setTimeout(() => playTone(780, 0.06), 45); }
      else if (kind === 'wake') { playTone(330, 0.08, 'sine'); setTimeout(() => playTone(440, 0.1, 'sine'), 90); }

    function roundRect(x, y, w, h, r, fill, stroke = null, lw = 3) {
      ctx.beginPath(); if (ctx.roundRect) { ctx.roundRect(x, y, w, h, r); } else { ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); }
    }

    function drawAnimeRoomBackground(roomId, timeInfo) {
      let bgKey = 'bg_' + roomId;

      }
      const bg = sprites[bgKey];
      if (bg) {
        ctx.drawImage(bg, 0, 0, 600, 600);
        if (timeInfo.isLateNight) { ctx.fillStyle = 'rgba(15, 23, 42, 0.38)'; ctx.fillRect(0, 0, 600, 600); }
        else if (timeInfo.period === 'dusk') { ctx.fillStyle = 'rgba(251, 146, 60, 0.14)'; ctx.fillRect(0, 0, 600, 600); }
        else if (timeInfo.period === 'evening') { ctx.fillStyle = 'rgba(30, 41, 59, 0.22)'; ctx.fillRect(0, 0, 600, 600); }
      } else {
        ctx.fillStyle = '#fef3c7'; ctx.fillRect(0, 0, 600, 600);
        if (assetLoadFailed) {
          ctx.fillStyle = '#2d1e12'; ctx.font = 'bold 20px sans-serif'; ctx.textAlign = 'center';
          ctx.fillText('⚠️ 載入唔到 assets 資料夾嘅圖片', 300, 270);
          ctx.font = '15px sans-serif';
          ctx.fillText('請先「解壓縮」成個 ZIP，確保 index.html 同 assets 喺同一層！', 300, 305);
        }
      }
    }

    function drawAnimeRoomForeground(roomId, frame, pet) {

        ctx.fillStyle = '#f5efe6'; ctx.strokeStyle = '#9ca3af'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(275, 360); ctx.lineTo(525, 360); ctx.lineTo(525, 455); ctx.lineTo(275, 455); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.font = '24px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('🫧', 345, 345 + Math.sin(frame * 0.09) * 4);
        ctx.fillText('♨️', 465, 340 + Math.cos(frame * 0.08) * 4);

    let frameCount = 0;
    function endRally(msg, pet) {
      rally.active = false;
      document.getElementById('mg-hud').classList.add('hidden');
      const capped = grantCappedRewards(pet, Math.min(20, rally.score * 3 + 3), Math.min(24, rally.score * 4 + 2));
      pet.mood = Math.min(100, pet.mood + 10);
      playSFX('miss');
      speakAndShow(`${msg} 總共對打咗 ${rally.score} 回合！${capped ? '（今日上限已滿 🔒）' : ''}`);

    function updateRally(pet) {
      if (!rally.active) return;
      rally.bx += rally.bvx; rally.by += rally.bvy; rally.bvy += 0.24;
      if (rally.bx < 40 || rally.bx > 560) rally.bvx *= -1;
      if (rally.by < 55) { rally.by = 55; rally.bvy = Math.abs(rally.bvy); }

      if (rally.turn === 'hinata') {
        targetX = Math.max(80, Math.min(520, rally.bx)); targetY = 435;
        petX += (targetX - petX) * 0.14;
        if (rally.bvy > 0 && Math.hypot(rally.bx - petX, rally.by - (petY - 20)) < 58) {
          if (Math.random() < 0.15) { endRally('「嗚哇！翔陽飛撲都差少少接到個波！💦」', pet); return; }
          rally.score++;
          document.getElementById('mg-score').textContent = rally.score;
          document.getElementById('mg-turn').textContent = '輪到你接波！(點擊排球)';
          rally.turn = 'user'; rally.bvy = -10.5; rally.bvx = (Math.random() - 0.5) * 6;
          playSFX('bounce'); particles.push({ x: petX, y: petY - 80, text: '接得好! 🏐', color: '#facc15', life: 24 });
        } else if (rally.by > 530) {
          endRally('「哎呀！翔陽趕唔切接到個波！😅」', pet);
        }
      } else if (rally.by > 535) {
        endRally('「哥哥跌波啦！下次反應再快少少！😆」', pet);
      }
    }

    function updateAI() {
      const char = getActiveChar(), pet = ensurePetState(char.id);
      const now = Date.now(), idleSec = (now - lastInteractAt) / 1000;
      syncScheduleActivity(pet, true);

      if (transitionState) {
        if (transitionState.phase === 'out') {
          petX += (540 - petX) * 0.08;
          transitionState.alpha = Math.max(0, transitionState.alpha - 0.04);
          if (transitionState.alpha <= 0.05) {
            pet.currentRoom = transitionState.targetRoom; pet.currentActivity = transitionState.targetActivity;
            petX = 70; targetX = transitionState.tx; targetY = transitionState.ty;
            transitionState.phase = 'in'; updateHUD();
          }
        } else if (transitionState.phase === 'in') {
          petX += (targetX - petX) * 0.08; petY += (targetY - petY) * 0.08;
          transitionState.alpha = Math.min(1, transitionState.alpha + 0.05);
          if (transitionState.alpha >= 0.98) {
            transitionState = null;
            const pool = char.dialogues[pet.currentActivity] || char.dialogues.tea;
            if (viewRoomId === pet.currentRoom) speakAndShow(pickLine(pool));
            saveState();
          }
        }
        return;
      }

      if (pet.currentActivity === 'waking' && idleSec > 10) {
        pet.currentActivity = 'sleep';
        if (viewRoomId === pet.currentRoom) speakAndShow(char.dialogues.backToSleep[0]);
        updateHUD();
      }

      if (!rally.active && pet.currentRoom !== 'bath' && pet.currentActivity !== 'sleep' && pet.currentActivity !== 'waking') {
        const dx = targetX - petX, dy = targetY - petY;
        if (Math.hypot(dx, dy) > 4) { petX += dx * 0.045; petY += dy * 0.045; }
      }
      if (frameCount % 240 === 0) dreamIdx++;
    }

    function gameLoop() {
      frameCount++; updateAI();
      const char = getActiveChar(), pet = ensurePetState(char.id);
      const outfit = OUTFITS[pet.outfitIdx || 0] || OUTFITS[0];
      const timeInfo = getCurrentHourInfo();
      ctx.clearRect(0, 0, 600, 600);

      if (isZoomed) {
        drawLiveZoomedPortrait(pet, outfit, timeInfo, frameCount);
      } else {
        drawAnimeRoomBackground(viewRoomId, timeInfo);
        if (pet.currentRoom === viewRoomId) drawArticulatedChibi(char, outfit, pet, frameCount);
        drawAnimeRoomForeground(viewRoomId, frameCount, pet);

        if (rally.active) {
          updateRally(pet);
          if (rally.turn === 'user') {
            ctx.strokeStyle = 'rgba(250, 204, 21, 0.85)'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.arc(rally.bx, rally.by, 42, 0, Math.PI * 2); ctx.stroke();
          }
          ctx.font = '52px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('🏐', rally.bx, rally.by + 16);
        } else if (pet.currentRoom === viewRoomId && (pet.currentRoom === 'school_court' || pet.currentRoom === 'backyard')) {
          const by = 270 - Math.abs(Math.sin(frameCount * 0.14)) * 75;
          ctx.font = '44px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('🏐', petX + 65, by);
        }
      }

      if (flyingFood) {
        flyingFood.x += (flyingFood.targetX - flyingFood.x) * 0.18;
        flyingFood.y += (flyingFood.targetY - flyingFood.y) * 0.18;
        ctx.font = '44px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(flyingFood.emoji, flyingFood.x, flyingFood.y);
        if (Math.hypot(flyingFood.targetX - flyingFood.x, flyingFood.targetY - flyingFood.y) < 12) { completeFeed(flyingFood.food); flyingFood = null; }
      }

      if (isPetting) {
        ctx.save(); ctx.translate(handPos.x, handPos.y + Math.sin(frameCount * 0.3) * 8);
        ctx.font = '54px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('🫳', 0, 12); ctx.restore();
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i]; pt.y -= 1.6; pt.life--;
        ctx.fillStyle = pt.color; ctx.font = 'bold 26px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(pt.text, pt.x, pt.y);
        if (pt.life <= 0) particles.splice(i, 1);
      }
      requestAnimationFrame(gameLoop);
    }

    function grantCappedRewards(pet, expAmt, coinAmt) {
      let cappedNow = false;
      if (expAmt > 0) {
        const allowExp = Math.min(expAmt, Math.max(0, DAILY_EXP_CAP - pet.dailyExpGained));
        if (allowExp > 0) {
          pet.dailyExpGained += allowExp; pet.bondExp += allowExp;
          while (pet.bondExp >= 100) { pet.bondExp -= 100; pet.bondLevel += 1; playSFX('levelup'); showToast(`好感度升到 Lv.${pet.bondLevel}！💖`); }
        } else cappedNow = true;
      }
      if (coinAmt > 0) {
        const allowCoins = Math.min(coinAmt, Math.max(0, DAILY_COINS_CAP - pet.dailyCoinsGained));
        if (allowCoins > 0) { pet.dailyCoinsGained += allowCoins; pet.coins += allowCoins; }
        else cappedNow = true;
      }
      return cappedNow;
    }

    function getCanvasCoords(clientX, clientY) {

      return { x: ((clientX - r.left) / r.width) * 600, y: ((clientY - r.top) / r.height) * 600 };

          particles.push({ x: 300, y: 240, text: '🪙+8', color: '#f59e0b', life: 36 });
          updateHUD(); saveState();
        }
        return;
      }

      const btn = e.target.closest('[data-food-idx]'); if (!btn) return;
      const pet = ensurePetState(state.activeCharId);
      if (!isZoomed && pet.currentRoom !== viewRoomId) { viewRoomId = pet.currentRoom; updateHUD(); }
      if (pet.currentActivity === 'sleep') { showSleepLockedMsg(); return; }
      const food = getActiveChar().foods[Number(btn.dataset.foodIdx)];
      dragState = { active: true, food }; dragStart = { x: e.clientX, y: e.clientY };
      const g = document.getElementById('drag-ghost'); g.textContent = food.emoji; g.style.left = e.clientX + 'px'; g.style.top = e.clientY + 'px';
    });

    window.addEventListener('pointermove', (e) => {
      if (!dragState.active) return;
      if (Math.hypot(e.clientX - dragStart.x, e.clientY - dragStart.y) > 8) {
        const g = document.getElementById('drag-ghost'); g.classList.remove('hidden'); g.style.left = e.clientX + 'px'; g.style.top = e.clientY + 'px';
      }
    });
    window.addEventListener('pointerup', (e) => {
      if (!dragState.active) return;
      document.getElementById('drag-ghost').classList.add('hidden');
      const dist = Math.hypot(e.clientX - dragStart.x, e.clientY - dragStart.y);
      const food = dragState.food; dragState = { active: false, food: null };
      if (dist <= 8) flyingFood = { emoji: food.emoji, x: 300, y: 560, targetX: isZoomed ? 300 : petX, targetY: isZoomed ? 360 : petY - 30, food };
      else {
        const r = canvas.getBoundingClientRect();
        if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) completeFeed(food);
      }
    });

    function updateHUD() {
      const char = getActiveChar(), pet = ensurePetState(char.id), timeInfo = getCurrentHourInfo();
      const sched = getScheduledState(timeInfo);
      const outfit = OUTFITS[pet.outfitIdx || 0] || OUTFITS[0];
      const viewRoom = MAP_ROOMS[viewRoomId] || MAP_ROOMS.living;
      const petRoom = MAP_ROOMS[pet.currentRoom] || MAP_ROOMS.living;

      document.getElementById('header-title').textContent = char.name;
      document.getElementById('btn-sound').textContent = state.soundEnabled ? '🔊' : '🔇';
      document.getElementById('time-display').textContent = `🔒 ${timeInfo.label} (${sched.label})`;
      document.getElementById('room-title-badge').textContent = `${viewRoom.icon} ${viewRoom.name}`;
      document.getElementById('outfit-name').textContent = outfit.name;
      document.getElementById('zoom-icon').textContent = isZoomed ? '🔎' : '🔍';
      document.getElementById('zoom-label').textContent = isZoomed ? '縮細全景' : '放大特寫';

      document.getElementById('daily-cap-exp').textContent = `📈 今日EXP ${pet.dailyExpGained}/${DAILY_EXP_CAP}`;
      document.getElementById('daily-cap-coins').textContent = `🪙 今日金幣 ${pet.dailyCoinsGained}/${DAILY_COINS_CAP}`;
      document.getElementById('daily-lock-badge').classList.toggle('hidden', !(pet.dailyExpGained >= DAILY_EXP_CAP && pet.dailyCoinsGained >= DAILY_COINS_CAP));

      ['up', 'down', 'left', 'right'].forEach(d => {
        const btn = document.getElementById('dir-' + d);
        btn.disabled = !viewRoom[d] || isZoomed;
        btn.title = viewRoom[d] ? `前往 ${MAP_ROOMS[viewRoom[d]].name}` : '';
        const lbl = document.getElementById('lbl-' + d);
        if (lbl) lbl.textContent = viewRoom[d] ? MAP_ROOMS[viewRoom[d]].short : '';
      });

      const bubble = document.getElementById('speech-bubble');
      const tracker = document.getElementById('tracker-arrow');
      if (isZoomed || pet.currentRoom === viewRoomId) {
        bubble.classList.remove('hidden'); tracker.classList.add('hidden');
      } else {
        bubble.classList.add('hidden'); tracker.classList.remove('hidden');
        const dx = petRoom.gx - viewRoom.gx, dy = petRoom.gy - viewRoom.gy;
        let arrow = '🧭';
        if (Math.abs(dx) >= Math.abs(dy)) arrow = dx > 0 ? '➡️' : '⬅️';
        else arrow = dy > 0 ? '⬇️' : '⬆️';
        document.getElementById('tracker-dir').textContent = arrow;
        document.getElementById('tracker-text').textContent = `${char.name}喺 ${petRoom.short}`;
      }

      document.getElementById('bond-level').textContent = pet.bondLevel;
      document.getElementById('coins-count').textContent = pet.coins;
      const h = Math.round(pet.hunger), m = Math.round(pet.mood), en = Math.round(pet.energy);
      document.getElementById('val-hunger').textContent = `${h}%`; document.getElementById('bar-hunger').style.width = `${h}%`;
      document.getElementById('val-mood').textContent = `${m}%`; document.getElementById('bar-mood').style.width = `${m}%`;
      document.getElementById('val-energy').textContent = `${en}%`; document.getElementById('bar-energy').style.width = `${en}%`;
    }

    ['up', 'down', 'left', 'right'].forEach(dir => {
      document.getElementById('dir-' + dir).addEventListener('click', () => {
        const nextId = MAP_ROOMS[viewRoomId][dir]; if (!nextId) return;
        viewRoomId = nextId; document.getElementById('choice-overlay').classList.add('hidden'); playSFX('pat'); updateHUD();
      });
    });

    document.getElementById('tracker-arrow').addEventListener('click', () => {
      const initPet = ensurePetState(state.activeCharId); if (!MAP_ROOMS[initPet.currentRoom]) initPet.currentRoom = "living"; viewRoomId = initPet.currentRoom; playSFX('pat'); updateHUD();
    });
    document.getElementById('btn-find-pet').addEventListener('click', () => {
      viewRoomId = ensurePetState(state.activeCharId).currentRoom; playSFX('pat'); updateHUD();
    });
    document.getElementById('btn-zoom').addEventListener('click', () => { isZoomed = !isZoomed; playSFX('pat'); updateHUD(); });
    document.getElementById('btn-outfit').addEventListener('click', () => {
      const pet = ensurePetState(state.activeCharId);
      pet.outfitIdx = ((pet.outfitIdx || 0) + 1) % OUTFITS.length;
      const o = OUTFITS[pet.outfitIdx];
      playSFX('eat');
      if (o.id === 'school') speakAndShow('「換咗黑學蘭＋無拉鏈衛衣校服！連放大圖都會跟住轉！✨」');
      else if (o.id === 'pajama') speakAndShow('「換咗白色短袖家居服，好爽好舒服！👕」');
      else speakAndShow('「換返烏野10號隊服，熱血晒！🏐」');
      updateHUD(); saveState();
    });

    document.getElementById('btn-sound').addEventListener('click', () => {
      state.soundEnabled = !state.soundEnabled;
      updateHUD(); saveState();
      if (state.soundEnabled) playSFX('pat');
    });

    document.getElementById('btn-schedule').addEventListener('click', openScheduleModal);
    document.getElementById('close-schedule').addEventListener('click', () => document.getElementById('schedule-modal').classList.add('hidden'));
    if (false) document.getElementById('btn-schedule').addEventListener('x', () => {
      document.getElementById('char-list').innerHTML = Object.values(getAllCharacters()).map(c => {
        const pet = ensurePetState(c.id), active = c.id === state.activeCharId;
        return `<div class="flex items-center justify-between p-2.5 rounded-2xl border-2 border-[#2d1e12] ${active ? 'bg-orange-100' : 'bg-white'}">
          <div class="flex items-center gap-2.5"><div class="w-9 h-9 rounded-full border-2 border-[#2d1e12] flex items-center justify-center text-white font-black text-xs" style="background:${c.hairColor}">${c.name[0]}</div>
          <div><div class="text-sm font-black">${c.name}</div><div class="text-[10px] text-slate-600">${c.subtitle} · Lv.${pet.bondLevel}</div></div></div>
          <button type="button" data-pick-char="${c.id}" class="px-3 py-1 rounded-xl text-xs font-bold border-2 border-[#2d1e12] ${active ? 'bg-slate-200' : 'bg-orange-500 text-white'}">${active ? '養成中' : '切換'}</button></div>`;
      }).join('');
      document.getElementById('char-modal').classList.remove('hidden');
    });
    document.getElementById('btn-close-modal').addEventListener('click', () => document.getElementById('char-modal').classList.add('hidden'));
    document.getElementById('char-list').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-pick-char]'); if (!btn) return;
      state.activeCharId = btn.dataset.pickChar; syncScheduleActivity(ensurePetState(state.activeCharId), false);
      renderDock(); updateHUD(); saveState(); document.getElementById('char-modal').classList.add('hidden');
    });
    document.getElementById('add-char-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('new-name').value.trim(); if (!name) return;
      const id = 'custom_' + Date.now(), quote = document.getElementById('new-quote').value.trim() || `「哥哥你好！我係 ${name}！」`;
      state.customCharacters[id] = {
        id, name, subtitle: document.getElementById('new-sub').value.trim() || '自訂動漫角色',
        hairColor: document.getElementById('new-hair').value, eyeColor: document.getElementById('new-eye').value,
        foods: DEFAULT_CHARACTERS.hinata.foods,
        dialogues: { sleep: ['「Zzz…」'], brush: [quote], breakfast: [quote], tea: [quote], tv: [quote], fridge: [quote], cook: [quote], hallway: [quote], gaming: [quote], homework: [quote], bath: [quote], backyard: [quote], street: [quote], school_class: [quote], lunch: [quote], school_court: [quote], pet: ['「哥哥摸頭好舒服呀！」'], waking: ['「唔…哥哥發生咩事？」'], backToSleep: ['「哥哥晚安…Zzz」'], leaving: ['「夠鐘做下一個行程喇～」'], capped: ['「今日上限已滿！」'] }
      };
      state.activeCharId = id; ensurePetState(id); speakAndShow(quote); renderDock(); updateHUD(); saveState();
      document.getElementById('add-char-form').reset(); document.getElementById('char-modal').classList.add('hidden');
    });
    if (false) document.getElementById('btn-schedule').addEventListener('x2', () => {
      const char = getActiveChar();
      state.pets[char.id] = { hunger: 80, mood: 85, energy: 90, bondExp: 15, bondLevel: 1, coins: 50, outfitIdx: 0, currentRoom: 'room_hinata', currentActivity: 'sleep', scheduleSlotKey: '', dailyDate: getTodayStr(), dailyExpGained: 0, dailyCoinsGained: 0, lastUpdated: Date.now() };
      syncScheduleActivity(state.pets[char.id], false);
      viewRoomId = state.pets[char.id].currentRoom;
      updateHUD(); saveState(); showToast(`已重置 ${char.name} 嘅進度`);
    });

    // 每 3 秒即時結算一次精力／飽食／心情變化
    setInterval(() => {
      const pet = ensurePetState(state.activeCharId);
      applyTimeStatsDelta(pet, 3000);
      updateHUD(); saveState();
    }, 3000);

    window.addEventListener('error', (ev) => {
      try { showToast('JS Error: ' + (ev.message || ev.error)); } catch (_) {}
    });
    function updateHeaderDateTime() {
      const el = document.getElementById('header-datetime');
      if (!el) return;
      const now = new Date();
      const days = ['日', '一', '二', '三', '四', '五', '六'];
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const hh = String(now.getHours()).padStart(2, '0');
      const mi = String(now.getMinutes()).padStart(2, '0');
      el.textContent = `${mm}/${dd} (${days[now.getDay()]}) ${hh}:${mi}`;
    }
    updateHeaderDateTime();
    setInterval(updateHeaderDateTime, 10000);
    loadAssets();
    loadState();
    viewRoomId = ensurePetState(state.activeCharId).currentRoom;
    renderDock();
    updateHUD();
    gameLoop();
  </script>

  <script>
    (function initFirebaseCloudSync() {
      try {
        const firebaseConfig = {
          apiKey: "AIzaSyCqASayonPmiJSoku8s0oTrS12hv-0_P10",
          authDomain: "hinata-tamagotchi.firebaseapp.com",
          projectId: "hinata-tamagotchi",
          storageBucket: "hinata-tamagotchi.firebasestorage.app",
          messagingSenderId: "197709491427",
          appId: "1:197709491427:web:9af960329df8d5c327e9d6",
          measurementId: "G-FHFZJV1M8T"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const saveRef = db.collection('hinata_saves').doc('main');
        const TS_KEY = 'hinata_cloud_ts_v1';
        let syncTimer = null;
        let lastSyncedAt = Number(localStorage.getItem(TS_KEY) || 0);
        let applyingRemote = false;

        const origSaveState = saveState;
        window.saveState = saveState = function () {
          origSaveState();
          if (applyingRemote) return;
          const nowTs = Date.now();
          lastSyncedAt = nowTs;
          try { localStorage.setItem(TS_KEY, String(nowTs)); } catch (e) {}
          clearTimeout(syncTimer);
          syncTimer = setTimeout(() => {
            saveRef.set({ state: JSON.parse(JSON.stringify(state)), updatedAt: lastSyncedAt })
              .then(() => {
                const el = document.getElementById('save-status');
                if (el) el.textContent = '☁️ 雲端已同步';
              })
              .catch(() => {});
          }, 1200);
        };

        saveRef.onSnapshot((snap) => {
          if (!snap.exists) {
            saveRef.set({ state: JSON.parse(JSON.stringify(state)), updatedAt: Date.now() }).catch(() => {});
            return;
          }
          const data = snap.data();
          if (!data || !data.state) return;
          const remoteTs = Number(data.updatedAt || 0);
          if (remoteTs > lastSyncedAt) {
            applyingRemote = true;
            state = { ...state, ...data.state };
            lastSyncedAt = remoteTs;
            try {
              localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
              localStorage.setItem(TS_KEY, String(remoteTs));
            } catch (e) {}
            const p = ensurePetState(state.activeCharId);
            syncScheduleActivity(p, false);
            viewRoomId = MAP_ROOMS[p.currentRoom] ? p.currentRoom : 'living';
            renderDock();
            updateHUD();
            const el = document.getElementById('save-status');
            if (el) el.textContent = '☁️ 雲端已同步';
            applyingRemote = false;
          }
        }, () => {});
      } catch (e) {}
    })();
  </script>
