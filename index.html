<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="icon" type="image/png" href="./icon.png?v=58">
  <link rel="apple-touch-icon" href="./icon.png?v=58">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Q版動漫電子雞｜日向翔陽生活養成記</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    input, textarea { user-select: text; -webkit-user-select: text; -webkit-touch-callout: default; }
html, body {
      overscroll-behavior: none;
      overflow: hidden;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      touch-action: manipulation;
      -webkit-overflow-scrolling: auto;
    }
    body {
      font-family: 'Noto Sans TC', 'Inter', sans-serif;
      background: radial-gradient(circle at top, #fff1e6 0%, #ffd8be 55%, #ffc49b 100%);
      min-height: 100vh;
      margin: 0;
      color: #2d1e12;
      overflow-x: hidden;
    }
    .tama-shell {
      background: linear-gradient(165deg, #ff8533 0%, #ff6314 52%, #e64900 100%);
      box-shadow: 0 24px 50px rgba(217, 72, 15, 0.35), inset 0 6px 14px rgba(255, 255, 255, 0.5), inset 0 -10px 20px rgba(124, 35, 0, 0.35);
      border: 5px solid #fff7f0;
    }
    .hd-canvas { touch-action: none; }
    .ui-card { border: 2.5px solid #2d1e12; box-shadow: 0 4px 0 rgba(45, 30, 18, 0.85); }
    .dock-chip, .ctrl-pill { border: 2px solid #2d1e12; box-shadow: 0 3px 0 rgba(45, 30, 18, 0.85); touch-action: none; transition: transform 0.1s ease, opacity 0.15s ease; }
    .dock-chip:active, .ctrl-pill:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(45, 30, 18, 0.85); }
    .inscreen-dir {
      border: 2px solid rgba(45, 30, 18, 0.85);
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.25);
      transition: transform 0.1s ease, opacity 0.15s ease;
    }
    .inscreen-dir:active:not(:disabled) { transform: scale(0.9); }
    .inscreen-dir:disabled { opacity: 0.22; pointer-events: none; }
    #drag-ghost { position: fixed; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%) scale(1.25); font-size: 30px; }
  </style>
</head>
<body class="flex flex-col items-center justify-center p-3 sm:p-5">

  <div class="tama-shell w-full max-w-md rounded-[3rem] p-4 sm:p-5 relative">

    <!-- Top Bezel -->
    <div class="flex items-center justify-between mb-2 px-1.5 text-white">
      <div class="flex items-center gap-2">
        <span class="w-8 h-8 rounded-full bg-white/25 flex items-center justify-center text-base border-2 border-white/50">🏐</span>
        <div>
          <div class="flex items-center gap-1.5 flex-wrap"><h1 id="header-title" class="text-base sm:text-lg font-black tracking-wide leading-tight">日向翔陽</h1><span id="header-datetime" class="text-[10px] font-bold bg-white/25 px-2 py-0.5 rounded-full border border-white/40 whitespace-nowrap"></span></div>
          <p id="header-sub" class="text-[11px] text-orange-100">烏野 #10 · 現實時間同步</p>
        </div>
      </div>
      <div class="grid grid-cols-2 gap-1 shrink-0">
        <button id="btn-sound" type="button" class="whitespace-nowrap px-2 py-0.5 rounded-full bg-white/90 hover:bg-white text-[#2d1e12] border-2 border-[#2d1e12] flex items-center justify-center text-[10px] font-bold shadow-sm transition">🔊</button>
        <button id="btn-settings" type="button" class="whitespace-nowrap px-2 py-0.5 rounded-full bg-white text-[#2d1e12] font-bold text-[10px] border-2 border-[#2d1e12] shadow-sm hover:bg-amber-50 transition">⚙️ 數值</button>
        <button id="btn-holiday" type="button" class="whitespace-nowrap px-2 py-0.5 rounded-full bg-white text-emerald-700 font-bold text-[10px] border-2 border-[#2d1e12] shadow-sm hover:bg-emerald-50 transition">🏖️ 設明日假期</button>
        <button id="btn-schedule" type="button" class="whitespace-nowrap px-2 py-0.5 rounded-full bg-white text-orange-600 font-bold text-[10px] border-2 border-[#2d1e12] shadow-sm hover:bg-orange-50 transition">📅 生活作息</button>
      </div>
    </div>

    <!-- Screen Frame -->
    <div class="bg-[#2d1e12] p-2.5 rounded-[1.75rem] shadow-inner">
      <!-- Top Mini HUD (現實時間已鎖定，不可手動調整) -->
      <div class="bg-[#fef3c7] border-b-2 border-[#2d1e12] rounded-t-2xl px-2.5 py-1.5 space-y-1 text-[11px] font-bold text-[#2d1e12]">
        <div class="flex items-center justify-between gap-1 whitespace-nowrap">
          <span id="time-display" class="bg-white/90 border border-[#2d1e12] px-1.5 py-0.5 rounded text-[10px] truncate max-w-[138px]">🔒 現實時間</span>
          <span id="room-title-badge" class="bg-orange-500 text-white px-2 py-0.5 rounded text-[10px] truncate max-w-[105px]">🏠 1F 客廳</span>
          <span class="text-[10px] shrink-0">💖Lv.<span id="bond-level">1</span> · 🪙<span id="coins-count">50</span></span>
        </div>
        <div class="flex items-center justify-between text-[10px] bg-white/80 rounded-lg px-2 py-0.5 border border-amber-300 whitespace-nowrap">
          <span id="daily-cap-exp">📈 今日EXP 0/100</span>
          <span id="daily-lock-badge" class="hidden text-rose-600 font-black">🔒 EXP已達上限</span>
          <button id="snack-bag-display" type="button" class="font-bold text-amber-800 hover:underline cursor-pointer">🎒 小食: 無</button>
          <span class="font-black text-emerald-700">👛 零錢 <span id="pocket-money">20</span></span>
        </div>
      </div>

      <!-- 600x600 HD Anime Room Canvas -->
      <div class="relative w-full aspect-square bg-sky-100 overflow-hidden">
        <canvas id="game-canvas" width="600" height="600" class="hd-canvas w-full h-full block cursor-pointer"></canvas>

        <!-- Top-Left Mailbox Button -->
        <button id="btn-mailbox" type="button" class="absolute top-2.5 left-2.5 bg-white/95 hover:bg-amber-50 border-2 border-[#2d1e12] rounded-xl px-2 py-1 text-base shadow-md z-30 flex items-center justify-center" title="信箱">
          <span>✉️</span>
          <span id="mailbox-badge" class="hidden -mt-3 -ml-1 bg-rose-600 text-white text-[10px] font-black w-4 h-4 rounded-full flex items-center justify-center border border-white">!</span>
        </button>

        <!-- Speech Bubble -->
        <div id="speech-bubble" class="pointer-events-none absolute top-9 left-1/2 -translate-x-1/2 w-[84%] bg-white/95 border-2 border-[#2d1e12] rounded-2xl px-3 py-1.5 text-center text-xs font-bold text-[#2d1e12] shadow-md leading-snug z-10">
          「哥哥你返嚟啦！今日一齊練排球！」
        </div>

        <!-- In-Screen 4-Way Navigation Arrows -->
        <button id="dir-up" type="button" class="inscreen-dir absolute top-1.5 left-1/2 -translate-x-1/2 bg-white/85 hover:bg-orange-100 text-[#2d1e12] rounded-full px-3 py-0.5 text-xs font-black z-20 flex items-center gap-1" title="向上">
          <span>▲</span><span id="lbl-up" class="text-[9px] hidden sm:inline"></span>
        </button>
        <button id="dir-down" type="button" class="inscreen-dir absolute bottom-1.5 left-1/2 -translate-x-1/2 bg-white/85 hover:bg-orange-100 text-[#2d1e12] rounded-full px-3 py-0.5 text-xs font-black z-20 flex items-center gap-1" title="向下">
          <span>▼</span><span id="lbl-down" class="text-[9px] hidden sm:inline"></span>
        </button>
        <button id="dir-left" type="button" class="inscreen-dir absolute left-1.5 top-1/2 -translate-y-1/2 bg-white/85 hover:bg-orange-100 text-[#2d1e12] rounded-full w-8 h-8 text-xs font-black z-20 flex items-center justify-center" title="向左">◀</button>
        <button id="dir-right" type="button" class="inscreen-dir absolute right-1.5 top-1/2 -translate-y-1/2 bg-white/85 hover:bg-orange-100 text-[#2d1e12] rounded-full w-8 h-8 text-xs font-black z-20 flex items-center justify-center" title="向右">▶</button>

        <!-- Interactive Overlay (RPS / Chat / Jump Training) -->
        <div id="choice-overlay" style="touch-action: pan-y;" class="hidden absolute top-9 bottom-10 left-1/2 -translate-x-1/2 w-[90%] overflow-y-auto bg-white/95 border-2 border-[#2d1e12] rounded-2xl p-2.5 shadow-xl z-30 flex flex-col items-stretch justify-start gap-1.5"></div>

        <!-- Rally Mini-game Overlay -->
        <div id="mg-hud" class="hidden pointer-events-none absolute bottom-10 left-1/2 -translate-x-1/2 bg-[#2d1e12]/90 text-white text-xs font-bold px-3.5 py-1 rounded-full shadow z-20">
          🏐 雙人對打：<span id="mg-score">0</span> 回合 ｜ <span id="mg-turn">輪到你接波！</span>
        </div>
      </div>

      <!-- Stat Bars -->
      <div class="bg-[#fff7ed] border-t-2 border-[#2d1e12] rounded-b-2xl px-3 py-1.5 grid grid-cols-3 gap-x-2 gap-y-1.5 text-[11px] font-bold">
        <div>
          <div class="flex justify-between mb-0.5"><span>🍙 飽食</span><span id="val-hunger">80%</span></div>
          <div class="border border-[#2d1e12] bg-white h-2.5 rounded-full overflow-hidden"><div id="bar-hunger" class="h-full bg-amber-500 transition-all duration-300" style="width:80%"></div></div>
        </div>
        <div>
          <div class="flex justify-between mb-0.5"><span>😊 心情</span><span id="val-mood">85%</span></div>
          <div class="border border-[#2d1e12] bg-white h-2.5 rounded-full overflow-hidden"><div id="bar-mood" class="h-full bg-rose-500 transition-all duration-300" style="width:85%"></div></div>
        </div>
        <div>
          <div class="flex justify-between mb-0.5"><span>⚡ 精力</span><span id="val-energy">90%</span></div>
          <div class="border border-[#2d1e12] bg-white h-2.5 rounded-full overflow-hidden"><div id="bar-energy" class="h-full bg-emerald-500 transition-all duration-300" style="width:90%"></div></div>
        </div>
        <div>
          <div class="flex justify-between mb-0.5"><span>🚽 尿意</span><span id="val-bladder">0%</span></div>
          <div class="border border-[#2d1e12] bg-white h-2.5 rounded-full overflow-hidden"><div id="bar-bladder" class="h-full bg-sky-400 transition-all duration-300" style="width:0%"></div></div>
        </div>
        <div></div>
        <div></div>
      </div>
    </div>

    <!-- Quick Controls -->
    <div class="mt-1.5 grid grid-cols-3 gap-1.5">
      <button id="btn-zoom" type="button" class="ctrl-pill bg-white hover:bg-orange-50 rounded-xl py-1 px-2 text-[11px] font-black flex items-center justify-center gap-1">
        <span id="zoom-icon">🔍</span><span id="zoom-label">放大特寫</span>
      </button>
      <button id="btn-outfit" type="button" class="ctrl-pill bg-white hover:bg-orange-50 rounded-xl py-1 px-2 text-[11px] font-black flex items-center justify-center gap-1">
        <span>👕</span><span id="outfit-name">烏野隊服</span>
      </button>
      <button id="btn-find-pet" type="button" class="ctrl-pill bg-amber-100 hover:bg-amber-200 rounded-xl py-1 px-2 text-[11px] font-black flex items-center justify-center gap-1">
        <span>🧭</span><span>搵翔陽</span>
      </button>
    </div>

    <!-- Bottom Interactive Dock -->
    <div class="mt-2.5 bg-[#fff7ed] ui-card rounded-2xl p-2">
      <div class="flex items-center justify-between mb-1.5">
        <div class="flex gap-1 items-center">
          <button id="tab-food" type="button" class="px-2 py-0.5 rounded-lg text-[11px] font-black border-2 border-[#2d1e12] bg-orange-500 text-white">🍱 餵食</button>
          <button id="tab-act" type="button" class="px-2 py-0.5 rounded-lg text-[11px] font-black border-2 border-[#2d1e12] bg-white text-[#2d1e12]">✨ 互動</button>
          <button id="tab-shop" type="button" class="px-2 py-0.5 rounded-lg text-[11px] font-black border-2 border-[#2d1e12] bg-white text-[#2d1e12]">🛒 購物</button>
        </div>
        <div id="act-pager" class="hidden flex items-center gap-1">
          <button id="btn-act-prev" type="button" class="px-1.5 py-0.5 rounded bg-amber-100 hover:bg-amber-200 border border-[#2d1e12] text-[10px] font-black">◀</button>
          <span id="act-page-lbl" class="text-[10px] font-black text-[#2d1e12]">1/2</span>
          <button id="btn-act-next" type="button" class="px-1.5 py-0.5 rounded bg-amber-100 hover:bg-amber-200 border border-[#2d1e12] text-[10px] font-black">▶</button>
        </div>
      </div>
      <div id="dock-tray" class="grid grid-cols-4 grid-rows-2 gap-1.5 h-[132px]"></div>
    </div>

    <!-- Footer -->
    <div class="mt-2.5 flex items-center justify-between text-[11px] text-orange-100 px-2">
      <span id="save-status">💾 已自動儲存 · v58</span>
      
    </div>

  </div>

  <div id="drag-ghost" class="hidden">🍙</div>

  <!-- Modal: 每日生活作息表 -->
  <div id="schedule-modal" class="hidden fixed inset-0 bg-black/55 backdrop-blur-xs z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl w-full max-w-sm p-5 shadow-2xl border-2 border-[#2d1e12] max-h-[82vh] flex flex-col">
      <div class="flex justify-between items-center mb-3 shrink-0">
        <h3 class="text-lg font-black text-orange-600">📅 翔陽每日生活作息表</h3>
        <button id="close-schedule" type="button" class="text-gray-400 hover:text-gray-700 font-bold text-lg px-2">✕</button>
      </div>
      <div id="schedule-list" style="touch-action: pan-y;" class="space-y-2 overflow-y-auto pr-1 text-xs"></div>
    </div>
  </div>

  <!-- Modal: 大版面數值與隨機事件設定 -->
  <div id="settings-modal" class="hidden fixed inset-0 bg-black/55 backdrop-blur-xs z-50 flex items-center justify-center p-3">
    <div class="bg-[#fff7ed] rounded-3xl w-full max-w-md p-4 shadow-2xl border-2 border-[#2d1e12] max-h-[88vh] flex flex-col">
      <div class="flex justify-between items-center mb-2 shrink-0">
        <h3 class="text-base font-black text-orange-600">⚙️ 數值、外出時間與隨機事件設定</h3>
        <button id="close-settings-modal" type="button" class="text-gray-500 hover:text-gray-800 font-bold text-lg px-2">✕</button>
      </div>
      <div id="settings-modal-body" style="touch-action: pan-y;" class="space-y-2 overflow-y-auto pr-1 flex-1"></div>
      <div class="mt-2.5 flex items-center justify-center gap-2 shrink-0">
        <button id="heal-stats-modal" type="button" class="px-3 py-1.5 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white border-2 border-[#2d1e12] text-xs font-black">🩹 恢復健康數值</button>
        <button id="done-settings-modal" type="button" class="px-5 py-1.5 rounded-xl bg-orange-500 hover:bg-orange-600 text-white border-2 border-[#2d1e12] text-xs font-black">完成儲存</button>
      </div>
    </div>
  </div>

  <!-- Modal: 角色切換 & 新增自訂角色 -->
  <div id="char-modal" class="hidden fixed inset-0 bg-black/55 backdrop-blur-xs z-50 flex items-center justify-center p-4">
    <div class="bg-[#fff7ed] ui-card rounded-3xl w-full max-w-md p-5 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-lg font-black text-[#2d1e12]">角色切換與新增</h2>
        <button id="btn-close-modal" type="button" class="w-8 h-8 rounded-full bg-orange-200 hover:bg-orange-300 flex items-center justify-center font-bold">✕</button>
      </div>
      <div id="char-list" class="space-y-2 mb-4"></div>
      <div class="border-t-2 border-orange-200 pt-3">
        <h3 class="text-sm font-black text-[#2d1e12] mb-2">＋ 新增自訂動漫角色</h3>
        <form id="add-char-form" class="space-y-2 text-xs">
          <div class="grid grid-cols-2 gap-2">
            <div><label class="block font-bold mb-1">角色名稱 *</label><input id="new-name" type="text" required placeholder="例如：孤爪研磨" class="w-full px-2.5 py-2 rounded-xl border-2 border-[#2d1e12] bg-white" /></div>
            <div><label class="block font-bold mb-1">稱號 / 背號</label><input id="new-sub" type="text" placeholder="例如：音駒 #5" class="w-full px-2.5 py-2 rounded-xl border-2 border-[#2d1e12] bg-white" /></div>
          </div>
          <div class="grid grid-cols-3 gap-2">
            <div><label class="block font-bold mb-1">髮色</label><input id="new-hair" type="color" value="#eab308" class="w-full h-8 rounded-lg border-2 border-[#2d1e12] cursor-pointer" /></div>
            <div><label class="block font-bold mb-1">瞳色</label><input id="new-eye" type="color" value="#ca8a04" class="w-full h-8 rounded-lg border-2 border-[#2d1e12] cursor-pointer" /></div>
            <div><label class="block font-bold mb-1">衫色</label><input id="new-shirt" type="color" value="#dc2626" class="w-full h-8 rounded-lg border-2 border-[#2d1e12] cursor-pointer" /></div>
          </div>
          <div><label class="block font-bold mb-1">見面台詞</label><input id="new-quote" type="text" placeholder="例如：哥哥，打機定練波好？" class="w-full px-2.5 py-2 rounded-xl border-2 border-[#2d1e12] bg-white" /></div>
          <button type="submit" class="w-full py-2.5 rounded-xl bg-orange-500 hover:bg-orange-600 text-white font-black text-sm border-2 border-[#2d1e12]">建立並切換角色</button>
        </form>
      </div>
    </div>
  </div>

  <div id="toast" class="hidden fixed bottom-5 left-1/2 -translate-x-1/2 bg-[#2d1e12] text-white text-xs font-bold px-4 py-2 rounded-full shadow-lg z-50"></div>

    function getRoomMoveDir(fromId, toId) {
      const steps = findRoomPath(fromId, toId);
      const hop = steps[0] || toId;
      const r = MAP_ROOMS[fromId];
      if (!r) return 'right';
      if (r.up === hop) return 'up';
      if (r.down === hop) return 'down';
      if (r.left === hop) return 'left';
      if (r.right === hop) return 'right';
      const t = MAP_ROOMS[toId];
      if (t) {
        const dx = t.gx - r.gx, dy = t.gy - r.gy;
        if (Math.abs(dy) > Math.abs(dx)) return dy < 0 ? 'up' : 'down';
        if (dx !== 0) return dx < 0 ? 'left' : 'right';
      }
      return 'right';
    }

      if (dir === 'left')  return { ex: 60,  ey: 440, ix: 540, iy: 440 };

      const dir = getRoomMoveDir(pet.currentRoom, destRoom);
      const edge = getDirEdgeCoords(dir);
      transitionState = { phase: 'out', targetRoom: destRoom, targetActivity: destAct, tx: px, ty: py, alpha: 1, ...edge };

    function findRoomPath(startId, endId) {
      if (!startId || !endId || startId === endId) return [];
      const q = [[startId]];
      const seen = new Set([startId]);
      while (q.length) {
        const path = q.shift();
        const cur = path[path.length - 1];
        const r = MAP_ROOMS[cur];
        if (!r) continue;
        for (const dir of ['up', 'down', 'left', 'right']) {
          const nxt = r[dir];
          if (!nxt || seen.has(nxt)) continue;
          const nextPath = [...path, nxt];
          if (nxt === endId) return nextPath.slice(1);
          seen.add(nxt);
          q.push(nextPath);
        }
      }
      return [endId];
    }

          const canPark = ae.parkAsk.maxPerDay > 0 && (cnt.parkAsk || 0) < ae.parkAsk.maxPerDay && ae.parkAsk.prob > 0;
          const roll = Math.random();
          if (canKonbini && Math.random() < (ae.konbiniAsk.prob / 100) && document.getElementById('choice-overlay').classList.contains('hidden')) {
            cnt.konbiniAsk = (cnt.konbiniAsk || 0) + 1;
            const box = document.getElementById('choice-overlay');
            const km = (state.outingMins && state.outingMins.konbini) || 15;
            speakAndShow(`「哥哥～夜晚不如一齊落便利店行 ${km} 分鐘買熱肉包好唔好？🏪🥟」`);
            box.innerHTML = `<div class="text-center text-xs font-black text-[#2d1e12]">🏪 翔陽問哥哥去唔去便利店（停留 ${km} 分鐘）：</div>
              <div class="flex justify-center gap-2 mt-1">
                <button type="button" data-konbini-ask="yes" class="px-3 py-1 rounded-xl bg-emerald-500 text-white border-2 border-[#2d1e12] text-xs font-black">🏪 好呀一齊去</button>
                <button type="button" data-konbini-ask="no" class="px-3 py-1 rounded-xl bg-slate-200 text-[#2d1e12] border-2 border-[#2d1e12] text-xs font-black">🏠 唔去住</button>
              </div>`;
            box.classList.remove('hidden');
          } else if (canPark && Math.random() < (ae.parkAsk.prob / 100)) {
            cnt.parkAsk = (cnt.parkAsk || 0) + 1;
            const pm = (state.outingMins && state.outingMins.park) || 30;
            startDuoOuting('park', pm, 'park_breeze', `翔陽約哥哥去公園吹海風（${pm}分鐘）🌳`, `「翔陽：哥哥我哋落公園散步吹下海風吖！留 ${pm} 分鐘就返～🌳🌊」`);
          } else {
            const aeBy = ae.backyardAsk || { prob: 13, maxPerDay: 0, mins: 15 };
            const byOk = (aeBy.prob > 0) && (aeBy.maxPerDay === 0 || (cnt.backyardAsk || 0) < aeBy.maxPerDay);
            if (byOk && Math.random() < (aeBy.prob / 100)) {
              cnt.backyardAsk = (cnt.backyardAsk || 0) + 1;
              pet.backyardUntil = Date.now() + (aeBy.mins || 15) * 60000;
              pet.currentRoom = 'backyard'; pet.currentActivity = 'backyard';
              targetX = 250; targetY = 435;
              if (!state.broSoloMode) { bro.currentRoom = 'backyard'; bro.currentActivity = 'backyard'; bro.tx = 370; bro.ty = 435; }
              if (viewRoomId === 'living' || viewRoomId === 'backyard') {
                viewRoomId = 'backyard';
                speakAndShow(`「翔陽：哥哥同我去後院托 ${aeBy.mins || 15} 分鐘排球先！🏐✨」`);
              }
            }
          }
        }
      }

      // 6a. 17:30-18:15 Home Arrival Sequence (15s hallway -> 30s room unpack -> 15m living rest +30 energy -> backyard)
      if (!info.isWeekend && sched.isHomeSeq) {
        const nowHms = Date.now();
        const tdH = getTodayStr();
        if (pet.homeSeqDate !== tdH || !pet.homeSeqStage) {
          pet.homeSeqDate = tdH;
          pet.homeSeqStage = 'hall15s';
          pet.homeSeqUntil = nowHms + 15000;
          pet.currentRoom = 'hallway'; pet.currentActivity = 'hallway'; targetX = 215; targetY = 440;
        } else if (pet.homeSeqStage === 'hall15s' && nowHms >= (pet.homeSeqUntil || 0)) {
          pet.homeSeqStage = 'room30s'; pet.homeSeqUntil = nowHms + 30000;
          pet.currentRoom = 'room_hinata'; pet.currentActivity = 'unpack_bag'; targetX = 200; targetY = 435;
          if (viewRoomId === 'hallway' || viewRoomId === 'room_hinata') { viewRoomId = 'room_hinata'; speakAndShow('「返入房放低書包同整理好裝備先～🎒」'); }
          updateHUD(); saveState();
        } else if (pet.homeSeqStage === 'room30s' && nowHms >= (pet.homeSeqUntil || 0)) {
          pet.homeSeqStage = 'living15m'; pet.homeSeqUntil = nowHms + 15 * 60 * 1000;
          pet.currentRoom = 'living'; pet.currentActivity = 'tea'; targetX = 280; targetY = 440;
          if (viewRoomId === 'room_hinata' || viewRoomId === 'living') { viewRoomId = 'living'; speakAndShow('「喺客廳飲杯茶休息 15 分鐘先再練球！慢慢回氣中～🍵💛」'); }
          updateHUD(); saveState();
        } else if (pet.homeSeqStage === 'living15m' && nowHms >= (pet.homeSeqUntil || 0)) {
          pet.homeSeqStage = 'backyard'; pet.outfitIdx = 0;
          pet.currentRoom = 'backyard'; pet.currentActivity = 'backyard'; targetX = 315; targetY = 435;
          if (viewRoomId === 'living' || viewRoomId === 'backyard') { viewRoomId = 'backyard'; speakAndShow('「休息夠啦！換好隊服去後院練排球直至食晚飯！🏐🔥」'); }
          updateHUD(); saveState();
        }
      }

      // 6a-2. Hinata Fridge Self-Service (hunger <= 50 in 17:30 living15m / 21:00 TV / Weekend 12:00-01:30)
      const frMap = state.fridge || {};
      const frKeys = SHOP_ITEMS.filter(it => (frMap[it.id] || 0) > 0);
      if (pet.fridgeStage === 'choosing') {
        if (Date.now() >= (pet.fridgeUntil || 0)) {
          pet.fridgeStage = null;
          if (frKeys.length > 0) {
            const pickIt = frKeys[Math.floor(Math.random() * frKeys.length)];
            frMap[pickIt.id] -= 1;
            const sr = (state.balance && state.balance.shopRate) || { hunger: 3, energy: 3, mood: 0 };
            pet.hunger = Math.min(100, pet.hunger + pickIt.cost * (sr.hunger ?? 3));
            pet.energy = Math.min(100, pet.energy + pickIt.cost * (sr.energy ?? 3));
            pet.mood   = Math.min(100, pet.mood   + pickIt.cost * (sr.mood ?? 0));
            addBladderFromConsume(pet, pickIt.id === 'juice' || pickIt.id === 'tea_soda');
            pet.fridgeWaitingEmpty = false;
            pet.currentRoom = 'living'; pet.currentActivity = 'tea'; targetX = 280; targetY = 440;
            if (viewRoomId === 'kitchen' || viewRoomId === 'living') {
              viewRoomId = 'living';
              speakAndShow(`「喺雪櫃揀咗 ${pickIt.emoji}${pickIt.name} 返客廳食！好味！（飽食/精力 +${pickIt.val}%）😋」`);
            }
          } else {
            pet.fridgeWaitingEmpty = true;
            pet.currentRoom = 'living'; pet.currentActivity = 'tea'; targetX = 280; targetY = 440;
            if (viewRoomId === 'kitchen' || viewRoomId === 'living') {
              viewRoomId = 'living';
              speakAndShow('「雪櫃入面全部都係 0 冇嘢食喇…😢」');
            }
          }
          updateHUD(); saveState();
        }
        return;
      }

      const tdF = getTodayStr();
      const canFridge17 = (!info.isWeekend && pet.homeSeqStage === 'living15m' && pet.fridge17Date !== tdF);
      const canFridge21 = (!info.isWeekend && info.totalMin >= 1260 && info.totalMin < 1440 && pet.fridge21Date !== tdF);
      const canFridgeWe = (info.isWeekend && (info.totalMin >= 720 || info.totalMin < 90) && ((pet.fridgeWeDate !== tdF ? 0 : (pet.fridgeWeCount || 0)) < 2));
      if (!pet.fridgeWaitingEmpty && pet.hunger <= 50 && (canFridge17 || canFridge21 || canFridgeWe) && ['living', 'kitchen', 'room_hinata', 'room_aniki'].includes(pet.currentRoom)) {
        if (canFridge17) pet.fridge17Date = tdF;
        else if (canFridge21) pet.fridge21Date = tdF;
        else { if (pet.fridgeWeDate !== tdF) { pet.fridgeWeDate = tdF; pet.fridgeWeCount = 0; } pet.fridgeWeCount += 1; }
        pet.fridgeStage = 'choosing';
        pet.fridgeUntil = Date.now() + 30000;
        pet.currentRoom = 'kitchen'; pet.currentActivity = 'fridge'; targetX = 145; targetY = 440;
        if (viewRoomId === 'living' || viewRoomId === 'kitchen') { viewRoomId = 'kitchen'; speakAndShow('「有啲肚餓…去雪櫃睇下有咩食先！（揀緊食物 30 秒）🧊」'); }
      }

      // 6a-3. Street 17:00-17:30 walk home vending machine interaction
      if (!info.isWeekend && sched.key === 'wd_homew' && pet.currentRoom === 'street' && pet.dailyStreetDrinkDate !== tdF && (pet.pocketMoney || 0) >= 5) {
        if (Math.random() < 0.35) {
          pet.dailyStreetDrinkDate = tdF;
          pet.pocketMoney -= 5;
          targetX = 485; targetY = 440;
          if (pet.hunger < 30 || pet.energy < 30) {
            pet.hunger = Math.min(100, pet.hunger + 10); pet.energy = Math.min(100, pet.energy + 10);
            if (viewRoomId === 'street') speakAndShow('「行去紅色販賣機買咗罐汽水即刻飲！（零用錢 -5、+10%）🥤✨」');
          } else {
            pet.snacks.drink = (pet.snacks.drink || 0) + 1;
            if (viewRoomId === 'street') speakAndShow('「行去紅色販賣機買咗罐飲品袋好！（零用錢 -5）🥤🎒」');
          }
          updateHUD(); saveState();
        }
      }

      // 6b. Recess roaming (11:00-11:20 / 14:30-14:50), Tuckshop buying, Auto snack eating, Classroom sneak-eating & detention
      const SNACK_META = {
        bread: { name: '麵包', emoji: '🥐', cost: 8, val: 16 },
        drink: { name: '紙包飲品', emoji: '🧃', cost: 7, val: 14 },
        candy: { name: '糖果', emoji: '🍬', cost: 3, val: 6 },
        soda: { name: '汽水', emoji: '🥤', cost: 5, val: 10 },
        snack: { name: '街頭小食', emoji: '🍡', cost: 10, val: 16 },
        nikuman: { name: '熱肉包', emoji: '🥟', cost: 10, val: 20 }
      };
      function tryEatOwnedSnack(reasonMsg) {
        const keys = ['bread', 'drink', 'candy', 'soda', 'snack', 'nikuman'].filter(k => (pet.snacks[k] || 0) > 0);
        if (!keys.length) return false;
        const k = keys[Math.floor(Math.random() * keys.length)];
        pet.snacks[k] -= 1;
        const m = SNACK_META[k];
        pet.hunger = Math.min(100, pet.hunger + m.val);
        pet.energy = Math.min(100, pet.energy + m.val);
        addBladderFromConsume(pet, k === 'drink' || k === 'soda');
        if (viewRoomId === pet.currentRoom) speakAndShow(reasonMsg.replace('{item}', m.emoji + m.name).replace('{val}', m.val));
        return true;
      }

      if (pet.detentionUntil) {
        if (Date.now() >= pet.detentionUntil) {
          pet.detentionUntil = null;
          pet.currentRoom = 'school_class'; pet.currentActivity = 'school_class';
          targetX = 235; targetY = 435;
          if (viewRoomId === 'school_hall') { viewRoomId = 'school_class'; speakAndShow('「罰企完 10 分鐘返入課室啦…以後上堂唔敢偷食住 😅」'); }
        } else {
          pet.currentRoom = 'school_hall'; pet.currentActivity = 'detention';
          targetX = 260; targetY = 440;
          return;
        }
      }

      // Auto-eat held snack when < 30% (NEVER during class!)
      if (!sched.isRecess && pet.currentActivity !== 'school_class' && (pet.hunger < 30 || pet.energy < 30)) {
        tryEatOwnedSnack('「好餓／好攰呀！即刻食返自己身上嘅 {item} 補返 +{val}% 飽食同精力！😋」');
      }

      // Recess (11:00-11:20 & 14:30-14:50): roam class / school_hall / school_tuckshop, buy snack if pocketMoney >= 10
      if (sched.isRecess && !pet.toiletState && !transitionState && Date.now() - lastRecessActAt > 14000) {
        lastRecessActAt = Date.now();
        const tdayR = getTodayStr();
        if (!pet.dailyAutoCounts || pet.dailyAutoCounts.date !== tdayR) pet.dailyAutoCounts = { date: tdayR, toilet: 0, konbiniAsk: 0, parkAsk: 0, backyardAsk: 0, schoolMail: 0, snackBuy: 0 };
        const aeSbR = (state.autoEvents && state.autoEvents.snackBuy) || { prob: 20, maxPerDay: 2 };
        const aeSeR = (state.autoEvents && state.autoEvents.snackEat) || { prob: 35 };
        const skR = pet.snacks || {};
        const totSnR = (skR.bread||0)+(skR.drink||0)+(skR.candy||0)+(skR.soda||0)+(skR.snack||0)+(skR.nikuman||0);
        const sbCntR = pet.dailyAutoCounts.snackBuy || 0;
        const canGoTuck = (pet.hunger < 70 || totSnR === 0) && sbCntR < aeSbR.maxPerDay && aeSbR.prob > 0;
        const rRooms = canGoTuck ? ['school_class', 'school_hall', 'school_tuckshop'] : ['school_class', 'school_hall'];
        const pickR = rRooms[Math.floor(Math.random() * rRooms.length)];
        const nextActR = pickR === 'school_tuckshop' ? 'tuckshop_buy' : 'recess_walk';
        startCharacterWalkTransition(pet, pickR, nextActR, 255, 440);
        if (pickR === 'school_tuckshop' && canGoTuck) {
          if ((pet.pocketMoney || 0) >= 10 && Math.random() < (aeSbR.prob / 100)) {
            pet.dailyAutoCounts.snackBuy = sbCntR + 1;
            const choices = ['bread', 'drink', 'candy'];
            const c = choices[Math.floor(Math.random() * choices.length)];
            const m = SNACK_META[c];
            pet.pocketMoney -= m.cost;
            if (pet.hunger < 30 || pet.energy < 30) {
              pet.hunger = Math.min(100, pet.hunger + m.val);
              pet.energy = Math.min(100, pet.energy + m.val);
              addBladderFromConsume(pet, c === 'drink');
              if (viewRoomId === 'school_tuckshop') speakAndShow(`「小息喺小食部買咗 ${m.emoji}${m.name}（-${m.cost}元）即刻食咗補 +${m.val}%！😋」`);
            } else {
              pet.snacks[c] = (pet.snacks[c] || 0) + 1;
              if (viewRoomId === 'school_tuckshop') speakAndShow(`「小息喺小食部買咗 ${m.emoji}${m.name}（-${m.cost}元）放好喺書包一陣食！🎒」`);
            }
          } else if ((pet.pocketMoney || 0) < 10 && viewRoomId === 'school_tuckshop') {
            speakAndShow('「零用錢少過 10 元…今日小息唔買小食住，返屋企先問哥哥攞…😳」');
          }
        } else if ((pet.hunger < 30 || pet.energy < 30 || Math.random() < ((aeSeR.prob ?? 35) / 100))) {
          tryEatOwnedSnack('「趁小息時間食返身上嘅 {item} 補返 +{val}% 飽食同精力！✨」');
        }
      }

      // Classroom sneak eating (low chance, may be caught -> 10 min detention in school_hall)
      if (pet.currentActivity === 'school_class' && Date.now() - lastSneakCheckAt > 25000) {
        lastSneakCheckAt = Date.now();
        const hasAny = (pet.snacks.bread || 0) + (pet.snacks.drink || 0) + (pet.snacks.candy || 0) > 0;
        if (hasAny && Math.random() < 0.14) {
          if (Math.random() < 0.42) {
            pet.detentionUntil = Date.now() + 10 * 60 * 1000;
            pet.currentRoom = 'school_hall'; pet.currentActivity = 'detention';
            targetX = 260; targetY = 440;
            viewRoomId = 'school_hall';
            speakAndShow('「慘啦！！上堂偷食小食畀老師發現，要罰企走廊 10 分鐘呀！！😳💦」');
            showToast('上堂偷食被老師發現，罰企走廊 10 分鐘！');
          } else {
            tryEatOwnedSnack('「（細聲）趁老師轉身寫黑板偷偷食咗 {item}…補返 +{val}%！🤫」');
          }
        }
      }

      // Shy pocket money request when back home with Brother present and pocketMoney < 10
      const atHome = ['living', 'kitchen', 'hallway', 'room_hinata', 'room_aniki'].includes(pet.currentRoom);
      const broAtHome = ['living', 'kitchen', 'hallway', 'room_hinata', 'room_aniki'].includes(bro.currentRoom);
      if (atHome && broAtHome && (pet.pocketMoney || 0) < 10 && pet.dailyBegPocketDate !== getTodayStr() && document.getElementById('choice-overlay').classList.contains('hidden')) {
        pet.dailyBegPocketDate = getTodayStr();
        const box = document.getElementById('choice-overlay');
        speakAndShow('「哥哥…我啲零用錢得返少過 10 元咋…可唔可以畀少少我？😳👉👈」');
        box.innerHTML = `<div class="w-full text-center text-[11px] font-black text-[#2d1e12]">😳 翔陽零用錢少過 10 元，怕羞問哥哥攞零用錢：</div>
          <button type="button" data-beg-pocket="no" class="px-3 py-1.5 rounded-xl bg-slate-200 hover:bg-slate-300 text-[#2d1e12] border-2 border-[#2d1e12] text-xs font-black">🙅‍♂️ 今次唔畀住</button>
          <button type="button" data-beg-pocket="yes" class="px-3 py-1.5 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white border-2 border-[#2d1e12] text-xs font-black">💵 畀 30 元零用錢</button>`;
        box.classList.remove('hidden');
      }

      // 7. Autonomous In-Room Interactions (every ~18s, excluding eating/cooking/bath/sleep)
      const nowMs = Date.now();
      const petFixed = ['sleep', 'waking', 'breakfast', 'lunch', 'dinner', 'cook', 'bath', 'brush'];
      if (!transitionState && !rally.active && sched.key !== 'wd_hw' && !petFixed.includes(pet.currentActivity) && !['bath', 'canteen', 'hallway'].includes(pet.currentRoom) && nowMs - lastPetAutoActAt > 18000) {
        lastPetAutoActAt = nowMs;
        const furns = (pet.currentRoom === 'hallway') ? [] : (ROOM_FURNITURE[pet.currentRoom] || []).filter(f => f.act !== 'sleep' && f.act !== 'cook' && f.act !== 'breakfast' && f.act !== 'lunch' && f.act !== 'dinner');
        if (furns.length > 1) {
          const pick = furns[Math.floor(Math.random() * furns.length)];
          pet.currentActivity = pick.act;
          const tday2 = getTodayStr();
          if (pet.currentRoom === 'living' && ((info.isWeekend && sched.freeRoam) || (!info.isWeekend && info.totalMin >= 1050)) && !pet.pendingCleanReward && pet.lastCleanDate !== tday2 && Math.random() < 0.14) {
            pet.pendingCleanReward = true; pet.lastCleanDate = tday2;
            openCleanRewardModal();
          }
          targetX = pick.px - (bro.currentRoom === pet.currentRoom ? 35 : 0);
          targetY = pick.py;
          if (viewRoomId === pet.currentRoom) {
            if (bro.currentRoom === pet.currentRoom && Math.random() < 0.55) {
              const dPool = DUO_SAME_ROOM_DIALOGUES[pet.currentRoom] || DUO_SAME_ROOM_DIALOGUES.default;
              speakAndShow(pickLine(dPool));
            } else {
              speakAndShow(pick.line);
            }
          }
        }
      }

      const broFixed = ['sleep', 'brush', 'cook_bfast', 'prep_bfast', 'cook_lunch', 'cook_dinner', 'breakfast', 'lunch', 'dinner', 'canteen_lunch', 'bath'];
      const isCooking = ['cook_bfast', 'cook_lunch', 'cook_dinner'].includes(bro.currentActivity);
      if (isCooking && bro.currentRoom === 'kitchen' && nowMs - lastBroAutoActAt > 6500) {
        lastBroAutoActAt = nowMs;
        bro.tx = (bro.tx < 200) ? 265 : 145;
        bro.ty = (bro.tx < 200) ? 440 : 400;
      }
      const broInterval = (bro.currentRoom === 'pharmacy') ? 9000 : 18000;
      if (!broFixed.includes(bro.currentActivity) && !['bath', 'canteen', 'school_class', 'school_court'].includes(bro.currentRoom) && nowMs - lastBroAutoActAt > broInterval) {
        lastBroAutoActAt = nowMs;
        const bFurns = (bro.currentRoom === 'hallway') ? [] : (ROOM_FURNITURE[bro.currentRoom] || []).filter(f => f.act !== 'sleep' && f.act !== 'cook' && f.act !== 'breakfast' && f.act !== 'lunch' && f.act !== 'dinner');
        if (bFurns.length > 0) {
          const pick = bFurns[Math.floor(Math.random() * bFurns.length)];
          bro.currentActivity = pick.act;
          bro.tx = Math.min(500, pick.px + (bro.currentRoom === pet.currentRoom ? 45 : 0));
          bro.ty = pick.py;
        }
      }

      // 8. Execute Daily SMS Promises at their scheduled times
      const promises = (state.msgLog && state.msgLog.date === getTodayStr() && state.msgLog.promises) ? state.msgLog.promises : {};
      if (!state.outing.type && !state.gamingReturnAt && !transitionState) {
        if (!info.isWeekend && info.totalMin >= 1095 && info.totalMin < 1125 && promises.dinner === 'restaurant') {
          promises.dinner = 'done';
          startDuoOuting('restaurant', 60, 'restaurant', '照今朝訊息約定，一齊去餐廳食晚餐！🍽️', '「哥哥！我記得我哋今日約咗去餐廳食大餐㗎！好期待呀～🍽️❤️」');
        } else if (info.totalMin >= 1160 && info.totalMin < 1215 && promises.play_mode === 'study') {
          promises.play_mode = 'done';
          pet.currentRoom = 'room_hinata'; pet.currentActivity = 'homework'; targetX = 165; targetY = 430;
          bro.currentRoom = 'room_hinata'; bro.currentActivity = 'tutoring'; bro.tx = 255; bro.ty = 430;
          if (viewRoomId === 'room_aniki' || viewRoomId === 'room_hinata') {
            viewRoomId = 'room_hinata';
            speakAndShow('「哥哥！照今朝訊息講好咗一齊溫英文小測呀！📖❤️❤️」');
          }
        } else if (info.totalMin >= 1260 && info.totalMin < 1440) {
          if (promises.practice === true) {
            promises.practice = 'done';
            pet.currentRoom = 'backyard'; pet.currentActivity = 'backyard'; targetX = 245; targetY = 435;
            bro.currentRoom = 'backyard'; bro.currentActivity = 'backyard'; bro.tx = 370; bro.ty = 435;
            viewRoomId = 'backyard';
            speakAndShow('「哥哥！照約定一齊嚟後院加練排球啦！🏐🔥」');
          } else if (promises.konbini === true) {
            promises.konbini = 'done';
            startDuoOuting('konbini', 10, 'konbini', '照今朝訊息約定，一齊去便利店買宵夜（10分鐘）🏪', '「哥哥！我哋照約定落便利店買熱辣辣肉包啦！🏪🥟」');
          } else if (promises.park === true) {
            promises.park = 'done';
            startDuoOuting('park', 30, 'park_breeze', '照今朝訊息約定，一齊去公園散步吹海風（30分鐘）🌳', '「哥哥！我哋照約定去海濱公園吹海風啦！🌳🌊」');
          }
        }
      }

      saveState();
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const p = JSON.parse(raw);
          state = {
            ...state, ...p,
            balance: { ...state.balance, ...(p.balance || {}) },

    function drawRealisticBlanket(bx, by, bw, bh, mainCol, shadeCol, cuffCol) {
      ctx.save();

      ctx.quadraticCurveTo(bx - 4, by + bh * 0.45, bx + 12, by + 10);
      ctx.closePath();
      const grad = ctx.createLinearGradient(bx, by, bx, by + bh);
      grad.addColorStop(0, mainCol);
      grad.addColorStop(1, shadeCol);
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = '#1e293b';
      ctx.stroke();

      // Turned-down top duvet collar cuff
      ctx.beginPath();
      ctx.moveTo(bx + 10, by + 11);

      ctx.fillStyle = cuffCol;
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#334155';
      ctx.stroke();

    let frameCount = 0;
    function endRally(msg, pet) {
      rally.active = false;
      document.getElementById('mg-hud').classList.add('hidden');
      const capped = grantCappedRewards(pet, Math.min(20, rally.score * 3 + 3), Math.min(24, rally.score * 4 + 2));
      pet.mood = Math.min(100, pet.mood + 10);
      playSFX('miss');
      speakAndShow(`${msg} 總共對打咗 ${rally.score} 回合！${capped ? '（今日上限已滿 🔒）' : ''}`);
      updateHUD(); saveState();
    }

    function updateRally(pet) {
      if (!rally.active) return;
      rally.bx += rally.bvx; rally.by += rally.bvy; rally.bvy += 0.24;
      if (rally.bx < 40 || rally.bx > 560) rally.bvx *= -1;
      if (rally.by < 55) { rally.by = 55; rally.bvy = Math.abs(rally.bvy); }

      if (rally.turn === 'hinata') {
        targetX = Math.max(80, Math.min(520, rally.bx)); targetY = 435;
        petX += (targetX - petX) * 0.14;
        if (rally.bvy > 0 && Math.hypot(rally.bx - petX, rally.by - (petY - 20)) < 58) {
          if (Math.random() < 0.15) { endRally('「嗚哇！翔陽飛撲都差少少接到個波！💦」', pet); return; }
          rally.score++;
          document.getElementById('mg-score').textContent = rally.score;
          document.getElementById('mg-turn').textContent = '輪到你接波！(點擊排球)';
          rally.turn = 'user'; rally.bvy = -10.5; rally.bvx = (Math.random() - 0.5) * 6;
          playSFX('bounce'); particles.push({ x: petX, y: petY - 80, text: '接得好! 🏐', color: '#facc15', life: 24 });
        } else if (rally.by > 530) {
          endRally('「哎呀！翔陽趕唔切接到個波！😅」', pet);
        }
      } else if (rally.by > 535) {
        endRally('「哥哥跌波啦！下次反應再快少少！😆」', pet);
      }
    }

    function updateAI() {
      const char = getActiveChar(), pet = ensurePetState(char.id);
      const now = Date.now(), idleSec = (now - lastInteractAt) / 1000;
      syncScheduleActivity(pet, true);

      if (transitionState) {
        if (transitionState.phase === 'out') {
          const ex = transitionState.ex ?? 540, ey = transitionState.ey ?? 440;
          petX += (ex - petX) * 0.09; petY += (ey - petY) * 0.09;
          transitionState.alpha = Math.max(0, transitionState.alpha - 0.045);
          if (transitionState.alpha <= 0.05) {
            pet.currentRoom = transitionState.targetRoom; pet.currentActivity = transitionState.targetActivity;
            petX = transitionState.ix ?? 60; petY = transitionState.iy ?? 440;
            targetX = transitionState.tx; targetY = transitionState.ty;
            transitionState.phase = 'in'; updateHUD();
          }
        } else if (transitionState.phase === 'in') {
          petX += (targetX - petX) * 0.08; petY += (targetY - petY) * 0.08;
          transitionState.alpha = Math.min(1, transitionState.alpha + 0.05);
          if (transitionState.alpha >= 0.98) {
            transitionState = null;
            const pool = char.dialogues[pet.currentActivity] || char.dialogues.tea;
            if (viewRoomId === pet.currentRoom) speakAndShow(pickLine(pool));
            saveState();
          }
        }
        return;
      }

      if (pet.currentActivity === 'waking' && idleSec > 10) {
        pet.currentActivity = 'sleep';
        if (viewRoomId === pet.currentRoom) speakAndShow(char.dialogues.backToSleep[0]);
        updateHUD();
      }

      if (state.brother && pet.currentRoom === state.brother.currentRoom && pet.currentRoom !== 'bath' && pet.currentActivity !== 'sleep' && pet.currentActivity !== 'waking') {
        const bro = state.brother;
        if (Math.abs(targetX - bro.tx) < 92) {
          const mid = Math.max(150, Math.min(450, (targetX + bro.tx) / 2));
          targetX = mid - 50;
          bro.tx = mid + 50;
        }
      }
      if (!pet.toiletState && (pet.currentRoom === 'park' || pet.currentRoom === 'park2') && (pet.currentActivity === 'park_walk' || pet.currentActivity === 'park_jog') && !transitionState && !duoWalk) {
        if (!window.__parkDir) window.__parkDir = -1;
        const spd = pet.currentActivity === 'park_jog' ? 1.25 : 0.55;
        petX += window.__parkDir * spd;
        petY = 445; targetX = petX; targetY = 445;
        if (state.brother && (state.brother.currentRoom === 'park' || state.brother.currentRoom === 'park2')) {
          state.brother.currentRoom = pet.currentRoom;
          state.brother.currentActivity = pet.currentActivity;
          state.brother.px = Math.max(85, Math.min(515, petX + 85));
          state.brother.py = 445; state.brother.tx = state.brother.px; state.brother.ty = 445;
        }
        if (pet.currentRoom === 'park' && petX <= 92 && window.__parkDir === -1) {
          pet.currentRoom = 'park2'; petX = 505; targetX = 505;
          if (state.brother) { state.brother.currentRoom = 'park2'; state.brother.px = 535; state.brother.tx = 535; }
          if (viewRoomId === 'park') viewRoomId = 'park2';
          updateHUD();
        } else if (pet.currentRoom === 'park2' && petX <= 115 && window.__parkDir === -1) {
          window.__parkDir = 1;
        } else if (pet.currentRoom === 'park2' && petX >= 505 && window.__parkDir === 1) {
          pet.currentRoom = 'park'; petX = 95; targetX = 95;
          if (state.brother) { state.brother.currentRoom = 'park'; state.brother.px = 145; state.brother.tx = 145; }
          if (viewRoomId === 'park2') viewRoomId = 'park';
          updateHUD();
        } else if (pet.currentRoom === 'park' && petX >= 490 && window.__parkDir === 1) {
          window.__parkDir = -1;
        }
      } else {
        if (!rally.active && pet.currentRoom !== 'bath' && pet.currentActivity !== 'sleep' && pet.currentActivity !== 'waking') {
          const dx = targetX - petX, dy = targetY - petY;
          if (Math.hypot(dx, dy) > 4) { petX += dx * 0.045; petY += dy * 0.045; }
        }
        if (state.brother) {
          const bro = state.brother;
          const bdx = bro.tx - bro.px, bdy = bro.ty - bro.py;
          if (Math.hypot(bdx, bdy) > 3) { bro.px += bdx * 0.05; bro.py += bdy * 0.05; }
        }
      }
      if (frameCount % 240 === 0) dreamIdx++;
    }

    function gameLoop() {
      frameCount++; updateAI();
      const char = getActiveChar(), pet = ensurePetState(char.id);
      const outfit = OUTFITS[pet.outfitIdx || 0] || OUTFITS[0];
      const timeInfo = getCurrentHourInfo();
      ctx.clearRect(0, 0, 600, 600);

      if (isZoomed) {
        drawLiveZoomedPortrait(pet, outfit, timeInfo, frameCount);
      } else {
        drawAnimeRoomBackground(viewRoomId, timeInfo);
        drawBrotherChibi(frameCount);
        if (pet.currentRoom === viewRoomId) drawArticulatedChibi(char, outfit, pet, frameCount);
        drawAnimeRoomForeground(viewRoomId, frameCount, pet);

        if (rally.active) {
          updateRally(pet);
          if (rally.turn === 'user') {
            ctx.strokeStyle = 'rgba(250, 204, 21, 0.85)'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.arc(rally.bx, rally.by, 42, 0, Math.PI * 2); ctx.stroke();
          }
          ctx.font = '52px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('🏐', rally.bx, rally.by + 16);
        } else if (pet.currentRoom === viewRoomId && (pet.currentRoom === 'school_court' || pet.currentRoom === 'backyard')) {
          const by = 270 - Math.abs(Math.sin(frameCount * 0.14)) * 75;
          ctx.font = '44px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('🏐', petX + 65, by);
        }
      }

      if (flyingFood) {
        flyingFood.x += (flyingFood.targetX - flyingFood.x) * 0.18;
        flyingFood.y += (flyingFood.targetY - flyingFood.y) * 0.18;
        ctx.font = '44px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(flyingFood.emoji, flyingFood.x, flyingFood.y);
        if (Math.hypot(flyingFood.targetX - flyingFood.x, flyingFood.targetY - flyingFood.y) < 12) { completeFeed(flyingFood.food); flyingFood = null; }
      }

      if (isPetting) {
        ctx.save(); ctx.translate(handPos.x, handPos.y + Math.sin(frameCount * 0.3) * 8);
        ctx.font = '54px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('🫳', 0, 12); ctx.restore();
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i]; pt.y -= 1.6; pt.life--;
        ctx.fillStyle = pt.color; ctx.font = 'bold 26px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(pt.text, pt.x, pt.y);
        if (pt.life <= 0) particles.splice(i, 1);
      }
      requestAnimationFrame(gameLoop);
    }

    function grantCappedRewards(pet, expAmt, coinAmt) {
      let cappedNow = false;
      if (expAmt > 0) {
        const allowExp = Math.min(expAmt, Math.max(0, DAILY_EXP_CAP - pet.dailyExpGained));
        if (allowExp > 0) {
          pet.dailyExpGained += allowExp; pet.bondExp += allowExp;
          const lStep = Math.max(1, (state.balance && state.balance.levelRewardStep) ?? 5);
          const lCoins = Math.max(0, (state.balance && state.balance.levelRewardCoins) ?? 100);
          while (pet.bondExp >= 100) {
            pet.bondExp -= 100; pet.bondLevel += 1; playSFX('levelup');
            if (pet.bondLevel % lStep === 0 && lCoins > 0) {
              const hPocket = Math.floor(lCoins / 2);
              pet.coins += lCoins;
              pet.pocketMoney = (pet.pocketMoney || 0) + hPocket;
              showToast(`🎉 翔陽升到 Lv.${pet.bondLevel}！哥哥 🪙+${lCoins}、翔陽零用錢 💵+${hPocket}！`);
            } else {
              showToast(`好感度升到 Lv.${pet.bondLevel}！💖`);
            }
          }
        } else cappedNow = true;
      }
      if (false && coinAmt > 0) {
        const allowCoins = Math.min(coinAmt, Math.max(0, DAILY_COINS_CAP - pet.dailyCoinsGained));
        if (allowCoins > 0) { pet.dailyCoinsGained += allowCoins; pet.coins += allowCoins; }
        else cappedNow = true;
      }
      return cappedNow;
    }

    function getCanvasCoords(clientX, clientY) {
      const r = canvas.getBoundingClientRect();
      return { x: ((clientX - r.left) / r.width) * 600, y: ((clientY - r.top) / r.height) * 600 };
    }
    function pickLine(a) { return a[Math.floor(Math.random() * a.length)]; }
    function showToast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.remove('hidden'); setTimeout(() => t.classList.add('hidden'), 2400); }

    function isTouchingHinata(cx, cy) {
      if (isZoomed) return Math.hypot(cx - 300, cy - 300) <= 230;
      return Math.hypot(cx - petX, cy - (petY - 12)) <= 85;
    }

    function triggerPetHead(cx, cy) {
      const char = getActiveChar(), pet = ensurePetState(char.id);
      if (!isZoomed && pet.currentRoom !== viewRoomId) return;
      if (!isTouchingHinata(cx, cy)) { isPetting = false; return; }
      lastInteractAt = Date.now();
      if (pet.currentActivity === 'sleep') { showSleepLockedMsg(); return; }
      isPetting = true; handPos = { x: cx, y: cy }; petTickAcc++;
      if (petTickAcc % 8 === 1) {
        playSFX('pat');
        const isCapped = grantCappedRewards(pet, 3, 0);
        const pWin = Math.max(10, (state.balance && state.balance.petWindowMins) ?? 60);
        const pMax = Math.max(0, (state.balance && state.balance.petMaxMood) ?? 20);
        const hKey = String(Math.floor(Date.now() / (pWin * 60000)));
        if (pet.petHourKey !== hKey) { pet.petHourKey = hKey; pet.petHourMoodGained = 0; }
        const allowMood = Math.min(3, Math.max(0, pMax - (pet.petHourMoodGained || 0)));
        pet.petHourMoodGained = (pet.petHourMoodGained || 0) + allowMood;
        pet.mood = Math.min(100, pet.mood + allowMood);
        particles.push({ x: cx + (Math.random() * 34 - 17), y: cy - 20, text: '💖', color: '#f43f5e', life: 36 });
        if (petTickAcc % 24 === 1) speakAndShow(isCapped && Math.random() < 0.35 ? char.dialogues.capped[0] : pickLine(char.dialogues.pet));
        updateHUD(); saveState();
      }
    }

    function completeFeed(food) {
      const pet = ensurePetState(state.activeCharId);
      if (pet.recoverStage === 'infirmary' || pet.recoverStage === 'hospital') {
        showToast('醫護室休養緊，等回復 10% 先返屋企食白粥！🩺');
        return;
      }
      const nowMs = Date.now();
      pet.feedTimestamps = (pet.feedTimestamps || []).filter(ts => nowMs - ts < 8 * 3600 * 1000);
      if (!pet.fainted && (pet.hunger >= 100 || pet.feedTimestamps.length >= 3)) {
        playSFX('miss');
        speakAndShow('「已經飽飽❤️」');
        showToast(pet.hunger >= 100 ? '翔陽已經飽飽❤️' : '8 小時內已經餵咗 3 次，已經飽飽❤️');
        return;
      }
      if (pet.fainted) {
        pet.fainted = false;
        pet.currentActivity = 'happy';
        pet.hunger = Math.max(15, pet.hunger);
        pet.energy = Math.max(15, pet.energy);
        showToast('餵食成功！翔陽醒返啦！✨');
      }
      pet.feedTimestamps.push(nowMs);
      if (pet.coins < food.cost) { showToast('金幣唔夠！玩「🏐 雙人對打」或「✊ 包剪揼」賺金幣'); return; }
      pet.coins -= food.cost;
      pet.hunger = Math.min(100, pet.hunger + (food.hunger || 0));
      pet.mood = Math.min(100, pet.mood + (food.mood || 0));
      pet.energy = Math.min(100, pet.energy + (food.energy || 0));
      addBladderFromConsume(pet, /果汁|飲品|汽水|茶|奶|水/.test(food.name || ''));
      grantCappedRewards(pet, food.bond || 6, 0);
      tempOverrideMode = 'happy'; setTimeout(() => { tempOverrideMode = null; }, 1600);
      playSFX('eat'); speakAndShow(food.line);
      particles.push({ x: 300, y: 240, text: '好味! ✨', color: '#f59e0b', life: 36 });
      updateHUD(); saveState();
    }

    function getEasterSunday(year) {
      const a = year % 19, b = Math.floor(year / 100), c = year % 100;
      const d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
      const g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
      const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7;
      const m = Math.floor((a + 11 * h + 22 * l) / 451);
      const month = Math.floor((h + l - 7 * m + 114) / 31);
      const day = ((h + l - 7 * m + 114) % 31) + 1;
      return new Date(year, month - 1, day);
    }
    function getLunarInfo(dateObj) {
      try {
        const parts = new Intl.DateTimeFormat('en-u-ca-chinese', { month: 'numeric', day: 'numeric' }).formatToParts(dateObj);
        let m = 0, d = 0;
        for (const p of parts) {
          if (p.type === 'month') m = parseInt(p.value, 10);
          if (p.type === 'day') d = parseInt(p.value, 10);
        }
        return { m, d };
      } catch (e) { return { m: 0, d: 0 }; }
    }
    const _hkHolidayCache = {};
    function getHKHolidaysForYear(year) {
      if (_hkHolidayCache[year]) return _hkHolidayCache[year];
      const map = {};
      const fmt = (dt) => `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
      const addH = (dt, name) => { map[fmt(dt)] = name; };
      const addSolarSubst = (month, day, name) => {
        const dt = new Date(year, month - 1, day);
        if (dt.getDay() === 0) dt.setDate(dt.getDate() + 1);
        addH(dt, name);
      };
      addSolarSubst(1, 1, '元旦');
      addSolarSubst(5, 1, '勞動節');
      addSolarSubst(7, 1, '香港特區成立紀念日');
      addSolarSubst(10, 1, '國慶日');
      // Ching Ming (Apr 4 or Apr 5)
      const qmDay = (year % 4 === 0 && year >= 2008) ? 4 : 5;
      addSolarSubst(4, qmDay, '清明節');
      // Easter (Good Friday, Sat, Easter Monday)
      const eas = getEasterSunday(year);
      const gf = new Date(eas); gf.setDate(eas.getDate() - 2); addH(gf, '耶穌受難節');
      const gs = new Date(eas); gs.setDate(eas.getDate() - 1); addH(gs, '耶穌受難節翌日');
      const em = new Date(eas); em.setDate(eas.getDate() + 1); addH(em, '復活節星期一');
      // Christmas & Boxing Day
      const xmas = new Date(year, 11, 25);
      if (xmas.getDay() === 0) { addH(new Date(year, 11, 26), '聖誕節後第一個週日'); addH(new Date(year, 11, 27), '聖誕節補假'); }
      else if (xmas.getDay() === 6) { addH(xmas, '聖誕節'); addH(new Date(year, 11, 28), '聖誕節後第一個週日補假'); }
      else if (xmas.getDay() === 5) { addH(xmas, '聖誕節'); addH(new Date(year, 11, 26), '聖誕節後第一個週日'); }
      else { addH(xmas, '聖誕節'); addH(new Date(year, 11, 26), '聖誕節後第一個週日'); }

      // Scan entire year for Lunar holidays (CNY 1/1-1/3, Buddha 4/8, Tuen Ng 5/5, Mid-Autumn 8/16, Chung Yeung 9/9)
      for (let m = 0; m < 12; m++) {
        const daysInM = new Date(year, m + 1, 0).getDate();
        for (let d = 1; d <= daysInM; d++) {
          const dt = new Date(year, m, d);
          const lu = getLunarInfo(dt);
          if (lu.m === 1 && lu.d === 1) {
            for (let k = 0; k < 3; k++) {
              const cdt = new Date(year, m, d + k);
              if (cdt.getDay() === 0) { const nx = new Date(year, m, d + 3); addH(nx, '農曆新年補假'); }
              else addH(cdt, `農曆年初${['一','二','三'][k]}`);
            }
          } else if (lu.m === 4 && lu.d === 8) addSolarSubst(m + 1, d, '佛誕');
          else if (lu.m === 5 && lu.d === 5) addSolarSubst(m + 1, d, '端午節');
          else if (lu.m === 8 && lu.d === 16) addSolarSubst(m + 1, d, '中秋節翌日');
          else if (lu.m === 9 && lu.d === 9) addSolarSubst(m + 1, d, '重陽節');
        }
      }
      _hkHolidayCache[year] = map;
      return map;
    }
    function isDateSelectableHolidayOrWeekend(dateStr) {
      const [y, m, d] = dateStr.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      const day = dt.getDay();
      const hols = getHKHolidaysForYear(y);
      if (day === 0 || day === 6) return { ok: true, tag: day === 6 ? '星期六' : '星期日', isRed: day === 0 };
      if (hols[dateStr]) return { ok: true, tag: hols[dateStr], isRed: true };
      if (state.holidayDate === dateStr) return { ok: true, tag: '二人假期', isRed: true };
      return { ok: false, tag: '', isRed: false };
    }

          if (sp) sp.textContent = `${nv}級`;
        } else {
          const nv = Math.max(0, (state.balance.levelRewardCoins ?? 100) + Number(lvlDelta));
          state.balance.levelRewardCoins = nv;
          const sp = document.getElementById('lvl-val-coins');
          if (sp) sp.textContent = `${nv}/${Math.floor(nv/2)}`;
        }
        saveState(); return;
      }
      const durBtn = e.target.closest('[data-dur-key]');
      if (durBtn) {
        const { durKey, durDelta } = durBtn.dataset;
        const nv = Math.max(5, (state.outingMins[durKey] || 30) + Number(durDelta));
        state.outingMins[durKey] = nv;
        const sp = document.getElementById(`dur-val-${durKey}`);
        if (sp) sp.textContent = `${nv}分`;
        saveState(); return;
      }
      const aeBtn = e.target.closest('[data-ae-key]');
      if (aeBtn) {
        const { aeKey, aeField, aeDelta } = aeBtn.dataset;
        const obj = state.autoEvents[aeKey];
        if (aeField === 'prob') {
          obj.prob = Math.max(0, Math.min(100, (obj.prob ?? 10) + Number(aeDelta)));
          const sp = document.getElementById(`ae-val-${aeKey}-prob`);
          if (sp) sp.textContent = `${obj.prob}%`;
        } else if (aeField === 'mins') {
          const minV = aeKey === 'freeRoam' ? 1 : 5;
          obj.mins = Math.max(minV, Math.min(120, (obj.mins ?? 15) + Number(aeDelta)));
          const sp = document.getElementById(`ae-val-${aeKey}-mins`);
          if (sp) sp.textContent = `${obj.mins}分`;
        } else {
          obj.maxPerDay = Math.max(0, Math.min(20, (obj.maxPerDay ?? 1) + Number(aeDelta)));
          const sp = document.getElementById(`ae-val-${aeKey}-maxPerDay`);
          if (sp) sp.textContent = (aeKey === 'toilet' || aeKey === 'backyardAsk') ? (obj.maxPerDay === 0 ? '不限' : `${obj.maxPerDay}次`) : (obj.maxPerDay === 0 ? '停用' : `${obj.maxPerDay}${aeKey === 'snackBuy' ? '件' : '次'}`);
        }
        saveState(); return;
      }
    });
    document.getElementById('btn-mailbox').addEventListener('click', openMailboxModal);
    document.getElementById('snack-bag-display').addEventListener('click', openSnackBagModal);
    document.getElementById('btn-holiday').addEventListener('click', () => {
      const tom = getTomorrowStr();
      if (state.holidayDate === tom) {
        state.holidayDate = null;
        showToast('已取消明日二人假期預約');
      } else {
        state.holidayDate = tom;
        playSFX('levelup');
        showToast('已設定聽日為二人假期！聽日 10:00 起身一齊玩 🏖️');
        speakAndShow('「哥哥設定咗聽日放假呀？！聽日可以同哥哥成日一齊玩啦！🏖️✨」');
      }
      updateHUD(); saveState();
    });
    document.getElementById('close-schedule').addEventListener('click', () => document.getElementById('schedule-modal').classList.add('hidden'));
    if (false) document.getElementById('btn-schedule').addEventListener('x', () => {
      document.getElementById('char-list').innerHTML = Object.values(getAllCharacters()).map(c => {
        const pet = ensurePetState(c.id), active = c.id === state.activeCharId;
        return `<div class="flex items-center justify-between p-2.5 rounded-2xl border-2 border-[#2d1e12] ${active ? 'bg-orange-100' : 'bg-white'}">
          <div class="flex items-center gap-2.5"><div class="w-9 h-9 rounded-full border-2 border-[#2d1e12] flex items-center justify-center text-white font-black text-xs" style="background:${c.hairColor}">${c.name[0]}</div>
          <div><div class="text-sm font-black">${c.name}</div><div class="text-[10px] text-slate-600">${c.subtitle} · Lv.${pet.bondLevel}</div></div></div>
          <button type="button" data-pick-char="${c.id}" class="px-3 py-1 rounded-xl text-xs font-bold border-2 border-[#2d1e12] ${active ? 'bg-slate-200' : 'bg-orange-500 text-white'}">${active ? '養成中' : '切換'}</button></div>`;
      }).join('');
      document.getElementById('char-modal').classList.remove('hidden');
    });
    document.getElementById('btn-close-modal').addEventListener('click', () => document.getElementById('char-modal').classList.add('hidden'));
    document.getElementById('char-list').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-pick-char]'); if (!btn) return;
      state.activeCharId = btn.dataset.pickChar; syncScheduleActivity(ensurePetState(state.activeCharId), false);
      renderDock(); updateHUD(); saveState(); document.getElementById('char-modal').classList.add('hidden');
    });
    document.getElementById('add-char-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('new-name').value.trim(); if (!name) return;
      const id = 'custom_' + Date.now(), quote = document.getElementById('new-quote').value.trim() || `「哥哥你好！我係 ${name}！」`;
      state.customCharacters[id] = {
        id, name, subtitle: document.getElementById('new-sub').value.trim() || '自訂動漫角色',
        hairColor: document.getElementById('new-hair').value, eyeColor: document.getElementById('new-eye').value,
        foods: DEFAULT_CHARACTERS.hinata.foods,
        dialogues: { sleep: ['「Zzz…」'], brush: [quote], breakfast: [quote], tea: [quote], tv: [quote], fridge: [quote], cook: [quote], hallway: [quote], gaming: [quote], homework: [quote], bath: [quote], backyard: [quote], street: [quote], school_class: [quote], lunch: [quote], school_court: [quote], pet: ['「哥哥摸頭好舒服呀！」'], waking: ['「唔…哥哥發生咩事？」'], backToSleep: ['「哥哥晚安…Zzz」'], leaving: ['「夠鐘做下一個行程喇～」'], capped: ['「今日上限已滿！」'] }
      };
      state.activeCharId = id; ensurePetState(id); speakAndShow(quote); renderDock(); updateHUD(); saveState();
      document.getElementById('add-char-form').reset(); document.getElementById('char-modal').classList.add('hidden');
    });
    if (false) document.getElementById('btn-schedule').addEventListener('x2', () => {
      const char = getActiveChar();
      state.pets[char.id] = { hunger: 80, mood: 85, energy: 90, bondExp: 15, bondLevel: 1, coins: 50, outfitIdx: 0, currentRoom: 'room_hinata', currentActivity: 'sleep', scheduleSlotKey: '', dailyDate: getTodayStr(), dailyExpGained: 0, dailyCoinsGained: 0, lastUpdated: Date.now() };
      syncScheduleActivity(state.pets[char.id], false);
      viewRoomId = state.pets[char.id].currentRoom;
      updateHUD(); saveState(); showToast(`已重置 ${char.name} 嘅進度`);
    });

    // 每 3 秒即時結算一次精力／飽食／心情變化
    setInterval(() => {
      const pet = ensurePetState(state.activeCharId);
      applyTimeStatsDelta(pet, 3000);
      updateHUD(); saveState();
    }, 3000);

    window.addEventListener('error', (ev) => {
      try { showToast('JS Error: ' + (ev.message || ev.error)); } catch (_) {}
    });
    function updateHeaderDateTime() {
      const el = document.getElementById('header-datetime');
      if (!el) return;
      const now = new Date();
      const days = ['日', '一', '二', '三', '四', '五', '六'];
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const hh = String(now.getHours()).padStart(2, '0');
      const mi = String(now.getMinutes()).padStart(2, '0');
      el.textContent = `${mm}/${dd} (${days[now.getDay()]}) ${hh}:${mi}`;
    }
    updateHeaderDateTime();
    setInterval(updateHeaderDateTime, 10000);
    loadAssets();
    loadState();
    viewRoomId = ensurePetState(state.activeCharId).currentRoom;
    renderDock();
    updateHUD();
    gameLoop();
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    const firebaseConfig = {
      apiKey: "AIzaSyCqASayonPmiJSoku8s0oTrS12hv-0_P10",
      authDomain: "hinata-tamagotchi.firebaseapp.com",
      projectId: "hinata-tamagotchi",
      storageBucket: "hinata-tamagotchi.firebasestorage.app",
      messagingSenderId: "197709491427",
      appId: "1:197709491427:web:9af960329df8d5c327e9d6",
      measurementId: "G-FHFZJV1M8T"
    };
    try {
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const saveRef = doc(db, "hinata_saves", "main");
      let saveTimer = null;
      let applyingRemote = false;
      let initialCloudLoaded = false;
      const hadLocalOnBoot = !!localStorage.getItem('chibi_tama_nohara_v6');
      const flushCloudSave = async () => {
        if (applyingRemote || !initialCloudLoaded) return;
        try {
          const raw = localStorage.getItem('chibi_tama_nohara_v6');
          if (!raw) return;
          const parsed = JSON.parse(raw);
          await setDoc(saveRef, { payload: raw, updatedAt: parsed.savedAt || Date.now() }, { merge: true });
          const el = document.getElementById('save-status');
          if (el) el.textContent = '☁️ 雲端已同步 · v58';
        } catch (e) {}
      };
      window.__cloudSave = () => {
        if (applyingRemote || !initialCloudLoaded) return;
        clearTimeout(saveTimer);
        saveTimer = setTimeout(flushCloudSave, 250);
      };
      window.addEventListener('pagehide', flushCloudSave);
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushCloudSave(); });
      onSnapshot(saveRef, (snap) => {
        const firstSync = !initialCloudLoaded;
        initialCloudLoaded = true;
        if (!snap.exists()) { flushCloudSave(); return; }
        const data = snap.data();
        if (!data || !data.payload) { flushCloudSave(); return; }
        const cur = localStorage.getItem('chibi_tama_nohara_v6');
        let localTs = 0, localLv = 1, remoteLv = 1, localExp = 15, localCoins = 50;
        try {
          if (cur) {
            const lp = JSON.parse(cur);
            localTs = lp.savedAt || 0;
            const lh = lp.pets && lp.pets.hinata;
            if (lh) { localLv = lh.bondLevel || 1; localExp = lh.bondExp || 0; localCoins = lh.coins ?? 50; }
          }
          const rp = JSON.parse(data.payload);
          const rh = rp.pets && rp.pets.hinata;
          if (rh) remoteLv = rh.bondLevel || 1;
        } catch (e) {}
        const remoteTs = data.updatedAt || 0;
        const isFreshDefaultBoot = !hadLocalOnBoot && localLv === 1 && localExp <= 15 && localCoins === 50;
        const shouldApplyRemote = (firstSync && isFreshDefaultBoot) || (remoteTs > localTs && remoteLv >= localLv && cur !== data.payload) || (remoteLv > localLv);
        if (shouldApplyRemote) {
          applyingRemote = true;
          localStorage.setItem('chibi_tama_nohara_v6', data.payload);
          if (typeof loadState === 'function') loadState();
          if (typeof renderDock === 'function') renderDock();
          if (typeof updateHUD === 'function') updateHUD();
          const el = document.getElementById('save-status');
          if (el) el.textContent = '☁️ 已載入雲端進度 · v58';
          setTimeout(() => { applyingRemote = false; }, 350);
        } else if (localTs > remoteTs) {
          flushCloudSave();
        }
      });
    } catch (e) {}
  </script>
