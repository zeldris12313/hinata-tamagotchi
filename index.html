<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="icon" type="image/png" href="./icon.png?v=69">
  <link rel="apple-touch-icon" href="./icon.png?v=69">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Q版動漫電子雞｜日向翔陽生活養成記</title>
  <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <script src="https://cdn.tailwindcss.com/3.4.17" defer></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    input, textarea { user-select: text; -webkit-user-select: text; -webkit-touch-callout: default; }
html, body {
      overscroll-behavior: none;
      overflow: hidden;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      touch-action: manipulation;
      -webkit-overflow-scrolling: auto;
    }
    body {
      font-family: 'Noto Sans TC', 'Inter', sans-serif;
      background: radial-gradient(circle at top, #fff1e6 0%, #ffd8be 55%, #ffc49b 100%);
      min-height: 100vh;
      margin: 0;
      color: #2d1e12;
      overflow-x: hidden;
    }
    .tama-shell {
      background: linear-gradient(165deg, #ff8533 0%, #ff6314 52%, #e64900 100%);
      box-shadow: 0 24px 50px rgba(217, 72, 15, 0.35), inset 0 6px 14px rgba(255, 255, 255, 0.5), inset 0 -10px 20px rgba(124, 35, 0, 0.35);
      border: 5px solid #fff7f0;
    }
    .hd-canvas { touch-action: none; }
    .ui-card { border: 2.5px solid #2d1e12; box-shadow: 0 4px 0 rgba(45, 30, 18, 0.85); }
    .dock-chip, .ctrl-pill { border: 2px solid #2d1e12; box-shadow: 0 3px 0 rgba(45, 30, 18, 0.85); touch-action: none; transition: transform 0.1s ease, opacity 0.15s ease; }
    .dock-chip:active, .ctrl-pill:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(45, 30, 18, 0.85); }
    .ctrl-pill.is-pressed { transform: translateY(2px); box-shadow: inset 0 2px 5px rgba(45,30,18,0.38) !important; background: #fed7aa !important; border-color: #c2410c !important; }
    #btn-find-bro.is-pressed { background: #bae6fd !important; border-color: #0369a1 !important; }
    .inscreen-dir {
      border: 2px solid rgba(45, 30, 18, 0.85);
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.25);
      transition: transform 0.1s ease, opacity 0.15s ease;
    }
    .inscreen-dir:active:not(:disabled) { transform: scale(0.9); }
    .inscreen-dir:disabled { opacity: 0.22; pointer-events: none; }
    #drag-ghost { position: fixed; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%) scale(1.25); font-size: 30px; }
    #boot-splash { position: fixed; inset: 0; z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at top, #fff1e6 0%, #ffd8be 55%, #ffc49b 100%); transition: opacity 0.22s ease; }
    #boot-splash.is-done { opacity: 0; pointer-events: none; }
    .boot-badge { background: linear-gradient(165deg, #ff8533 0%, #ff6314 55%, #e64900 100%); border: 4px solid #fff7f0; border-radius: 28px; padding: 18px 28px; color: #fff; font-weight: 900; font-size: 16px; box-shadow: 0 18px 40px rgba(217,72,15,0.28); display: flex; align-items: center; gap: 10px; }
    .boot-ball { display: inline-block; animation: bootBounce 0.7s ease-in-out infinite alternate; font-size: 24px; }
    @keyframes bootBounce { from { transform: translateY(0); } to { transform: translateY(-7px); } }
    html:not(.tw-ready) .tama-shell { opacity: 0; }
    html.tw-ready .tama-shell { opacity: 1; transition: opacity 0.18s ease; }
  </style>
</head>
<body class="flex flex-col items-center justify-center p-3 sm:p-5">
  <div id="boot-splash"><div class="boot-badge"><span class="boot-ball">🏐</span><span>日向翔陽載入中…</span></div></div>

  <div class="tama-shell w-full max-w-md rounded-[3rem] p-4 sm:p-5 relative">

    <!-- Top Bezel -->
    <div class="flex items-center justify-between mb-2 px-1.5 text-white">
      <div class="flex items-center gap-2">
        <span class="w-8 h-8 rounded-full bg-white/25 flex items-center justify-center text-base border-2 border-white/50">🏐</span>
        <div>
          <div class="flex items-center gap-1.5 flex-wrap"><h1 id="header-title" class="text-base sm:text-lg font-black tracking-wide leading-tight">日向翔陽</h1><span id="header-datetime" class="text-[10px] font-bold bg-white/25 px-2 py-0.5 rounded-full border border-white/40 whitespace-nowrap"></span></div>
          <p id="header-sub" class="text-[11px] text-orange-100">烏野 #10 · 現實時間同步</p>
        </div>
      </div>
      <div class="grid grid-cols-2 gap-1 shrink-0">
        <button id="btn-sound" type="button" class="whitespace-nowrap px-2 py-0.5 rounded-full bg-white/90 hover:bg-white text-[#2d1e12] border-2 border-[#2d1e12] flex items-center justify-center text-[10px] font-bold shadow-sm transition">🔊</button>
        <button id="btn-settings" type="button" class="whitespace-nowrap px-2 py-0.5 rounded-full bg-white text-[#2d1e12] font-bold text-[10px] border-2 border-[#2d1e12] shadow-sm hover:bg-amber-50 transition">⚙️ 數值</button>
        <button id="btn-holiday" type="button" class="whitespace-nowrap px-2 py-0.5 rounded-full bg-white text-emerald-700 font-bold text-[10px] border-2 border-[#2d1e12] shadow-sm hover:bg-emerald-50 transition">🏖️ 設明日假期</button>
        <button id="btn-schedule" type="button" class="whitespace-nowrap px-2 py-0.5 rounded-full bg-white text-orange-600 font-bold text-[10px] border-2 border-[#2d1e12] shadow-sm hover:bg-orange-50 transition">📅 生活作息</button>
      </div>
    </div>

    <!-- Screen Frame -->
    <div class="bg-[#2d1e12] p-2.5 rounded-[1.75rem] shadow-inner">
      <!-- Top Mini HUD (現實時間已鎖定，不可手動調整) -->
      <div class="bg-[#fef3c7] border-b-2 border-[#2d1e12] rounded-t-2xl px-2.5 py-1.5 space-y-1 text-[11px] font-bold text-[#2d1e12]">
        <div class="flex items-center justify-between gap-1 whitespace-nowrap">
          <span id="time-display" class="bg-white/90 border border-[#2d1e12] px-1.5 py-0.5 rounded text-[10px] truncate max-w-[138px]">🔒 現實時間</span>
          <span id="room-title-badge" class="bg-orange-500 text-white px-2 py-0.5 rounded text-[10px] truncate max-w-[105px]">🏠 1F 客廳</span>
          <span class="text-[10px] shrink-0">💖Lv.<span id="bond-level">1</span> · <button id="btn-coins-log" type="button" class="font-black text-amber-800 hover:underline cursor-pointer">🪙<span id="coins-count">50</span></button></span>
        </div>
        <div class="flex items-center justify-between text-[10px] bg-white/80 rounded-lg px-2 py-0.5 border border-amber-300 whitespace-nowrap">
          <span id="daily-cap-exp">📈 今日EXP 0/100</span>
          <button id="btn-hud-dates" type="button" class="px-1.5 py-0.5 rounded bg-emerald-100 hover:bg-emerald-200 border border-emerald-500 text-emerald-900 font-black cursor-pointer">🗓️ 約會</button>
          <span id="daily-lock-badge" class="hidden text-rose-600 font-black">🔒 EXP已達上限</span>
          <button id="snack-bag-display" type="button" class="font-bold text-amber-800 hover:underline cursor-pointer">🎒 小食: 無</button>
          <button id="btn-wallet" type="button" class="font-black text-emerald-700 hover:underline cursor-pointer">👛 零錢 <span id="pocket-money">20</span></button>
        </div>
      </div>

      <!-- 600x600 HD Anime Room Canvas -->
      <div class="relative w-full aspect-square bg-sky-100 overflow-hidden">
        <canvas id="game-canvas" width="600" height="600" class="hd-canvas w-full h-full block cursor-pointer"></canvas>

        <!-- Top-Left Mailbox Button -->
        <button id="btn-mailbox" type="button" class="absolute top-2.5 left-2.5 bg-white/95 hover:bg-amber-50 border-2 border-[#2d1e12] rounded-xl px-2 py-1 text-base shadow-md z-30 flex items-center justify-center" title="信箱">
          <span>✉️</span>
          <span id="mailbox-badge" class="hidden -mt-3 -ml-1 bg-rose-600 text-white text-[10px] font-black w-4 h-4 rounded-full flex items-center justify-center border border-white">!</span>
        </button>

        <!-- Speech Bubble -->
        <div id="speech-bubble" class="pointer-events-none absolute top-9 left-1/2 -translate-x-1/2 w-[84%] bg-white/95 border-2 border-[#2d1e12] rounded-2xl px-3 py-1.5 text-center text-xs font-bold text-[#2d1e12] shadow-md leading-snug z-10">
          「哥哥你返嚟啦！今日一齊練排球！」
        </div>

        <!-- In-Screen 4-Way Navigation Arrows -->
        <button id="dir-up" type="button" class="inscreen-dir absolute top-1.5 left-1/2 -translate-x-1/2 bg-white/85 hover:bg-orange-100 text-[#2d1e12] rounded-full px-3 py-0.5 text-xs font-black z-20 flex items-center gap-1" title="向上">
          <span>▲</span><span id="lbl-up" class="text-[9px] hidden sm:inline"></span>
        </button>
        <button id="dir-down" type="button" class="inscreen-dir absolute bottom-1.5 left-1/2 -translate-x-1/2 bg-white/85 hover:bg-orange-100 text-[#2d1e12] rounded-full px-3 py-0.5 text-xs font-black z-20 flex items-center gap-1" title="向下">
          <span>▼</span><span id="lbl-down" class="text-[9px] hidden sm:inline"></span>
        </button>
        <button id="dir-left" type="button" class="inscreen-dir absolute left-1.5 top-1/2 -translate-y-1/2 bg-white/85 hover:bg-orange-100 text-[#2d1e12] rounded-full w-8 h-8 text-xs font-black z-20 flex items-center justify-center" title="向左">◀</button>
        <button id="dir-right" type="button" class="inscreen-dir absolute right-1.5 top-1/2 -translate-y-1/2 bg-white/85 hover:bg-orange-100 text-[#2d1e12] rounded-full w-8 h-8 text-xs font-black z-20 flex items-center justify-center" title="向右">▶</button>

        <!-- Supermarket 6 Interactive Zones + Basket -->
        <div id="supermarket-zones" class="hidden pointer-events-none absolute inset-0 z-15">
          <button type="button" data-sm-zone="sm_dry" style="left:15%;top:45%;transform:translate(-50%,-50%)" class="pointer-events-auto absolute px-2 py-1 rounded-xl bg-amber-100/95 hover:bg-amber-200 border-2 border-[#2d1e12] text-[10px] font-black shadow">🍞 乾糧部</button>
          <button type="button" data-sm-zone="sm_drink" style="left:56.7%;top:44.2%;transform:translate(-50%,-50%)" class="pointer-events-auto absolute px-2 py-1 rounded-xl bg-sky-100/95 hover:bg-sky-200 border-2 border-[#2d1e12] text-[10px] font-black shadow">🥤 飲品部</button>
          <button type="button" data-sm-zone="sm_freezer" style="left:85.8%;top:44.2%;transform:translate(-50%,-50%)" class="pointer-events-auto absolute px-2 py-1 rounded-xl bg-cyan-100/95 hover:bg-cyan-200 border-2 border-[#2d1e12] text-[10px] font-black shadow">🧊 雪櫃部</button>
          <button type="button" data-sm-zone="sm_tissue" style="left:15%;top:75.8%;transform:translate(-50%,-50%)" class="pointer-events-auto absolute px-2 py-1 rounded-xl bg-rose-100/95 hover:bg-rose-200 border-2 border-[#2d1e12] text-[10px] font-black shadow">🧻 紙巾部</button>
          <button type="button" data-sm-zone="sm_bath" style="left:40.8%;top:77.5%;transform:translate(-50%,-50%)" class="pointer-events-auto absolute px-2 py-1 rounded-xl bg-purple-100/95 hover:bg-purple-200 border-2 border-[#2d1e12] text-[10px] font-black shadow">🧴 沐浴用部</button>
          <button type="button" data-sm-zone="sm_checkout" style="left:83.3%;top:78.3%;transform:translate(-50%,-50%)" class="pointer-events-auto absolute px-2 py-1 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white border-2 border-[#2d1e12] text-[10px] font-black shadow">💳 自助收銀</button>
          <button id="btn-sm-basket" type="button" class="pointer-events-auto absolute top-2.5 right-2.5 px-2.5 py-1 rounded-xl bg-orange-500 hover:bg-orange-600 text-white border-2 border-[#2d1e12] text-[11px] font-black shadow">🧺 購物籃 (0)</button>
        </div>

        <!-- Visible Room Buttons: Kitchen Fridge / Toilet Cabinet / Bath Supplies -->
        <button id="btn-kitchen-fridge" type="button" style="left:16%;top:62%;transform:translate(-50%,-50%)" class="hidden absolute px-2 py-1 rounded-xl bg-cyan-100/95 hover:bg-cyan-200 border-2 border-[#2d1e12] text-[10px] font-black shadow z-15">🧊 雪櫃</button>
        <button id="btn-toilet-cabinet" type="button" class="hidden absolute top-10 right-2.5 px-2 py-1 rounded-xl bg-rose-100/95 hover:bg-rose-200 border-2 border-[#2d1e12] text-[10px] font-black shadow z-15">🧻 廁櫃</button>
        <button id="btn-bath-supplies" type="button" style="left:24%;top:66%;transform:translate(-50%,-50%)" class="hidden absolute px-2 py-1 rounded-xl bg-purple-100/95 hover:bg-purple-200 border-2 border-[#2d1e12] text-[10px] font-black shadow z-15">🧴 沐浴用品</button>
        <button id="btn-2f-to-1f" type="button" style="left:62%;top:44%;transform:translate(-50%,-50%)" class="hidden absolute px-2.5 py-1 rounded-xl bg-amber-100/95 hover:bg-amber-200 border-2 border-[#2d1e12] text-[10px] font-black shadow-md z-15">🪜 1F 玄關</button>
        <div id="main-street2-btns" class="hidden pointer-events-none absolute inset-0 z-15">
          <button type="button" data-door-room="pharmacy" style="left:55%;top:54%;transform:translate(-50%,-50%)" class="pointer-events-auto absolute px-2.5 py-1 rounded-xl bg-emerald-50/95 hover:bg-emerald-100 border-2 border-[#2d1e12] text-[10px] font-black shadow-md">🏥 醫院藥房</button>
          <button type="button" data-door-room="bus_interior" style="left:82%;top:56%;transform:translate(-50%,-50%)" class="pointer-events-auto absolute px-2.5 py-1 rounded-xl bg-sky-100/95 hover:bg-sky-200 border-2 border-[#2d1e12] text-[10px] font-black shadow-md">🚌 上巴士</button>
        </div>
        <div id="bus-interior-btns" class="hidden pointer-events-none absolute inset-0 z-15">
          <button type="button" data-door-room="main_street2" style="left:25%;top:82%;transform:translate(-50%,-50%)" class="pointer-events-auto absolute px-2.5 py-1 rounded-xl bg-amber-50/95 hover:bg-amber-100 border-2 border-[#2d1e12] text-[10px] font-black shadow-md">🏙️ 落車：大街2</button>
          <button type="button" data-door-room="theme_park_gate" style="left:75%;top:82%;transform:translate(-50%,-50%)" class="pointer-events-auto absolute px-2.5 py-1 rounded-xl bg-pink-100/95 hover:bg-pink-200 border-2 border-[#2d1e12] text-[10px] font-black shadow-md">🎡 落車：樂園門口</button>
        </div>
        <button id="btn-park-gate-bus" type="button" data-door-room="bus_interior" style="left:84%;top:58%;transform:translate(-50%,-50%)" class="hidden absolute px-2.5 py-1 rounded-xl bg-sky-100/95 hover:bg-sky-200 border-2 border-[#2d1e12] text-[10px] font-black shadow-md z-15">🚌 巴士站</button>
        <button id="btn-park-ent-enter" type="button" data-door-room="park" style="left:50%;top:56%;transform:translate(-50%,-50%)" class="hidden absolute px-3 py-1.5 rounded-xl bg-emerald-100/95 hover:bg-emerald-200 border-2 border-[#2d1e12] text-xs font-black shadow-md z-15">🌳 進入公園</button>
        <button id="btn-mall-gate-enter" type="button" data-door-room="mall" style="left:50%;top:56%;transform:translate(-50%,-50%)" class="hidden absolute px-3 py-1.5 rounded-xl bg-amber-100/95 hover:bg-amber-200 border-2 border-[#2d1e12] text-xs font-black shadow-md z-15">🛍️ 進入商場</button>
        <button id="btn-gate-class" type="button" style="left:50%;top:56%;transform:translate(-50%,-50%)" class="hidden absolute px-3 py-1.5 rounded-xl bg-amber-100/95 hover:bg-amber-200 border-2 border-[#2d1e12] text-xs font-black shadow-md z-15">🏫 課室</button>
        <button id="btn-hallway-living" type="button" style="left:36%;top:47%;transform:translate(-50%,-50%)" class="hidden absolute px-2 py-1 rounded-xl bg-amber-100/90 hover:bg-amber-200 border-2 border-[#2d1e12] text-[10px] font-black shadow-md z-15">🏠 客廳</button>
        <div id="hallway-2f-doors" class="hidden pointer-events-none absolute inset-0 z-15">
          <button type="button" data-door-room="room_hinata" title="進入翔陽房間" style="left:11%;top:48%;width:18%;height:62%;transform:translate(-50%,-50%)" class="pointer-events-auto absolute rounded-xl hover:bg-orange-400/15 active:bg-orange-400/25 transition"></button>
          <button type="button" data-door-room="room_aniki" title="進入哥哥房間" style="left:89%;top:48%;width:18%;height:62%;transform:translate(-50%,-50%)" class="pointer-events-auto absolute rounded-xl hover:bg-indigo-400/15 active:bg-indigo-400/25 transition"></button>
        </div>
        <div id="wash-hall-doors" class="hidden pointer-events-none absolute inset-0 z-15">
          <button type="button" data-door-room="toilet" style="left:25%;top:56%;transform:translate(-50%,-50%)" class="pointer-events-auto absolute px-2.5 py-1 rounded-xl bg-sky-50/90 hover:bg-sky-100 border-2 border-[#2d1e12] text-[11px] font-black shadow-md">🚽 廁所</button>
          <button type="button" data-door-room="bath" style="left:65%;top:56%;transform:translate(-50%,-50%)" class="pointer-events-auto absolute px-2.5 py-1 rounded-xl bg-purple-50/90 hover:bg-purple-100 border-2 border-[#2d1e12] text-[11px] font-black shadow-md">🛁 浴室</button>
        </div>

        <!-- Bottom-Left Depletion Alert -->
        <div id="depletion-alert" class="hidden absolute bottom-10 left-2.5 max-w-[235px] bg-rose-50/95 border-2 border-rose-600 rounded-2xl p-2 shadow-xl z-35 text-[11px] font-bold text-[#2d1e12]">
          <div id="depletion-alert-msg" class="leading-snug mb-1.5"></div>
          <button id="depletion-alert-ok" type="button" class="px-3 py-0.5 rounded-lg bg-rose-600 hover:bg-rose-700 text-white border border-[#2d1e12] text-[10px] font-black">確定</button>
        </div>

        <!-- Interactive Overlay (RPS / Chat / Jump Training) -->
        <div id="choice-overlay" style="touch-action: pan-y;" class="hidden absolute top-3 bottom-3 left-1/2 -translate-x-1/2 w-[94%] overflow-y-auto bg-white/95 border-2 border-[#2d1e12] rounded-2xl p-2 shadow-xl z-30 flex flex-col items-stretch justify-start gap-1"></div>

        <!-- Rally Mini-game Overlay -->
        <div id="mg-hud" class="hidden pointer-events-none absolute bottom-10 left-1/2 -translate-x-1/2 bg-[#2d1e12]/90 text-white text-xs font-bold px-3.5 py-1 rounded-full shadow z-20">
          🏐 雙人對打：<span id="mg-score">0</span> 回合 ｜ <span id="mg-turn">輪到你接波！</span>
        </div>
      </div>

      <!-- Stat Bars -->
      <div class="bg-[#fff7ed] border-t-2 border-[#2d1e12] rounded-b-2xl px-3 py-1.5 grid grid-cols-3 gap-x-2 gap-y-1.5 text-[11px] font-bold">
        <div id="stat-box-hunger" class="cursor-pointer rounded-lg hover:bg-amber-100/70 px-0.5 transition">
          <div class="flex justify-between mb-0.5"><span>🍙 飽食</span><span id="val-hunger">80%</span></div>
          <div class="border border-[#2d1e12] bg-white h-2.5 rounded-full overflow-hidden"><div id="bar-hunger" class="h-full bg-amber-500 transition-all duration-300" style="width:80%"></div></div>
        </div>
        <div id="stat-box-mood" class="cursor-pointer rounded-lg hover:bg-rose-100/70 px-0.5 transition">
          <div class="flex justify-between mb-0.5"><span>😊 心情</span><span id="val-mood">85%</span></div>
          <div class="border border-[#2d1e12] bg-white h-2.5 rounded-full overflow-hidden"><div id="bar-mood" class="h-full bg-rose-500 transition-all duration-300" style="width:85%"></div></div>
        </div>
        <div id="stat-box-energy" class="cursor-pointer rounded-lg hover:bg-emerald-100/70 px-0.5 transition">
          <div class="flex justify-between mb-0.5"><span>⚡ 精力</span><span id="val-energy">90%</span></div>
          <div class="border border-[#2d1e12] bg-white h-2.5 rounded-full overflow-hidden"><div id="bar-energy" class="h-full bg-emerald-500 transition-all duration-300" style="width:90%"></div></div>
        </div>
        <div id="stat-box-bladder" class="cursor-pointer rounded-lg hover:bg-sky-100/70 px-0.5 transition">
          <div class="flex justify-between mb-0.5"><span>🚽 尿意</span><span id="val-bladder">0%</span></div>
          <div class="border border-[#2d1e12] bg-white h-2.5 rounded-full overflow-hidden"><div id="bar-bladder" class="h-full bg-sky-400 transition-all duration-300" style="width:0%"></div></div>
        </div>
        <div></div>
        <div></div>
      </div>
    </div>

    <!-- Quick Controls -->
    <div class="mt-1.5 grid grid-cols-3 gap-1.5">
      <button id="btn-zoom" type="button" class="ctrl-pill bg-white hover:bg-orange-50 rounded-xl py-1 px-2 text-[11px] font-black flex items-center justify-center gap-1">
        <span id="zoom-icon">🔍</span><span id="zoom-label">放大特寫</span>

    let assetLoadFailed = false;
    const _loadingAssets = new Set();
    const _assetRetries = {};
    function ensureAsset(k) {
      if (!k || !ASSET_URLS[k] || sprites[k] || _loadingAssets.has(k)) return;
      _loadingAssets.add(k);
      const im = new Image();
      im.onload = () => { _loadingAssets.delete(k); sprites[k] = im; };
      im.onerror = () => {
        _loadingAssets.delete(k);
        _assetRetries[k] = (_assetRetries[k] || 0) + 1;
        if (_assetRetries[k] <= 2) {
          setTimeout(() => ensureAsset(k), 500 * _assetRetries[k]);
        } else {
          assetLoadFailed = true;
        }
      };
      im.src = ASSET_URLS[k];
    }
    function loadAssets() {
      const h = new Date().getHours();
      const tod = (h >= 18 || h < 6) ? '_night' : (h >= 6 && h < 10 ? '_morning' : '');
      const priorityKeys = [
        'chibiJersey', 'chibiSchool', 'chibiPajama', 'chibiBrother',
        'chibiCry', 'chibiJerseyCry', 'chibiSchoolCry',
        'chibiSquat', 'chibiSquatPajama', 'chibiHoodie', 'chibiCasual',
        'bg_living', 'bg_room_hinata', 'bg_hallway', 'bg_school_class'
      ];
      if (typeof viewRoomId === 'string' && viewRoomId) {
        priorityKeys.push('bg_' + viewRoomId);
        if (tod) priorityKeys.push('bg_' + viewRoomId + tod);
      }
      priorityKeys.forEach(ensureAsset);
      const rest = Object.keys(ASSET_URLS).filter(k => !priorityKeys.includes(k));
      let idx = 0;
      function loadBatch() {
        const end = Math.min(idx + 10, rest.length);
        for (; idx < end; idx++) ensureAsset(rest[idx]);
        if (idx < rest.length) setTimeout(loadBatch, 50);
      }
      setTimeout(loadBatch, 80);

      if (r.up === hop) return 'up';
      if (r.down === hop) return 'down';
      if (r.left === hop) return 'left';
      if (r.right === hop) return 'right';

        if (fromId === 'hallway_2f' && hop === 'room_hinata') return 'left';
        if (fromId === 'hallway_2f' && hop === 'room_aniki') return 'right';

        if (fromId === 'school_gate' && hop === 'school_class') return 'door_school_class';
        if (fromId === 'park_entrance' && hop === 'park') return 'door_park';
        if (fromId === 'mall_gate' && hop === 'mall') return 'door_mall';

        const dx = t.gx - r.gx, dy = t.gy - r.gy;
        if (Math.abs(dy) > Math.abs(dx)) return dy < 0 ? 'up' : 'down';

      while (q.length) {
        const path = q.shift();

      const eatIcons = { breakfast: '🍚', lunch: '🍱', dinner: '🍱', restaurant: '🍽️', supper_eat: '🥟', eating_ice_cream: '🍦', promenade_cafe: '🍮', rest_drinkbar: '🥤' };
      if (eatIcons[act] && !isWalking) {
        const chewY = Math.sin(frame * 0.22) * 3.5;
        ctx.font = '25px sans-serif';
        ctx.fillText(eatIcons[act], cx + 42, cy + 24 + chewY);
        if (act === 'restaurant') ctx.fillText('🍖', cx - 44, cy + 24 - chewY);
        if (frame % 48 < 18) { ctx.font = '16px sans-serif'; ctx.fillText('✨', cx + 52, cy - 12 - (frame % 18)); }
      }
      if (act === 'gaming' && !isWalking) { ctx.font = '24px sans-serif'; ctx.fillText('🎮', cx + 42, cy + 25); }
      ctx.restore();
      drawOverheadBadge(cx, cy - 28 + jumpY, isWalking ? 'idle' : act, frame);
    }

    // 放大特寫：使用當前房間動畫背景＋去背立繪，摸摸時直接切換成開心笑面立繪（唔再疊假紅暈）！
    function drawLiveZoomedPortrait(pet, outfit, timeInfo, frame) {
      drawAnimeRoomBackground(viewRoomId, timeInfo);
      ctx.fillStyle = 'rgba(255, 250, 240, 0.20)';
      ctx.fillRect(0, 0, 600, 600);

      const act = tempOverrideMode || pet.currentActivity;
      const isSleepingMode = (act === 'sleep' || act === 'waking' || (pet.toiletState && pet.toiletState.fromSleep));
      const isBathingMode = (pet.currentRoom === 'bath' && act === 'bath');
      let img;
      if (isSleepingMode) {
        img = sprites.portraitSleepy;
      } else if (isBathingMode) {
        img = (isPetting || act === 'happy') ? sprites.portraitBathHappy : sprites.portraitBath;
      } else if (isPetting || act === 'happy') {
        img = sprites[outfit.happyKey] || sprites[outfit.portraitKey];
      } else {
        img = sprites[outfit.portraitKey] || sprites.portraitJersey;
      }
      if (!img) return;

      const sway = isPetting ? Math.sin(frame * 0.16) * 0.022 : Math.sin(frame * 0.04) * 0.008;
      const breathScale = 1.0 + Math.sin(frame * 0.06) * 0.012 + (isPetting ? 0.02 : 0);
      ctx.save();
      ctx.translate(300, 315); ctx.rotate(sway); ctx.scale(breathScale, breathScale);
      ctx.drawImage(img, -300, -300, 600, 600);
      ctx.restore();

      if (act === 'sleep') {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.35)'; ctx.fillRect(0, 0, 600, 600);
        ctx.font = 'bold 42px sans-serif'; ctx.fillStyle = '#e0e7ff'; ctx.textAlign = 'center'; ctx.fillText('Zzz… 💭🏐', 470, 140);
      }
    }

    // =========================================================================
    // 5. 雙人接波對打 + 主迴圈
    // =========================================================================
    let frameCount = 0;
    function endRally(msg, pet) {
      rally.active = false;
      document.getElementById('mg-hud').classList.add('hidden');
      const capped = grantCappedRewards(pet, Math.min(20, rally.score * 3 + 3), Math.min(24, rally.score * 4 + 2));
      pet.mood = Math.min(100, pet.mood + 10);
      playSFX('miss');
      speakAndShow(`${msg} 總共對打咗 ${rally.score} 回合！${capped ? '（今日上限已滿 🔒）' : ''}`);
      updateHUD(); saveState();
    }

    function updateRally(pet) {
      if (!rally.active) return;
      rally.bx += rally.bvx; rally.by += rally.bvy; rally.bvy += 0.24;
      if (rally.bx < 40 || rally.bx > 560) rally.bvx *= -1;
      if (rally.by < 55) { rally.by = 55; rally.bvy = Math.abs(rally.bvy); }

      if (rally.turn === 'hinata') {
        targetX = Math.max(80, Math.min(520, rally.bx)); targetY = 435;
        petX += (targetX - petX) * 0.14;
        if (rally.bvy > 0 && Math.hypot(rally.bx - petX, rally.by - (petY - 20)) < 58) {
          if (Math.random() < 0.15) { endRally('「嗚哇！翔陽飛撲都差少少接到個波！💦」', pet); return; }
          rally.score++;
          document.getElementById('mg-score').textContent = rally.score;
          document.getElementById('mg-turn').textContent = '輪到你接波！(點擊排球)';
          rally.turn = 'user'; rally.bvy = -10.5; rally.bvx = (Math.random() - 0.5) * 6;
          playSFX('bounce'); particles.push({ x: petX, y: petY - 80, text: '接得好! 🏐', color: '#facc15', life: 24 });
        } else if (rally.by > 530) {
          endRally('「哎呀！翔陽趕唔切接到個波！😅」', pet);
        }
      } else if (rally.by > 535) {
        endRally('「哥哥跌波啦！下次反應再快少少！😆」', pet);
      }
    }

    function updateAI() {
      if (!Number.isFinite(petX) || !Number.isFinite(petY)) { petX = 300; petY = 440; }
      if (state.brother && (!Number.isFinite(state.brother.px) || !Number.isFinite(state.brother.py))) { state.brother.px = 360; state.brother.py = 440; }
      const char = getActiveChar(), pet = ensurePetState(char.id);
      const now = Date.now(), idleSec = (now - lastInteractAt) / 1000;
      syncScheduleActivity(pet, true);

      if (followTarget === 'hinata' && !isZoomed && viewRoomId !== pet.currentRoom) {
        viewRoomId = pet.currentRoom; updateHUD();
      } else if (followTarget === 'bro' && !isZoomed && state.brother && viewRoomId !== state.brother.currentRoom) {
        viewRoomId = state.brother.currentRoom; updateHUD();
      }

      if (transitionState) {
        if (transitionState.phase === 'out') {
          const ex = transitionState.ex ?? 540, ey = transitionState.ey ?? 440;
          petX += (ex - petX) * 0.09; petY += (ey - petY) * 0.09;
          transitionState.alpha = Math.max(0, transitionState.alpha - 0.045);
          if (transitionState.alpha <= 0.05) {
            pet.currentRoom = transitionState.targetRoom;
            if (followTarget === 'hinata' && !isZoomed) viewRoomId = pet.currentRoom;
            else if (transitionState.followView && viewRoomId === transitionState.fromRoom) viewRoomId = transitionState.targetRoom;
            petX = transitionState.ix ?? 60; petY = transitionState.iy ?? 440;
            if (transitionState.pathQueue && transitionState.pathQueue.length > 1) {
              transitionState.pathQueue.shift();
              const nextHop = transitionState.pathQueue[0];
              const nextDir = getRoomMoveDir(pet.currentRoom, nextHop);
              const nextEdge = getDirEdgeCoords(nextDir);
              pet.currentActivity = getWalkActForRoom(pet.currentRoom);
              targetX = nextEdge.ex; targetY = nextEdge.ey;
              transitionState.nextHop = nextHop;
              transitionState.nextEdge = nextEdge;
              transitionState.phase = 'pass';
              transitionState.startX = petX;
              transitionState.startY = petY;
              transitionState.passStartAt = Date.now();
              transitionState.passUntil = transitionState.passStartAt + 5000;
              transitionState.alpha = 1;
              updateHUD();
            } else {
              pet.currentActivity = transitionState.finalAct || transitionState.targetActivity;
              targetX = transitionState.finalTx ?? transitionState.tx;
              targetY = transitionState.finalTy ?? transitionState.ty;
              transitionState.phase = 'in';
              updateHUD();
            }
          }
        } else if (transitionState.phase === 'pass') {
          const tPass = Math.max(0, Math.min(1, (Date.now() - (transitionState.passStartAt || Date.now())) / 5000));
          petX = (transitionState.startX ?? petX) + (targetX - (transitionState.startX ?? petX)) * tPass;
          petY = (transitionState.startY ?? petY) + (targetY - (transitionState.startY ?? petY)) * tPass;
          if (Date.now() >= transitionState.passUntil) {
            const nextHop = transitionState.nextHop;
            const ne = transitionState.nextEdge || getDirEdgeCoords(getRoomMoveDir(pet.currentRoom, nextHop));
            transitionState.fromRoom = pet.currentRoom;
            transitionState.targetRoom = nextHop;
            transitionState.ex = ne.ex; transitionState.ey = ne.ey;
            transitionState.ix = ne.ix; transitionState.iy = ne.iy;
            transitionState.phase = 'out';
          }
        } else if (transitionState.phase === 'in') {
          petX += (targetX - petX) * 0.08; petY += (targetY - petY) * 0.08;
          transitionState.alpha = Math.min(1, transitionState.alpha + 0.05);
          if (transitionState.alpha >= 0.98) {
            transitionState = null;
            const pool = char.dialogues[pet.currentActivity] || char.dialogues.tea;
            if (viewRoomId === pet.currentRoom) speakAndShow(pickLine(pool));
            saveState();
          }
        }
        return;
      }

      if (pet.currentActivity === 'waking' && idleSec > 10) {
        pet.currentActivity = 'sleep';
        if (viewRoomId === pet.currentRoom) speakAndShow(char.dialogues.backToSleep[0]);
        updateHUD();
      }

      const _isWalkingNow = Boolean(duoWalk || petWalk || broWalk || transitionState || ['street', 'walking'].includes(pet.currentActivity) || Math.hypot(targetX - petX, targetY - petY) > 12 || (state.brother && Math.hypot(state.brother.tx - state.brother.px, state.brother.ty - state.brother.py) > 12));
      if (!_isWalkingNow && state.brother && pet.currentRoom === state.brother.currentRoom && pet.currentRoom !== 'bath' && !['sleep','waking','breakfast','lunch','dinner'].includes(pet.currentActivity)) {
        const bro = state.brother;
        if (Math.abs(targetX - bro.tx) < 92) {
          const mid = Math.max(150, Math.min(450, (targetX + bro.tx) / 2));
          targetX = mid - 50;
          bro.tx = mid + 50;
        }
      }
      if (duoWalk && !pet.toiletState) {
        const curStepMs = Array.isArray(duoWalk.stepMs) ? (duoWalk.stepMs[duoWalk.idx] || 5000) : (duoWalk.stepMs || 5000);
        const dt = Math.max(0, Math.min(1, (Date.now() - duoWalk.stepEnteredAt) / curStepMs));
        petX = (duoWalk.startX ?? petX) + (targetX - (duoWalk.startX ?? petX)) * dt;
        petY = (duoWalk.startY ?? petY) + (targetY - (duoWalk.startY ?? petY)) * dt;
        if (state.brother && state.brother.currentRoom === pet.currentRoom) {
          state.brother.px = (duoWalk.broStartX ?? state.brother.px) + (state.brother.tx - (duoWalk.broStartX ?? state.brother.px)) * dt;
          state.brother.py = (duoWalk.broStartY ?? state.brother.py) + (state.brother.ty - (duoWalk.broStartY ?? state.brother.py)) * dt;
        }
      } else if (!pet.toiletState && (pet.currentRoom === 'park' || pet.currentRoom === 'park2') && (pet.currentActivity === 'park_walk' || pet.currentActivity === 'park_jog') && !transitionState && !duoWalk) {
        if (!window.__parkDir) window.__parkDir = -1;
        const spd = pet.currentActivity === 'park_jog' ? 1.25 : 0.55;
        petX += window.__parkDir * spd;
        petY = 445; targetX = petX; targetY = 445;
        if (state.brother && (state.brother.currentRoom === 'park' || state.brother.currentRoom === 'park2')) {
          state.brother.currentRoom = pet.currentRoom;
          state.brother.currentActivity = pet.currentActivity;
          state.brother.px = Math.max(85, Math.min(515, petX + 85));
          state.brother.py = 445; state.brother.tx = state.brother.px; state.brother.ty = 445;
        }
        if (pet.currentRoom === 'park' && petX <= 92 && window.__parkDir === -1) {
          pet.currentRoom = 'park2'; petX = 505; targetX = 505;
          if (state.brother) { state.brother.currentRoom = 'park2'; state.brother.px = 535; state.brother.tx = 535; }
          if (viewRoomId === 'park') viewRoomId = 'park2';
          updateHUD();
        } else if (pet.currentRoom === 'park2' && petX <= 115 && window.__parkDir === -1) {
          window.__parkDir = 1;
        } else if (pet.currentRoom === 'park2' && petX >= 505 && window.__parkDir === 1) {
          pet.currentRoom = 'park'; petX = 95; targetX = 95;
          if (state.brother) { state.brother.currentRoom = 'park'; state.brother.px = 145; state.brother.tx = 145; }
          if (viewRoomId === 'park2') viewRoomId = 'park';
          updateHUD();
        } else if (pet.currentRoom === 'park' && petX >= 490 && window.__parkDir === 1) {
          window.__parkDir = -1;
        }
      } else {
        if (petWalk && !pet.recoverStage) {
          const pt = Math.max(0, Math.min(1, (Date.now() - petWalk.stepEnteredAt) / 5000));
          petX = (petWalk.startX ?? petX) + (targetX - (petWalk.startX ?? petX)) * pt;
          petY = (petWalk.startY ?? petY) + (targetY - (petWalk.startY ?? petY)) * pt;
        } else if (!rally.active && !(pet.currentRoom === 'bath' && pet.currentActivity === 'bath') && pet.currentActivity !== 'sleep' && pet.currentActivity !== 'waking') {
          const dx = targetX - petX, dy = targetY - petY;
          const _spd = (state.outing && state.outing.type === 'mall' && !state.mallCafeUntil) ? 0.015 : 0.045;
          if (Math.hypot(dx, dy) > 3) { petX += dx * _spd; petY += dy * _spd; }
        }
        if (state.brother) {
          const bro = state.brother;
          if (broWalk && !pet.recoverStage) {
            const bt = Math.max(0, Math.min(1, (Date.now() - broWalk.stepEnteredAt) / 5000));
            bro.px = (broWalk.startX ?? bro.px) + (bro.tx - (broWalk.startX ?? bro.px)) * bt;
            bro.py = (broWalk.startY ?? bro.py) + (bro.ty - (broWalk.startY ?? bro.py)) * bt;
          } else {
            const bdx = bro.tx - bro.px, bdy = bro.ty - bro.py;
            if (Math.hypot(bdx, bdy) > 3) { bro.px += bdx * 0.05; bro.py += bdy * 0.05; }
          }
        }
      }
      if (frameCount % 240 === 0) dreamIdx++;
    }

    function gameLoop() {
      try {
      frameCount++; updateAI();
      const char = getActiveChar(), pet = ensurePetState(char.id);
      const outfit = OUTFITS[pet.outfitIdx || 0] || OUTFITS[0];
      const timeInfo = getCurrentHourInfo();
      ctx.clearRect(0, 0, 600, 600);

      if (isZoomed) {
        drawLiveZoomedPortrait(pet, outfit, timeInfo, frameCount);
      } else {
        drawAnimeRoomBackground(viewRoomId, timeInfo);
        drawBrotherChibi(frameCount);
        if (pet.currentRoom === viewRoomId) drawArticulatedChibi(char, outfit, pet, frameCount);
        drawAnimeRoomForeground(viewRoomId, frameCount, pet);

        if (rally.active) {
          updateRally(pet);
          if (rally.turn === 'user') {
            ctx.strokeStyle = 'rgba(250, 204, 21, 0.85)'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.arc(rally.bx, rally.by, 42, 0, Math.PI * 2); ctx.stroke();
          }
          ctx.font = '52px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('🏐', rally.bx, rally.by + 16);
        } else if (pet.currentRoom === viewRoomId && (pet.currentRoom === 'school_court' || pet.currentRoom === 'backyard') && ['backyard', 'school_court', 'jump'].includes(pet.currentActivity)) {
          const by = 270 - Math.abs(Math.sin(frameCount * 0.14)) * 75;
          ctx.font = '44px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('🏐', petX + 65, by);
        }
      }

      if (flyingFood) {
        flyingFood.x += (flyingFood.targetX - flyingFood.x) * 0.18;
        flyingFood.y += (flyingFood.targetY - flyingFood.y) * 0.18;
        ctx.font = '44px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(flyingFood.emoji, flyingFood.x, flyingFood.y);
        if (Math.hypot(flyingFood.targetX - flyingFood.x, flyingFood.targetY - flyingFood.y) < 12) { completeFeed(flyingFood.food); flyingFood = null; }
      }

      if (isPetting) {
        ctx.save(); ctx.translate(handPos.x, handPos.y + Math.sin(frameCount * 0.3) * 8);
        ctx.font = '54px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('🫳', 0, 12); ctx.restore();
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i]; pt.y -= 1.6; pt.life--;
        ctx.fillStyle = pt.color; ctx.font = 'bold 26px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(pt.text, pt.x, pt.y);
        if (pt.life <= 0) particles.splice(i, 1);
      }
      } catch (e) { console.error('gameLoop error:', e); }
      requestAnimationFrame(gameLoop);
    }

    function grantCappedRewards(pet, expAmt, coinAmt) {
      let cappedNow = false;
      if (expAmt > 0) {
        const expCap = (state.balance && state.balance.dailyExpCap) ?? DAILY_EXP_CAP;
        const allowExp = Math.min(expAmt, Math.max(0, expCap - pet.dailyExpGained));
        if (allowExp > 0) {
          pet.dailyExpGained += allowExp; pet.bondExp += allowExp;
          const lStep = Math.max(1, (state.balance && state.balance.levelRewardStep) ?? 5);
          const lCoins = Math.max(0, (state.balance && state.balance.levelRewardCoins) ?? 100);
          while (pet.bondExp >= 100) {
            pet.bondExp -= 100; pet.bondLevel += 1; playSFX('levelup');
            if (pet.bondLevel % lStep === 0 && lCoins > 0) {
              const hPocket = Math.floor(lCoins / 2);
              pet.coins += lCoins; recordCoinLog(pet, `🎉 翔陽升到 Lv.${pet.bondLevel}`, lCoins, pet.coins);
              pet.pocketMoney = (pet.pocketMoney || 0) + hPocket;
              showToast(`🎉 翔陽升到 Lv.${pet.bondLevel}！哥哥 🪙+${lCoins}、翔陽零用錢 💵+${hPocket}！`);
            } else {
              showToast(`好感度升到 Lv.${pet.bondLevel}！💖`);
            }
          }
        } else cappedNow = true;
      }
      if (false && coinAmt > 0) {
        const allowCoins = Math.min(coinAmt, Math.max(0, DAILY_COINS_CAP - pet.dailyCoinsGained));
        if (allowCoins > 0) { pet.dailyCoinsGained += allowCoins; pet.coins += allowCoins; }
        else cappedNow = true;
      }
      return cappedNow;
    }

    function wakeUpCharacter() {

      pet.currentActivity = 'waking'; lastInteractAt = Date.now();

    function triggerPetHead(cx, cy) {
      const char = getActiveChar(), pet = ensurePetState(char.id);
      if (!isZoomed && pet.currentRoom !== viewRoomId) return;
      if (!isTouchingHinata(cx, cy)) { isPetting = false; return; }
      lastInteractAt = Date.now();
      if (pet.currentActivity === 'sleep') return;
      isPetting = true; handPos = { x: cx, y: cy }; petTickAcc++;
      if (petTickAcc % 8 === 1) {
        playSFX('pat');
        const isCapped = grantCappedRewards(pet, 3, 0);
        const pWin = Math.max(10, (state.balance && state.balance.petWindowMins) ?? 60);
        const pMax = Math.max(0, (state.balance && state.balance.petMaxMood) ?? 20);
        const hKey = String(Math.floor(Date.now() / (pWin * 60000)));
        if (pet.petHourKey !== hKey) { pet.petHourKey = hKey; pet.petHourMoodGained = 0; }
        const allowMood = Math.min(3, Math.max(0, pMax - (pet.petHourMoodGained || 0)));
        pet.petHourMoodGained = (pet.petHourMoodGained || 0) + allowMood;
        pet.mood = Math.min(100, pet.mood + allowMood);
        particles.push({ x: cx + (Math.random() * 34 - 17), y: cy - 20, text: '💖', color: '#f43f5e', life: 36 });
        if (petTickAcc % 24 === 1) speakAndShow(isCapped && Math.random() < 0.35 ? char.dialogues.capped[0] : pickLine(char.dialogues.pet));
        updateHUD(); saveState();

    canvas.addEventListener('pointerdown', (e) => {
      lastInteractAt = Date.now();

    function completeFeed(food) {
      const pet = ensurePetState(state.activeCharId);
      if (pet.recoverStage === 'infirmary' || pet.recoverStage === 'hospital') {
        showToast('醫護室休養緊，等回復 10% 先返屋企食白粥！🩺');
        return;
      }
      const nowMs = Date.now();
      pet.feedTimestamps = (pet.feedTimestamps || []).filter(ts => nowMs - ts < 8 * 3600 * 1000);
      if (!pet.fainted && (pet.hunger >= 100 || pet.feedTimestamps.length >= ((state.balance && state.balance.feedMaxPer8h) ?? 3))) {
        playSFX('miss');
        speakAndShow('「已經飽飽❤️」');
        showToast(pet.hunger >= 100 ? '翔陽已經飽飽❤️' : '8 小時內已經餵咗 3 次，已經飽飽❤️');
        return;
      }
      if (pet.fainted) {
        pet.fainted = false;
        pet.currentActivity = 'happy';
        pet.hunger = Math.max(15, pet.hunger);
        pet.energy = Math.max(15, pet.energy);
        showToast('餵食成功！翔陽醒返啦！✨');
      }
      pet.feedTimestamps.push(nowMs);
      if (pet.coins < food.cost) { showToast('金幣唔夠！玩「🏐 雙人對打」或「✊ 包剪揼」賺金幣'); return; }
      pet.coins -= food.cost; recordCoinLog(pet, `🍱 餵食 ${food.name}`, -food.cost, pet.coins);
      const fh0 = pet.hunger, fm0 = pet.mood, fe0 = pet.energy;
      pet.hunger = Math.min(100, pet.hunger + (food.hunger || 0));
      pet.mood = Math.min(100, pet.mood + (food.mood || 0));
      pet.energy = Math.min(100, pet.energy + (food.energy || 0));
      recordStatLog(pet, 'hunger', `🍱 餵食 ${food.name}`, fh0, pet.hunger);
      recordStatLog(pet, 'mood', `🍱 餵食 ${food.name}`, fm0, pet.mood);
      recordStatLog(pet, 'energy', `🍱 餵食 ${food.name}`, fe0, pet.energy);

      if (sTab) { if (sTab.dataset.smsTab === 'date') { openDateCalendar(false); return; } smsTab = sTab.dataset.smsTab; openMessageHinata(); return; }
      const cBtn = e.target.closest('[data-care-id]');
      if (cBtn) {
        const c = CARE_MESSAGES.find(x => x.id === cBtn.dataset.careId);
        if (!c) return;
        const today = getTodayStr();
        if (!state.msgLog || state.msgLog.date !== today) state.msgLog = { date: today, asked: {}, promises: {} };
        if (state.msgLog.asked[c.id]) return;
        state.msgLog.asked[c.id] = '已傳送';
        pet.mood = Math.min(100, pet.mood + 10);
        grantCappedRewards(pet, 4, 0);
        playSFX('levelup');
        lastSmsReplyText = `翔陽回覆：${c.reply}`; speakAndShow(lastSmsReplyText);
        particles.push({ x: 300, y: 240, text: '❤️ +10心情', color: '#f43f5e', life: 36 });
        openMessageHinata(); updateHUD(); saveState();
        return;
      }
      const calNav = e.target.closest('[data-cal-nav]');
      if (calNav) { calMonthOffset = Number(calNav.dataset.calNav); openDateCalendar(false); return; }
      const calDt = e.target.closest('[data-cal-date]');
      if (calDt) { openDateSlotEditor(calDt.dataset.calDate, calDt.dataset.calView === '1'); return; }
      const calBk = e.target.closest('[data-cal-back]');
      if (calBk) { openDateCalendar(calBk.dataset.calBack === '1'); return; }
      const slBtn = e.target.closest('[data-slot-idx]');
      if (slBtn) {
        const slot = DATE_SLOTS[Number(slBtn.dataset.slotIdx)];
        const loc = slBtn.dataset.slotLoc;
        if (draftDatePlan[slot] === loc) delete draftDatePlan[slot];
        else draftDatePlan[slot] = loc;
        // re-render editor preserving draftDatePlan
        const savedTemp = state.dates[calSelectedDate];
        state.dates[calSelectedDate] = { ...(savedTemp || {}), slots: { ...draftDatePlan } };
        openDateSlotEditor(calSelectedDate, false);
        if (savedTemp) state.dates[calSelectedDate] = savedTemp; else delete state.dates[calSelectedDate];

    // 香港永久公眾假期（紅假）自動推算引擎（支援 2026 年 11 月起及後續任何年份）
    // =========================================================================
    function getEasterSunday(year) {
      const a = year % 19, b = Math.floor(year / 100), c = year % 100;
      const d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
      const g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
      const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7;
      const m = Math.floor((a + 11 * h + 22 * l) / 451);
      const month = Math.floor((h + l - 7 * m + 114) / 31);
      const day = ((h + l - 7 * m + 114) % 31) + 1;
      return new Date(year, month - 1, day);
    }
    function getLunarInfo(dateObj) {
      try {
        const parts = new Intl.DateTimeFormat('en-u-ca-chinese', { month: 'numeric', day: 'numeric' }).formatToParts(dateObj);
        let m = 0, d = 0;
        for (const p of parts) {
          if (p.type === 'month') m = parseInt(p.value, 10);
          if (p.type === 'day') d = parseInt(p.value, 10);
        }
        return { m, d };
      } catch (e) { return { m: 0, d: 0 }; }
    }
    const _hkHolidayCache = {};
    function getHKHolidaysForYear(year) {
      if (_hkHolidayCache[year]) return _hkHolidayCache[year];
      const map = {};
      const fmt = (dt) => `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
      const addH = (dt, name) => { map[fmt(dt)] = name; };
      const addSolarSubst = (month, day, name) => {
        const dt = new Date(year, month - 1, day);
        if (dt.getDay() === 0) dt.setDate(dt.getDate() + 1);
        addH(dt, name);
      };
      addSolarSubst(1, 1, '元旦');
      addSolarSubst(5, 1, '勞動節');
      addSolarSubst(7, 1, '香港特區成立紀念日');
      addSolarSubst(10, 1, '國慶日');
      // Ching Ming (Apr 4 or Apr 5)
      const qmDay = (year % 4 === 0 && year >= 2008) ? 4 : 5;
      addSolarSubst(4, qmDay, '清明節');
      // Easter (Good Friday, Sat, Easter Monday)
      const eas = getEasterSunday(year);
      const gf = new Date(eas); gf.setDate(eas.getDate() - 2); addH(gf, '耶穌受難節');
      const gs = new Date(eas); gs.setDate(eas.getDate() - 1); addH(gs, '耶穌受難節翌日');
      const em = new Date(eas); em.setDate(eas.getDate() + 1); addH(em, '復活節星期一');
      // Christmas & Boxing Day
      const xmas = new Date(year, 11, 25);
      if (xmas.getDay() === 0) { addH(new Date(year, 11, 26), '聖誕節後第一個週日'); addH(new Date(year, 11, 27), '聖誕節補假'); }
      else if (xmas.getDay() === 6) { addH(xmas, '聖誕節'); addH(new Date(year, 11, 28), '聖誕節後第一個週日補假'); }
      else if (xmas.getDay() === 5) { addH(xmas, '聖誕節'); addH(new Date(year, 11, 26), '聖誕節後第一個週日'); }
      else { addH(xmas, '聖誕節'); addH(new Date(year, 11, 26), '聖誕節後第一個週日'); }

      // Scan entire year for Lunar holidays (CNY 1/1-1/3, Buddha 4/8, Tuen Ng 5/5, Mid-Autumn 8/16, Chung Yeung 9/9)
      for (let m = 0; m < 12; m++) {
        const daysInM = new Date(year, m + 1, 0).getDate();
        for (let d = 1; d <= daysInM; d++) {
          const dt = new Date(year, m, d);
          const lu = getLunarInfo(dt);
          if (lu.m === 1 && lu.d === 1) {
            for (let k = 0; k < 3; k++) {
              const cdt = new Date(year, m, d + k);
              if (cdt.getDay() === 0) { const nx = new Date(year, m, d + 3); addH(nx, '農曆新年補假'); }
              else addH(cdt, `農曆年初${['一','二','三'][k]}`);
            }
          } else if (lu.m === 4 && lu.d === 8) addSolarSubst(m + 1, d, '佛誕');
          else if (lu.m === 5 && lu.d === 5) addSolarSubst(m + 1, d, '端午節');
          else if (lu.m === 8 && lu.d === 16) addSolarSubst(m + 1, d, '中秋節翌日');
          else if (lu.m === 9 && lu.d === 9) addSolarSubst(m + 1, d, '重陽節');
        }
      }
      _hkHolidayCache[year] = map;
      return map;
    }
    function isDateSelectableHolidayOrWeekend(dateStr) {
      const [y, m, d] = dateStr.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      const day = dt.getDay();
      const hols = getHKHolidaysForYear(y);
      if (day === 0 || day === 6) return { ok: true, tag: day === 6 ? '星期六' : '星期日', isRed: day === 0 };
      if (hols[dateStr]) return { ok: true, tag: hols[dateStr], isRed: true };
      if (state.holidayDate === dateStr) return { ok: true, tag: '二人假期', isRed: true };
      return { ok: false, tag: '', isRed: false };
    }

    function pickHinataLetter() {
      if (!state.mailbox) state.mailbox = { items: [], lastMailDate: null, lastInviteDate: null, recentLetterIdxs: [] };
      if (!Array.isArray(state.mailbox.recentLetterIdxs)) state.mailbox.recentLetterIdxs = [];
      const recent = state.mailbox.recentLetterIdxs;
      const pool = [];
      for (let i = 0; i < HINATA_LETTERS.length; i++) {
        if (!recent.includes(i)) pool.push(i);
      }
      const pickIdx = pool.length ? pool[Math.floor(Math.random() * pool.length)] : Math.floor(Math.random() * HINATA_LETTERS.length);
      recent.push(pickIdx);
      if (recent.length > 10) recent.shift();
      return HINATA_LETTERS[pickIdx];
    }

    function openMailboxModal(expandDrawer = null) {
      if (!state.mailbox) state.mailbox = { items: [], lastMailDate: null, lastInviteDate: null, recentLetterIdxs: [] };
      if (expandDrawer !== null) smsDrawerOpen = !!expandDrawer;
      const pet = ensurePetState(state.activeCharId);
      const info = getCurrentHourInfo();
      const sched = getScheduledState(info);
      const items = state.mailbox.items || [];
      if (items.length > 20) state.mailbox.items = items.slice(-20);
      state.mailbox.items.forEach(it => { if (it.type !== 'invite') it.read = true; });
      updateMailboxBadge(); saveState();

      const modal = document.getElementById('sms-chat-modal');
      const statusEl = document.getElementById('sms-chat-status');
      const atSchool = ['school_class', 'school_court', 'school_hall', 'school_tuckshop', 'school_toilet', 'school_infirmary'].includes(pet.currentRoom);
      if (statusEl) statusEl.textContent = atSchool ? `🏫 ${sched.label}（回覆約需 10 秒）` : `📍 ${sched.label} · ${MAP_ROOMS[pet.currentRoom]?.short || ''}`;

      const listEl = document.getElementById('sms-chat-list');
      const chatHtml = state.mailbox.items.length ? state.mailbox.items.map((it, idx) => {
        const isBro = it.sender === 'brother';
        if (it.type === 'invite' && !it.answered) {
          return `<div class="flex items-end gap-1.5">
            <img src="./assets/chibiJersey.png?v=69" class="w-8 h-8 rounded-full border-2 border-[#2d1e12] bg-amber-100 object-cover object-top shrink-0" alt="翔陽" />
            <div class="bg-rose-50 border-2 border-rose-400 rounded-2xl rounded-tl-sm p-2.5 text-[11px] font-bold max-w-[80%] shadow-xs">
              <div class="text-rose-700 font-black mb-1">💌 約會邀請（${it.date} ${it.slot}）</div>
              <div class="mb-1.5 text-[#2d1e12]">${it.text}</div>
              <div class="flex flex-wrap gap-1.5">
                <button type="button" data-inv-idx="${idx}" data-inv-ans="yes" class="px-2.5 py-1 rounded-lg bg-emerald-500 text-white border border-[#2d1e12] text-[10px] font-black">💖 答應 (+70心情/精力)</button>
                <button type="button" data-inv-idx="${idx}" data-inv-ans="no" class="px-2.5 py-1 rounded-lg bg-slate-200 text-[#2d1e12] border border-[#2d1e12] text-[10px] font-black">😢 拒絕 (-20心情)</button>
              </div>
            </div>
          </div>`;
        }
        if (isBro) {
          return `<div class="flex items-end justify-end gap-1.5">
            <div class="flex flex-col items-end max-w-[78%]">
              <div class="bg-orange-400 text-white border-2 border-[#2d1e12] rounded-2xl rounded-tr-sm px-3 py-1.5 text-xs font-bold shadow-xs">${it.text}</div>
              <span class="text-[9px] text-slate-500 mt-0.5 pr-1">${it.timeStr || ''}</span>
            </div>
            <img src="./assets/chibiBrother.png?v=69" class="w-8 h-8 rounded-full border-2 border-[#2d1e12] bg-sky-100 object-cover object-top shrink-0" alt="哥哥" />
          </div>`;
        }
        return `<div class="flex items-end gap-1.5">
          <img src="./assets/chibiJersey.png?v=69" class="w-8 h-8 rounded-full border-2 border-[#2d1e12] bg-amber-100 object-cover object-top shrink-0" alt="翔陽" />
          <div class="flex flex-col items-start max-w-[78%]">
            <div class="bg-white text-[#2d1e12] border-2 border-[#2d1e12] rounded-2xl rounded-tl-sm px-3 py-1.5 text-xs font-bold shadow-xs whitespace-pre-line">${it.text}</div>
            <span class="text-[9px] text-slate-500 mt-0.5 pl-1">${it.timeStr || ''}</span>
          </div>
        </div>`;
      }).join('') : '<div class="text-center text-xs text-slate-500 py-8">暫時未有短訊紀錄～點擊下方選擇關心訊息開始傾計吧！📱</div>';
      listEl.innerHTML = chatHtml;

      const lastItem = state.mailbox.items[state.mailbox.items.length - 1];
      const hasProactive = lastItem && lastItem.sender !== 'brother' && lastItem.type === 'letter';
      const qReplies = hasProactive ? getLetterQuickReplies(lastItem.text) : [];
      const ctxOpts = getContextChatOptions(pet, info);
      const qDrawer = document.getElementById('sms-quick-drawer');
      if (qDrawer) {
        qDrawer.innerHTML = qReplies.length
          ? `<div class="text-[10px] font-black text-rose-700 px-1">↩️ 回覆翔陽嘅訊息：</div>` + qReplies.map(o => `<button type="button" data-sms-send="${encodeURIComponent(o.label)}" data-sms-reply="${encodeURIComponent(o.reply)}" class="w-full text-left px-2.5 py-1.5 rounded-xl bg-rose-50 hover:bg-rose-100 border border-rose-300 text-[11px] font-bold text-[#2d1e12]">${o.label}</button>`).join('')
          : '<div class="text-center text-[11px] text-slate-500 py-2">暫時未有翔陽新訊息需要回覆～💌</div>';
        qDrawer.classList.add('hidden');
      }
      const cDrawer = document.getElementById('sms-ctx-drawer');
      if (cDrawer) {
        cDrawer.innerHTML = `<div class="text-[10px] font-black text-sky-700 px-1">📍 當前場景問候（${MAP_ROOMS[pet.currentRoom]?.name || ''}）：</div>` +

        cDrawer.classList.add('hidden');
      }
      const pDrawer = document.getElementById('sms-promise-drawer');
      if (pDrawer) {
        const todayP = getTodayStr();
        if (!state.msgLog || state.msgLog.date !== todayP) state.msgLog = { date: todayP, asked: {}, promises: {} };
        pDrawer.innerHTML = SMS_QUESTIONS.map(q => {
          const askedText = state.msgLog.asked[q.id];
          if (askedText) {
            return `<button type="button" disabled class="w-full text-left px-2.5 py-1.5 rounded-xl bg-slate-200 text-slate-500 border border-slate-300 text-[11px] font-bold opacity-80">🔒 ${q.title}<div class="text-[10px] text-emerald-700">✓ 今日已覆：${askedText}</div></button>`;
          }
          return `<button type="button" data-sms-promise="${q.id}" class="w-full text-left px-2.5 py-1.5 rounded-xl bg-sky-50 hover:bg-sky-100 text-[#2d1e12] border border-sky-400 text-[11px] font-black">${q.title}</button>`;
        }).join('');
        pDrawer.classList.add('hidden');
      }

      modal.classList.remove('hidden');
      requestAnimationFrame(() => { listEl.scrollTop = listEl.scrollHeight; });
    }
